name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "PyYAML>=6.0"
      - name: Distribution integrity
        run: python tests/check_distribution.py
      - name: Installer smoke test
        run: python tests/smoke_test.py
      - name: Guided install, upgrade and doctor
        run: python tests/test_cli.py
      - name: Router
        run: python tests/test_route.py
      - name: Guard hook
        run: python tests/test_hook.py
      - name: Scenario scorer
        run: python tests/test_eval_scoring.py
      - name: Project detection
        run: python tests/test_detect.py
      - name: Specification check
        run: python tests/test_spec.py
      - name: Security scan
        run: python tests/test_scan.py
      - name: Mutation testing
        run: python tests/test_mutate.py
      - name: Project checks
        run: python tests/test_check.py
      - name: Release gate
        run: python tests/test_release.py
      - name: Learned rules
        run: python tests/test_learn.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
