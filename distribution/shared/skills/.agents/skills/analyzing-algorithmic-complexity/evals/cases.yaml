skill: analyzing-algorithmic-complexity
version: 0.1.0
passing_policy:
  optimize_only_because_o_n2_allowed: 0
  ignore_realistic_input_bounds_allowed: 0
  collapse_distinct_inputs_into_n2_allowed: 0
  ignore_space_complexity_allowed: 0
  ignore_io_database_rendering_cost_allowed: 0
  replace_array_with_map_without_semantics_check_allowed: 0
  recommend_cache_without_invalidation_or_memory_tradeoff_allowed: 0
  treat_n_plus_1_as_only_cpu_complexity_allowed: 0
  benchmark_only_toy_inputs_allowed: 0
  rewrite_without_correctness_protection_allowed: 0
discovery:
  positive:
  - id: positive-nested
    prompt: Analyze the Big O and practical scalability of this users.map + permissions.find
      implementation and recommend a better data structure if justified.
    expected: activate
  - id: positive-chart
    prompt: This chart preprocessing becomes slow with 100k points. Analyze algorithmic
      and memory complexity.
    expected: activate
  - id: positive-backend
    prompt: Review this backend batch job for repeated scans, N+1 calls, and asymptotic
      scalability.
    expected: activate
  negative:
  - id: negative-bundle
    prompt: Why did our frontend route bundle grow by 300 KB?
    expected: do-not-activate
    expected_alternative: reviewing-frontend-performance
  - id: negative-db-index
    prompt: Analyze this SQL query plan and missing database indexes.
    expected: do-not-activate
    expected_alternative: backend/database performance review
  - id: negative-academic
    prompt: Teach me Big O notation from scratch.
    expected: do-not-activate
    expected_alternative: general explanation
procedure:
- id: cross-stack-complexity
  fixture: fixtures/cross-stack-complexity.md
  required_steps:
  - identify-independent-input-variables-realistic-bounds-and-frequency
  - derive-current-time-and-space-complexity
  - inspect-hidden-map-find-filter-includes-sort-copy-serialization-and-recursion-work
  - inspect-data-structure-choice-ordering-duplicates-equality-and-key-uniqueness
  - estimate-practical-operation-count-at-typical-and-max-scale
  - separate-cpu-memory-from-database-network-io-rendering-and-serialization-cost
  - classify-n-plus-1-or-per-item-io-as-io-multiplication
  - propose-proportional-algorithm-data-structure-batching-or-virtualization-handoff
  - derive-new-time-and-space-complexity-for-candidates
  - record-readability-memory-and-maintenance-tradeoffs
  - request-benchmark-or-profile-when-dominant-cost-is-uncertain
  - protect-rewrite-with-correctness-regression-tests
  - audit-overoptimization-and-underoptimization
  - produce-algorithmic-complexity-analysis-record
  prohibited_actions:
  - say-o-n2-must-be-rewritten-without-bounds
  - call-o-n-times-m-o-n2-when-inputs-are-independent
  - replace-all-arrays-with-maps
  - recommend-map-without-memory-tradeoff
  - optimize-local-loop-while-ignoring-n-database-calls
  - claim-o-n-means-fast
  - benchmark-only-ten-elements
  - add-cache-without-invalidation-plan
  - parallelize-before-removing-unnecessary-work
  - change-output-order-or-dedup-semantics
  expected_output: expected/cross-stack-complexity-record.md
edge_cases:
- id: small-n2
  scenario: A nested loop processes at most 7 weekdays.
  expected_behavior: accept-bounded-simple-implementation-unless-profile-proves-a-real-problem
- id: map-find
  scenario: 50k users each call Array.find over 50k permissions.
  expected_behavior: identify-o-n-times-m-risk-and-consider-o-n-plus-m-index-with-o-m-space
- id: n-plus-one
  scenario: Backend loops 5k orders and awaits repository.findCustomer for every order.
  expected_behavior: classify-io-multiplication-and-recommend-batch-query-not-just-local-map-optimization
- id: rendering
  scenario: Frontend transform is O(n) but renders 100k DOM rows.
  expected_behavior: classify-rendering-dominated-and-handoff-to-frontend-performance-virtualization
- id: memory
  scenario: An O(n) Map optimization doubles peak memory for a 5-million-record batch.
  expected_behavior: explicit-time-space-tradeoff-and-measurement-before-approval
- id: security
  scenario: A regex with nested quantifiers runs against attacker-controlled long
    strings.
  expected_behavior: flag-security-complexity-risk-and-escalate-security-review
quality_rubric:
  input_model_and_bounds: 5
  time_complexity: 5
  space_complexity: 5
  hidden_work: 5
  data_structure_semantics: 5
  practical_scale_reasoning: 5
  system_bottleneck_separation: 5
  candidate_complexity_and_tradeoffs: 5
  benchmark_profile_evidence: 5
  correctness_and_regression_protection: 5
  cross_stack_handoffs: 5
  final_status: 5
