skill: implementing-tailwind-ui
version: 0.1.0
passing_policy:
  tailwind_profile_mismatch_allowed: 0
  semantic_token_replaced_by_arbitrary_value_allowed: 0
  unbounded_dynamic_class_generation_allowed: 0
  contradictory_boolean_variants_allowed: 0
  new_cva_or_merge_tool_without_approval_allowed: 0
  routine_important_modifier_allowed: 0
  duplicate_project_primitive_allowed: 0
  raw_dark_palette_pairs_when_semantic_theme_token_exists_allowed: 0
  giant_safelist_allowed: 0
  huge_class_string_snapshot_as_primary_test_allowed: 0
discovery:
  positive:
  - id: positive-tailwind
    prompt: Implement this component using our existing Tailwind theme, variants,
      responsive conventions, and shared primitives.
    expected: activate
  - id: positive-conflict
    prompt: Resolve this Tailwind base/variant/className conflict using the project's
      existing merge policy.
    expected: activate
  - id: positive-arbitrary
    prompt: Review these Tailwind arbitrary values and decide which should use theme
      tokens.
    expected: activate
  negative:
  - id: negative-select
    prompt: Should this application use Tailwind or CSS Modules?
    expected: do-not-activate
    expected_alternative: selecting-frontend-styling-profile
  - id: negative-cssmodules
    prompt: Implement this scoped component in the project's CSS Modules profile.
    expected: do-not-activate
    expected_alternative: implementing-css-modules-ui
  - id: negative-tokens
    prompt: Create the application's semantic design-token taxonomy.
    expected: do-not-activate
    expected_alternative: managing-frontend-design-tokens
procedure:
- id: promotion-card-tailwind
  fixture: fixtures/promotion-card-tailwind.md
  required_steps:
  - confirm-tailwind-version-theme-primitives-dark-responsive-and-merge-policy
  - identify-component-semantics-and-explicit-variant-contract
  - compose-readable-utilities-without-premature-extraction
  - evaluate-long-class-list-by-readability-and-semantic-reuse
  - replace-repeated-button-classes-with-existing-primitive-or-justified-feature-abstraction
  - replace-arbitrary-semantic-values-with-existing-theme-tokens-and-record-token-gaps
  - implement-responsive-variant-according-to-viewport-or-container-semantics
  - align-dark-mode-with-project-semantic-theme-strategy
  - resolve-base-variant-caller-class-conflicts-intentionally
  - avoid-unbounded-dynamic-classes-important-and-giant-safelists
  - preserve-focus-reflow-reduced-motion-and-accessibility
  - define-browser-visual-evidence-for-responsive-theme-behavior
  - audit-tailwind-overmodeling-and-primitive-duplication
  - produce-tailwind-record
  prohibited_actions:
  - install-cva
  - install-tailwind-merge
  - use-bg-hex-when-warning-token-exists
  - build-bg-class-from-provider-string
  - create-101-progress-utilities
  - use-important-to-win-normal-conflict
  - duplicate-company-button-classes
  - use-dark-raw-palette-when-bg-surface-token-exists
  - create-giant-safelist
  - snapshot-entire-class-string
  expected_output: expected/promotion-card-tailwind-record.md
edge_cases:
- id: long-class-list
  scenario: One card element has 25 utilities spanning layout, typography, interaction,
    responsive, and state concerns.
  expected_behavior: format-and-review-semantic-cohesion-extract-only-if-readability-or-reuse-justifies
- id: repeated-button
  scenario: Four features copy the same button utility string while a company Button
    primitive exists.
  expected_behavior: use-company-button-variant-api-not-duplicate-raw-classes
- id: responsive
  scenario: Card changes layout based on narrow sidebar versus wide main area.
  expected_behavior: prefer-project-container-responsive-strategy-over-arbitrary-viewport-breakpoint-when-supported
- id: arbitrary-token
  scenario: Component uses bg-[#fff2f0] but project has bg-warning-surface.
  expected_behavior: use-semantic-theme-token
- id: dark-mode
  scenario: Component uses bg-white dark:bg-slate-950 while bg-surface already changes
    per theme.
  expected_behavior: use-semantic-bg-surface-and-avoid-duplicate-dark-pair
- id: class-conflict
  scenario: Base has px-4, size variant has px-2, and caller className has px-6.
  expected_behavior: define-intended-precedence-and-use-existing-project-merge-policy
quality_rubric:
  profile_theme_and_primitives: 5
  utility_readability: 5
  semantic_reuse_and_variants: 5
  arbitrary_values_and_tokens: 5
  responsive_behavior: 5
  dark_theme_behavior: 5
  class_conflict_resolution: 5
  dynamic_classes_and_build_safety: 5
  accessibility: 5
  testing_and_visual_evidence: 5
  overmodeling_restraint: 5
  final_status: 5
