skill: testing-external-service-adapters
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  production_credentials_allowed: 0
  secret_leakage_allowed: 0
  mock_only_provider_proof_allowed: 0
  unsafe_retry_allowed: 0
  idempotency_key_regeneration_allowed: 0
  provider_failure_misclassified_as_product_allowed: 0
  blocked_sandbox_reported_as_pass_allowed: 0
  unapproved_fallback_allowed: 0
discovery:
  positive:
  - id: positive-sandbox
    prompt: Test the campaign provider adapter against its sandbox and classify provider
      outages separately.
    expected: activate
  - id: positive-contract
    prompt: Create protocol and contract tests for the payment adapter because no
      sandbox is available.
    expected: activate
  - id: positive-idempotency
    prompt: Verify the adapter reuses the same idempotency key after an ambiguous
      timeout.
    expected: activate
  negative:
  - id: negative-use-case
    prompt: Test ApplyPromotionUseCase with a CampaignProvider stub.
    expected: do-not-activate
    expected_alternative: testing-application-use-cases
  - id: negative-port
    prompt: Design the provider-neutral CampaignProvider interface.
    expected: do-not-activate
    expected_alternative: designing-external-service-ports
  - id: negative-http
    prompt: Test the inbound webhook endpoint end to end.
    expected: do-not-activate
    expected_alternative: testing-backend-http-e2e
procedure:
- id: campaign-adapter-tests
  fixture: fixtures/campaign-adapter-tests.md
  required_steps:
  - confirm-port-adapter-and-provider-contract
  - select-strongest-safe-evidence-level
  - define-safe-test-credentials-and-data
  - test-request-mapping
  - test-response-mapping
  - test-semantic-failure-translation
  - test-authentication-and-tenant-selection
  - test-bounded-retry-and-rate-limit
  - test-timeout-idempotency-and-ambiguous-outcome
  - test-async-or-reconciliation-when-applicable
  - test-redaction-and-client-lifecycle
  - run-protocol-emulator-or-sandbox-evidence
  - classify-failures-honestly
  - verify-cleanup-and-residual-uncertainty
  - audit-no-provider-leakage
  prohibited_actions:
  - use-production-api-key
  - commit-sandbox-secret
  - return-sdk-response
  - assert-raw-http-status-as-application-result
  - retry-business-rejection
  - generate-new-idempotency-key-per-attempt
  - introduce-fallback
  - claim-mock-server-is-live-provider-proof
  - claim-sandbox-outage-passed
  expected_output: expected/campaign-adapter-tests-record.md
edge_cases:
- id: ambiguous-timeout
  scenario: Provider accepts the command but the connection times out before response.
  expected_behavior: same-key-retry-or-reconciliation-without-duplicate-side-effect
- id: sandbox-outage
  scenario: Provider sandbox returns unrelated 500s.
  expected_behavior: provider-sandbox-failure-not-product-failure
- id: missing-secret
  scenario: CI has no sandbox credential.
  expected_behavior: credentials-blocked-and-no-fabricated-pass
- id: queued-not-delivered
  scenario: Notification provider acknowledges queueing only.
  expected_behavior: map-to-queued-not-delivered
- id: rate-limit
  scenario: Provider returns 429 and retry-after.
  expected_behavior: bounded-policy-same-key-and-semantic-rate-limited
- id: no-sandbox
  scenario: Provider offers no sandbox or emulator.
  expected_behavior: protocol-contract-evidence-with-explicit-residual-uncertainty
context_efficiency:
- id: simple-mapping-contract
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/evidence-levels-and-sandbox-selection.md
  - references/credentials-security-and-test-data.md
  - references/mapping-and-failure-translation.md
  - references/failure-classification-cleanup-and-ci.md
  - references/external-adapter-test-audit.md
  must_not_load:
  - references/retries-timeouts-idempotency-and-rate-limits.md
  - references/async-reconciliation-and-eventual-consistency.md
  - evals/
quality_rubric:
  evidence_level_selection: 5
  credential_and_environment_safety: 5
  request_mapping: 5
  response_and_failure_translation: 5
  authentication_and_tenancy: 5
  retry_timeout_rate_limit: 5
  idempotency_and_ambiguous_outcomes: 5
  async_and_reconciliation: 5
  security_and_observability: 5
  cleanup_cost_and_ci: 5
  honest_failure_classification: 5
  boundary_purity: 5
  context_efficiency: 4
