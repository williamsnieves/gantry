skill: testing-react-components
version: 0.1.0
passing_policy:
  implementation_detail_assertions_allowed: 0
  internal_hook_assertions_allowed: 0
  setter_or_dispatch_assertions_allowed: 0
  brittle_dom_path_allowed: 0
  incidental_css_class_assertions_allowed: 0
  global_fetch_mock_allowed_when_realistic_boundary_selected: 0
  server_state_internals_allowed: 0
  axe_as_conformance_allowed: 0
  arbitrary_sleep_allowed: 0
  duplicate_lower_level_case_without_ui_purpose_allowed: 0
discovery:
  positive:
  - id: positive-component
    prompt: Implement user-centered React component tests for loading, error, success,
      keyboard, and form submission.
    expected: activate
  - id: positive-focus
    prompt: Add component regression tests for focus restoration and preserved input
      after a server rejection.
    expected: activate
  - id: positive-dependency
    prompt: Test this React component with injected feature dependencies and MSW-backed
      server behavior.
    expected: activate
  negative:
  - id: negative-strategy
    prompt: Plan the testing layers for the feature.
    expected: do-not-activate
    expected_alternative: planning-frontend-test-strategy
  - id: negative-hook
    prompt: Test the custom hook state machine independently.
    expected: do-not-activate
    expected_alternative: testing-react-hooks
  - id: negative-visual
    prompt: Verify responsive pixel layout across themes in a real browser.
    expected: do-not-activate
    expected_alternative: testing-frontend-visual-regressions
procedure:
- id: promotion-component-tests
  fixture: fixtures/promotion-component-testing.md
  required_steps:
  - confirm-component-contract-test-strategy-and-accessibility
  - select-only-component-level-behaviors
  - map-semantic-queries
  - configure-minimal-providers-and-semantic-dependencies
  - use-realistic-http-boundary-for-representative-integrated-cases
  - test-loading-ready-submitting-success-error-retry-and-disabled-when-applicable
  - drive-form-and-actions-through-user-interaction
  - test-keyboard-and-focus-contract
  - verify-state-preservation-and-status-messages
  - add-automated-accessibility-evidence-without-conformance-claim
  - remove-internal-state-hook-library-dom-and-css-coupling
  - isolate-cache-handlers-timers-and-test-data
  - escalate-layout-or-browser-fidelity-out-of-component-tests
  - run-focused-tests-and-record-evidence
  prohibited_actions:
  - assert-set-state-call
  - assert-swr-is-validating-field
  - mock-global-fetch
  - query-generated-css-class
  - assert-wrapper-child-count
  - sleep-fixed-time
  - snapshot-every-state
  - duplicate-every-adapter-error
  - claim-axe-proves-wcag
  - use-jsdom-to-prove-layout
  - patch-global-production-container
  expected_output: expected/promotion-component-test-record.md
edge_cases:
- id: loading
  scenario: Promotion summary is loading.
  expected_behavior: assert-user-visible-or-accessible-loading-state-not-spinner-internals
- id: empty
  scenario: No promotion exists.
  expected_behavior: assert-explicit-empty-state-and-valid-action
- id: form
  scenario: User submits a campaign code.
  expected_behavior: drive-labelled-input-and-semantic-submit-then-assert-outcome
- id: keyboard
  scenario: Dialog opens and closes through keyboard.
  expected_behavior: assert-role-name-focus-escape-and-restoration-where-supported
- id: server-error
  scenario: Expired promotion preserves the entered code and displays a semantic error.
  expected_behavior: assert-preserved-input-message-and-recovery-not-provider-code
- id: visual
  scenario: Sticky footer obscures focus only at 400 percent zoom.
  expected_behavior: escalate-to-real-browser-or-visual-test
- id: axe
  scenario: Automated accessibility scan reports zero violations.
  expected_behavior: record-as-evidence-not-wcag-conformance
quality_rubric:
  semantic_queries: 5
  user_interaction: 5
  state_coverage: 5
  form_behavior: 5
  keyboard_and_focus: 5
  dependency_injection: 5
  http_and_server_state_boundary: 5
  accessibility_evidence: 5
  async_and_isolation: 5
  anti_brittleness: 5
  regression_and_escalation: 5
  focused_execution_and_scope: 5
