skill: wiring-backend-composition
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  runtime_di_container_allowed: 0
  service_locator_allowed: 0
  application_factory_import_allowed: 0
  transient_shared_client_allowed: 0
  cached_use_case_allowed: 0
  scattered_environment_reads_allowed: 0
  missing_test_reset_allowed: 0
discovery:
  positive:
  - id: positive-wire-slice
    prompt: Wire the repository, provider adapter, ApplyPromotion Use Case, and controller
      in the explicit backend factory.
    expected: activate
  - id: positive-lifecycle
    prompt: Fix composition so Prisma and SDK clients are shared but Use Cases remain
      transient.
    expected: activate
  - id: positive-reset
    prompt: Add deterministic reset and shutdown behavior for module-level composition
      caches.
    expected: activate
  negative:
  - id: negative-repository
    prompt: Implement the PostgreSQL repository adapter.
    expected: do-not-activate
    expected_alternative: implementing-repository-adapters
  - id: negative-use-case
    prompt: Design the ApplyPromotion Use Case.
    expected: do-not-activate
    expected_alternative: designing-application-use-cases
  - id: negative-controller
    prompt: Implement the HTTP controller behavior.
    expected: do-not-activate
    expected_alternative: implementing-http-controllers
  - id: negative-container
    prompt: Add a runtime token-based DI container for all services.
    expected: do-not-proceed
procedure:
- id: promotion-composition
  fixture: fixtures/promotion-composition.md
  required_steps:
  - confirm-composition-readiness
  - inventory-dependency-graph
  - classify-lifecycles
  - centralize-and-validate-configuration
  - select-concrete-adapters
  - implement-cached-get-factories
  - implement-transient-create-factories
  - wire-controller-to-use-case
  - implement-startup-and-shutdown
  - implement-deterministic-test-reset
  - test-lifecycle-and-selection
  - audit-service-locator-and-import-boundaries
  prohibited_actions:
  - add-runtime-di-container
  - add-generic-resolve
  - import-factory-from-use-case
  - construct-prisma-per-request
  - construct-sdk-per-request
  - cache-use-case
  - read-process-env-in-application
  - omit-reset
  expected_output: expected/promotion-composition-report.md
edge_cases:
- id: shared-database
  scenario: Two repository factories request the database client.
  expected_behavior: same-cached-client
- id: transient-use-case
  scenario: ApplyPromotion Use Case is requested twice.
  expected_behavior: different-use-case-instances-with-shared-adapters
- id: unsupported-provider
  scenario: Configuration selects an unknown campaign provider.
  expected_behavior: fail-fast-no-silent-fallback
- id: partial-startup
  scenario: Provider client initializes but database startup fails.
  expected_behavior: close-created-resources
- id: test-reset
  scenario: Reset is called before initialization and then twice after initialization.
  expected_behavior: safe-and-idempotent
- id: factory-in-application
  scenario: Use Case imports getPromotionRepository.
  expected_behavior: reject-and-use-constructor-injection
context_efficiency:
- id: small-slice
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/composition-readiness-and-graph.md
  - references/factory-lifecycle-and-adapter-selection.md
  - references/configuration-startup-and-shutdown.md
  - references/test-reset-and-composition-testing.md
  - references/service-locator-and-boundary-guardrails.md
  must_not_load:
  - references/refactoring-existing-composition.md
  - evals/
quality_rubric:
  composition_readiness: 5
  graph_clarity: 5
  lifecycle_correctness: 5
  configuration_validation: 5
  adapter_selection: 5
  explicit_factory_design: 5
  startup_shutdown: 5
  test_reset: 5
  boundary_purity: 5
  security: 5
  test_quality: 5
  non_speculation: 5
  context_efficiency: 4
