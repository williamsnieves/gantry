skill: defining-functional-requirements
version: 0.1.0
passing_policy:
  invent_behavior_allowed: 0
  invent_actor_allowed: 0
  mandatory_modality_without_authority_allowed: 0
  compound_unrelated_behavior_in_one_fr_allowed: 0
  oversplit_internal_steps_allowed: 0
  architecture_implementation_detail_allowed: 0
  nfr_as_fr_allowed: 0
  conflict_silently_resolved_allowed: 0
  untraceable_fr_allowed: 0
  untestable_ambiguous_fr_marked_ready_allowed: 0
discovery:
  positive:
  - id: positive-prd
    prompt: Turn this approved PRD into a formal functional requirements catalog with
      stable IDs, actors, triggers, outcomes, failures, and traceability.
    expected: activate
  - id: positive-journeys
    prompt: Formalize these PRD journeys and product decisions into explicit system
      functional requirements.
    expected: activate
  - id: positive-permissions
    prompt: Extract the functional permission and failure behaviors from this PRD
      before use-case modeling.
    expected: activate
  negative:
  - id: negative-nfr
    prompt: Define measurable availability, performance, security, and recovery requirements
      from this PRD.
    expected: do-not-activate
    expected_alternative: defining-non-functional-requirements
  - id: negative-usecase
    prompt: Create detailed use cases and use-case diagrams from these functional
      requirements.
    expected: do-not-activate
    expected_alternative: modeling-use-cases
  - id: negative-architecture
    prompt: Design the system architecture for these requirements.
    expected: do-not-activate
    expected_alternative: designing-system-architecture
procedure:
- id: support-platform-functional-catalog
  fixture: fixtures/support-platform-prd.md
  required_steps:
  - establish-authoritative-prd-version-scope-nongoals-and-product-decisions
  - extract-functional-behavior-from-prd-journeys-requirements-acs-and-business-rules
  - assign-stable-fr-ids-status-and-authoritative-priority
  - normalize-human-and-system-actors-without-invention
  - identify-trigger-preconditions-required-behavior-outcome-and-postconditions
  - split-compound-independent-obligations-without-oversplitting-implementation-steps
  - capture-conditional-alternative-and-product-relevant-failure-behavior
  - formalize-permission-capability-and-resource-scope-without-security-implementation
  - formalize-external-system-behavior-without-protocol-architecture
  - flag-unmeasurable-or-ambiguous-statements-instead-of-normalizing-them
  - link-business-rules-semantic-state-and-data-effects-without-creating-domain-model
  - trace-each-fr-to-prd-goals-journeys-acs-and-source-evidence
  - audit-prd-functional-coverage-duplicates-conflicts-and-granularity
  - remove-nfr-and-architecture-api-ui-implementation-leakage
  - identify-use-case-process-flow-state-machine-and-data-model-candidates
  - produce-functional-requirements-catalog-and-readiness-decision
  prohibited_actions:
  - choose-api-endpoints
  - choose-microservices
  - invent-actor-for-retention-deletion
  - turn-fast-dashboard-into-functional-requirement
  - use-must-for-proposed-ai-accuracy
  - combine-view-reply-note-resolve-reassign-into-one-fr
  - split-reply-into-click-type-submit-network-call-frs
  - invent-409-error-code
  - resolve-retention-policy
  - create-sequence-diagram
  expected_output: expected/support-platform-functional-catalog.md
edge_cases:
- id: user-action
  scenario: PRD says a support agent can mark an open conversation resolved.
  expected_behavior: produce-atomic-fr-with-agent-trigger-precondition-open-conversation-required-state-change-and-observable-resolved-outcome
- id: conditional
  scenario: AI suggestions are shown when provider is available; agents must still
    reply manually when it is unavailable.
  expected_behavior: capture-explicit-condition-and-degraded-alternative-without-architecting-provider-fallback
- id: external
  scenario: Email provider delivers inbound customer messages into the support product.
  expected_behavior: define-external-system-triggered-product-behavior-not-webhook-protocol-or-queue-design
- id: permissions
  scenario: Only organization managers may reassign conversations within their organization.
  expected_behavior: define-actor-action-resource-scope-rule-without-middleware-or-token-detail
- id: failure
  scenario: An agent tries to reply to a conversation already closed by another agent.
  expected_behavior: capture-product-relevant-conflict-or-rejection-behavior-if-prd-supports-it-otherwise-flag-product-decision
- id: ambiguous
  scenario: PRD says AI suggestions should always be correct.
  expected_behavior: flag-untestable-ambiguous-quality-or-product-statement-not-ready-functional-requirement
context_efficiency:
- id: standard-fr-catalog
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/functional-requirement-anatomy-atomicity-and-modality.md
  - references/actors-triggers-preconditions-outcomes-and-postconditions.md
  - references/conditional-alternative-failure-and-permission-behavior.md
  - references/ambiguity-testability-and-implementation-leakage.md
  - references/traceability-coverage-duplicates-and-conflicts.md
  must_not_load_unless_needed:
  - references/external-integrations-business-rules-state-and-data-effects.md
  - references/brownfield-and-downstream-modeling-handoffs.md
  - evals/
quality_rubric:
  identity_status_modality: 5
  actors_triggers_preconditions: 5
  behavior_outcome_postconditions: 5
  atomicity_and_granularity: 5
  conditional_alternative_failure: 5
  permissions_and_integrations: 5
  ambiguity_and_testability: 5
  business_rules_state_data: 5
  traceability_and_coverage: 5
  duplicates_conflicts: 5
  no_nfr_or_implementation_leakage: 5
  downstream_handoff_and_readiness: 5
