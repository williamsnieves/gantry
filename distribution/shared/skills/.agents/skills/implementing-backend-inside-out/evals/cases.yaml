skill: implementing-backend-inside-out
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  multiple_vertical_behaviors_allowed: 0
  focused_skill_replacement_allowed: 0
  outside_in_business_implementation_allowed: 0
  missing_decision_guessing_allowed: 0
  unproven_layer_progression_allowed: 0
  unexecuted_validation_claims_allowed: 0
  blocking_architecture_violation_allowed: 0
  unrelated_refactoring_allowed: 0
discovery:
  positive:
  - id: positive-ready-slice
    prompt: Implement this ready promotion behavior from Domain through HTTP using
      the backend skills and TDD.
    expected: activate
  - id: positive-orchestration
    prompt: Coordinate the next backend vertical slice inside-out and stop at unresolved
      decisions.
    expected: activate
  - id: positive-regression
    prompt: Fix this cross-layer backend regression from the core outward and validate
      the full flow.
    expected: activate
  negative:
  - id: negative-entity-only
    prompt: Model the Promotion Entity.
    expected: do-not-activate
    expected_alternative: modeling-domain-entities
  - id: negative-adapter-only
    prompt: Implement the Prisma repository adapter.
    expected: do-not-activate
    expected_alternative: implementing-repository-adapters
  - id: negative-unready
    prompt: Build something for promotions; requirements are not decided.
    expected: return-to-specification
procedure:
- id: apply-promotion-inside-out
  fixture: fixtures/apply-promotion-inside-out.md
  required_steps:
  - confirm-ready-vertical-behavior
  - stabilize-scope-and-behavior-map
  - select-one-active-tdd-case
  - route-and-complete-domain-stage
  - pass-domain-gate
  - route-and-complete-application-stage
  - pass-application-gate
  - implement-and-test-required-repository-adapter
  - implement-and-test-required-external-adapter
  - implement-and-test-http-boundary
  - wire-explicit-composition
  - run-focused-and-cross-layer-validation
  - validate-backend-architecture
  - classify-blockers-and-residual-uncertainty
  - make-behavior-level-final-decision
  prohibited_actions:
  - implement-http-first
  - implement-several-slices
  - skip-focused-skills
  - guess-transaction-order
  - guess-idempotency-semantics
  - hold-db-transaction-across-provider-without-decision
  - move-outward-with-failing-inner-tests
  - claim-blocked-sandbox-passed
  - ignore-architecture-violation
  - refactor-unrelated-module
  expected_output: expected/apply-promotion-inside-out-record.md
edge_cases:
- id: transaction-unresolved
  scenario: Provider may succeed before persistence fails and recovery semantics are
    undefined.
  expected_behavior: stop-transaction-or-reconciliation-decision-required
- id: infrastructure-only
  scenario: Database driver patch changes no business behavior.
  expected_behavior: allow-infrastructure-first-with-explicit-reason-and-validation
- id: domain-not-complete-module
  scenario: One Domain behavior is proven but the module has other pending cases.
  expected_behavior: allow-move-outward-for-selected-vertical-behavior
- id: provider-sandbox-blocked
  scenario: Contract tests pass but sandbox credentials are unavailable.
  expected_behavior: complete-with-conditions-or-blocked-evidence-not-full-pass
- id: architecture-failure
  scenario: Final validation finds Application imports concrete adapter.
  expected_behavior: return-to-inner-layer-and-block-completion
- id: brownfield-slice
  scenario: Legacy controller currently owns all business and persistence logic.
  expected_behavior: characterize-and-migrate-one-behavior-through-safe-seams
context_efficiency:
- id: greenfield-command-slice
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/readiness-and-behavior-selection.md
  - references/layer-routing-and-gates.md
  - references/tdd-case-propagation.md
  - references/transactions-idempotency-and-side-effects.md
  - references/validation-and-completion.md
  must_not_load:
  - references/brownfield-and-infrastructure-only.md
  - evals/
quality_rubric:
  readiness_and_scope: 5
  behavior_traceability: 5
  inside_out_sequence: 5
  focused_skill_routing: 5
  tdd_integration: 5
  layer_gate_quality: 5
  transaction_idempotency_and_side_effects: 5
  testing_evidence: 5
  composition_and_http_completion: 5
  architecture_validation: 5
  decision_stop_quality: 5
  scope_control_and_honesty: 5
  context_efficiency: 4
