skill: modeling-frontend-async-state
version: 0.1.0
passing_policy:
  impossible_boolean_combinations_allowed: 0
  server_state_copied_to_local_state_allowed: 0
  maybe_used_as_full_async_state_when_distinctions_needed_allowed: 0
  cache_stale_exposed_as_product_stale_without_behavior_allowed: 0
  cancellation_forced_to_generic_error_allowed: 0
  optimistic_state_duplicate_owner_allowed: 0
  giant_partial_optional_bag_allowed: 0
  one_global_loading_for_independent_operations_allowed: 0
  new_state_machine_library_without_approval_allowed: 0
  stored_derived_flags_allowed: 0
discovery:
  positive:
  - id: positive-state
    prompt: Model idle/loading/success/error/refreshing state for this React feature
      without impossible combinations.
    expected: activate
  - id: positive-server-state
    prompt: Decide how to expose semantic async state without copying React Query
      or SWR state into local useState.
    expected: activate
  - id: positive-maybe
    prompt: Decide whether Maybe<T> is sufficient or whether this async workflow needs
      a discriminated union.
    expected: activate
  negative:
  - id: negative-server-query
    prompt: Design React Query query keys, staleTime, invalidation, and mutation caching.
    expected: do-not-activate
    expected_alternative: integrating-frontend-server-state
  - id: negative-hook
    prompt: Implement the custom React hook for this workflow.
    expected: do-not-activate
    expected_alternative: designing-react-custom-hooks
  - id: negative-usecase
    prompt: Design the Application Use Case result contract.
    expected: do-not-activate
    expected_alternative: designing-frontend-use-cases
procedure:
- id: promotion-async-state
  fixture: fixtures/promotion-async-state.md
  required_steps:
  - confirm-accepted-behavior-state-owner-and-server-state-strategy
  - choose-coherent-optional-value-policy
  - enumerate-only-observable-async-states
  - remove-impossible-and-redundant-state-combinations
  - choose-maybe-versus-discriminated-union-versus-library-state
  - define-transition-and-data-retention-table
  - model-background-refresh-and-product-stale-semantics
  - define-retry-and-cancellation-transitions
  - assign-optimistic-update-to-one-owner
  - model-partial-data-without-giant-optional-bag
  - separate-independent-query-and-mutation-state
  - integrate-server-state-without-local-copy
  - choose-usestate-grouped-state-or-reducer-by-transition-coupling
  - define-observable-tests-for-roadmap-cases
  - audit-overmodeling-and-server-state-duplication
  - produce-async-state-record
  prohibited_actions:
  - copy-swr-data-error-loading-into-use-state
  - add-isloading-iserror-issuccess-independent-booleans
  - use-maybe-to-hide-loading-error-cancellation
  - add-stale-state-only-because-swr-has-cache-staleness
  - make-cancelled-a-generic-error-without-ux-reason
  - duplicate-optimistic-cache-state-in-hook
  - make-all-dashboard-sections-optional
  - combine-load-and-save-into-one-global-status
  - introduce-xstate
  - store-can-retry-if-derived-from-error
  expected_output: expected/promotion-async-state-record.md
edge_cases:
- id: background-refresh
  scenario: Existing promotion data remains visible while SWR revalidates.
  expected_behavior: preserve-data-and-use-library-or-thin-semantic-refresh-state
- id: optimistic
  scenario: React Query mutation cache already performs optimistic update and rollback.
  expected_behavior: do-not-copy-optimistic-resource-into-local-hook-state
- id: partial
  scenario: Dashboard profile succeeds while recommendations fail independently.
  expected_behavior: independent-section-state-or-application-partial-result
- id: retry
  scenario: Initial load fails and retry begins.
  expected_behavior: transition-error-to-loading-or-explicit-retrying-only-if-behavior-differs
- id: cancellation
  scenario: Search request A is cancelled when query B starts.
  expected_behavior: not-generic-error-and-old-response-cannot-overwrite-b
- id: maybe-vs-union
  scenario: Caller must distinguish not-loaded, not-found, loading, and error.
  expected_behavior: maybe-alone-insufficient-use-explicit-state
quality_rubric:
  state_ownership: 5
  optional_value_policy: 5
  observable_state_inventory: 5
  impossible_state_prevention: 5
  maybe_vs_union: 5
  transitions_and_data_retention: 5
  refresh_stale_retry_cancellation: 5
  optimistic_and_partial_state: 5
  server_state_integration: 5
  state_update_mechanism: 5
  testing_and_overmodeling: 5
  final_decision: 5
