skill: designing-domain-repositories
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  generic_crud_interfaces_allowed: 0
  dto_or_orm_outputs_allowed: 0
  database_terminology_allowed: 0
  unjustified_queries_allowed: 0
  unfaithful_inmemory_behavior_allowed: 0
  cross_module_repository_leakage_allowed: 0
  implementation_of_real_adapter_allowed: 0
discovery:
  positive:
  - id: positive-repository-port
    prompt: Design the Promotion repository port and a seedable InMemory implementation
      from these Use Case needs.
    expected: activate
  - id: positive-crud-recovery
    prompt: Replace this generic CRUD repository interface with Domain-oriented operations
      used by the billing Use Cases.
    expected: activate
  negative:
  - id: negative-adapter
    prompt: Implement the PostgreSQL repository using Prisma.
    expected: do-not-activate
    expected_alternative: implementing-repository-adapters
  - id: negative-provider
    prompt: Design the external campaign provider interface.
    expected: do-not-activate
    expected_alternative: designing-external-service-ports
  - id: negative-dto
    prompt: Create the paginated API response DTO.
    expected: do-not-activate
    expected_alternative: designing-application-dtos
  - id: negative-speculative
    prompt: Add getAll, update, delete, search, and query methods in case they are
      useful later.
    expected: do-not-proceed
procedure:
- id: promotion-repository
  fixture: fixtures/promotion-repository.md
  required_steps:
  - confirm-repository-suitability
  - resolve-port-ownership
  - trace-use-case-needs
  - define-aggregate-boundary
  - design-domain-operations
  - define-signatures
  - define-absence-save-and-error-semantics
  - define-uniqueness-and-concurrency-expectations
  - design-seedable-inmemory
  - design-contract-tests
  - check-module-and-layer-boundaries
  - prepare-adapter-handoff
  - decide-readiness
  prohibited_actions:
  - generic-crud-interface
  - return-promotion-dto
  - return-database-row
  - use-table-column-names
  - add-unused-get-all
  - claim-existence-check-solves-concurrency
  - implement-postgres-adapter
  expected_output: expected/promotion-repository-report.md
edge_cases:
- id: crud-shaped-request
  scenario: Request asks for create/read/update/delete regardless of consumers.
  expected_behavior: derive-only-used-domain-operations
- id: dto-return
  scenario: List endpoint wants flattened fields.
  expected_behavior: use-read-model-or-map-outside-domain-repository
- id: seedable-inmemory
  scenario: Use Case tests need existing promotions.
  expected_behavior: support-explicit-domain-seed
- id: identity-replacement
  scenario: Saving a different instance with the same Entity ID.
  expected_behavior: follow-documented-replace-or-conflict-semantics
- id: cross-module
  scenario: Sales module wants direct access to Billing's repository.
  expected_behavior: use-owning-capability-public-application-surface
- id: concurrency
  scenario: Two requests pass exists check simultaneously.
  expected_behavior: require-authoritative-constraint-or-atomic-operation
context_efficiency:
- id: simple-find-save
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/repository-suitability-and-ownership.md
  - references/operation-and-signature-design.md
  - references/absence-save-errors-and-transactions.md
  - references/inmemory-repository-design.md
  - references/repository-contract-testing.md
  must_not_load:
  - references/query-ordering-pagination-and-concurrency.md
  - references/evolving-crud-repositories.md
  - evals/
quality_rubric:
  repository_suitability: 5
  ownership_and_aggregate: 5
  use_case_traceability: 5
  domain_contract_quality: 5
  absence_and_failure_semantics: 5
  transaction_and_concurrency_accuracy: 5
  inmemory_fidelity: 5
  contract_testing: 5
  boundary_purity: 5
  non_speculation: 5
  adapter_handoff: 5
  context_efficiency: 4
