skill: defining-non-functional-requirements
version: 0.1.0
passing_policy:
  invent_latency_target_allowed: 0
  invent_availability_target_allowed: 0
  invent_rto_rpo_allowed: 0
  invent_scalability_target_allowed: 0
  invent_cost_ceiling_allowed: 0
  invent_retention_or_legal_requirement_allowed: 0
  invent_accessibility_standard_allowed: 0
  architecture_mechanism_as_nfr_allowed: 0
  conflict_silently_resolved_allowed: 0
  unverifiable_vague_nfr_marked_measurable_allowed: 0
discovery:
  positive:
  - id: positive-prd
    prompt: Turn this PRD's performance, availability, recovery, security, privacy,
      observability and cost expectations into a formal NFR catalog.
    expected: activate
  - id: positive-vague
    prompt: Formalize these vague quality expectations, but leave unknown targets
      as TBD instead of guessing.
    expected: activate
  - id: positive-brownfield
    prompt: Create NFRs that separate our current production baselines from desired
      targets.
    expected: activate
  negative:
  - id: negative-fr
    prompt: Define the user-visible functional behavior from this PRD.
    expected: do-not-activate
    expected_alternative: defining-functional-requirements
  - id: negative-quality
    prompt: Turn these accepted NFRs into detailed source-stimulus-environment-response-measure
      quality attribute scenarios.
    expected: do-not-activate
    expected_alternative: defining-quality-attributes
  - id: negative-architecture
    prompt: Choose the architecture that meets these performance and availability
      requirements.
    expected: do-not-activate
    expected_alternative: designing-system-architecture
procedure:
- id: support-platform-nfr-catalog
  fixture: fixtures/support-platform-quality-input.md
  required_steps:
  - establish-authoritative-prd-functional-scope-policies-baselines-and-constraints
  - classify-only-relevant-quality-categories
  - assign-stable-nfr-ids-status-obligation-strength-and-source-ownership
  - formalize-performance-scope-load-statistic-target-with-tbd-gaps-not-invented-values
  - formalize-availability-and-reliability-degraded-mode-behavior
  - formalize-scale-dimensions-without-inventing-forecast-or-horizontal-scaling
  - formalize-recovery-rto-rpo-only-when-supported
  - formalize-security-privacy-and-residency-properties-without-inventing-controls-policy-or-law
  - formalize-observability-detection-diagnosis-outcomes-without-selecting-tools
  - formalize-maintainability-interoperability-operability-cost-accessibility-usability-only-when-supported
  - define-verification-intent-for-each-material-nfr
  - separate-brownfield-baseline-from-target
  - surface-tradeoff-tensions-conflicts-and-external-dependency-feasibility
  - trace-nfrs-to-prd-goals-functional-capabilities-risks-constraints-and-sources
  - audit-measurability-feasibility-and-architecture-leakage
  - identify-quality-attribute-scenario-candidates
  - identify-architecture-driver-candidates-without-final-classification
  - produce-nfr-catalog-and-readiness
  prohibited_actions:
  - set-dashboard-p95-to-200ms
  - set-availability-to-99-99
  - invent-rto-or-rpo
  - set-100k-users-without-forecast
  - choose-kubernetes-for-scalability
  - choose-datadog-for-observability
  - invent-90-day-retention
  - invent-wcag-level
  - invent-monthly-cost-budget
  - resolve-retention-product-privacy-conflict
  expected_output: expected/support-platform-nfr-catalog.md
edge_cases:
- id: fast
  scenario: PRD says the dashboard must be very fast, with no operation, percentile,
    load, or target.
  expected_behavior: create-performance-nfr-with-tbd-scope-measure-target-and-targeted-questions-not-invent-values
- id: availability
  scenario: An approved platform policy requires 99.9% monthly availability for conversation
    reading.
  expected_behavior: record-authoritative-target-window-and-source-with-verification-intent
- id: recovery
  scenario: Business explicitly accepts at most 15 minutes of data loss after disaster
    but no restore-time target.
  expected_behavior: record-rpo-15-minutes-and-rto-tbd-not-infer-rto
- id: scale
  scenario: Product says 'thousands of companies someday' with no forecast.
  expected_behavior: record-scale-dimension-and-forecast-gap-not-numeric-target-or-horizontal-scaling
- id: observability
  scenario: Operations needs to detect failed email ingestion and identify affected
    tenant/provider, but no monitoring tool is mandated.
  expected_behavior: define-detection-diagnosis-outcome-and-tbd-window-without-selecting-tool
- id: cost
  scenario: Finance says monthly infrastructure spend must remain below an approved
    12k EUR ceiling.
  expected_behavior: record-source-backed-cost-ceiling-and-cost-analysis-verification-intent
context_efficiency:
- id: standard-nfr-catalog
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/nfr-anatomy-measurability-authority-and-verification.md
  - references/performance-availability-scalability-and-reliability.md
  - references/recoverability-security-privacy-and-residency.md
  - references/observability-maintainability-interoperability-and-operability.md
  - references/conflicts-tradeoffs-dependencies-and-brownfield-baselines.md
  must_not_load_unless_needed:
  - references/cost-accessibility-usability-and-compliance.md
  - references/traceability-quality-attribute-and-architecture-driver-handoffs.md
  - evals/
quality_rubric:
  identity_authority_and_scope: 5
  performance: 5
  availability_reliability: 5
  scalability: 5
  recoverability: 5
  security_privacy_residency: 5
  observability_operability: 5
  maintainability_interoperability: 5
  cost_accessibility_usability: 5
  measurability_verification: 5
  traceability_tradeoffs_feasibility: 5
  handoff_and_readiness: 5
