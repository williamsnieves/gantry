skill: composing-frontend-dependencies
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  service_locator_allowed: 0
  domain_application_composition_import_allowed: 0
  component_concrete_adapter_import_allowed: 0
  first_user_singleton_allowed: 0
  cross_request_cache_leak_allowed: 0
  server_secret_in_client_allowed: 0
  hidden_global_factory_lookup_allowed: 0
  new_di_library_allowed: 0
  non_deterministic_test_global_allowed: 0
discovery:
  positive:
  - id: positive-factory
    prompt: Wire the frontend Use Cases and adapters through an explicit Factory and
      route container.
    expected: activate
  - id: positive-lifecycle
    prompt: Decide which frontend dependencies are singleton, per-user, request-scoped,
      or transient.
    expected: activate
  - id: positive-server-client
    prompt: Split server and client composition roots and make dependencies injectable
      in tests.
    expected: activate
  negative:
  - id: negative-adapter
    prompt: Implement the HTTP repository adapter.
    expected: do-not-activate
    expected_alternative: implementing-frontend-repository-adapters
  - id: negative-hook
    prompt: Design the hook state and command API.
    expected: do-not-activate
    expected_alternative: designing-react-custom-hooks
  - id: negative-di-selection
    prompt: Choose a dependency injection library for the project.
    expected: do-not-activate
    expected_alternative: architecture decision
procedure:
- id: promotion-composition
  fixture: fixtures/promotion-frontend-composition.md
  required_steps:
  - confirm-ports-adapters-use-cases-and-policy
  - map-dependency-graph
  - classify-lifecycle-and-runtime
  - centralize-configuration-and-trusted-context
  - select-concrete-adapters
  - cache-http-client-only-if-safe
  - scope-user-specific-adapter-and-cache
  - construct-use-cases-with-explicit-lifecycle
  - split-server-and-client-composition
  - bind-at-route-screen-container-or-provider
  - avoid-service-locator-and-broad-services-context
  - define-test-overrides-reset-and-disposal
  - test-selection-identity-isolation-and-boundaries
  - produce-composition-record
  prohibited_actions:
  - expose-container-resolve-to-components
  - import-global-factory-inside-hook
  - cache-first-user-token
  - share-server-cache-across-users
  - pass-repository-instance-through-server-client-serialization
  - put-server-secret-in-client-env
  - create-http-client-per-render
  - cache-mutable-use-case-globally
  - introduce-di-library
  - patch-production-global-across-tests
  expected_output: expected/promotion-frontend-composition-record.md
edge_cases:
- id: cached-http-client
  scenario: One browser HttpClient is cached and reads the current token from an approved
    credential provider.
  expected_behavior: safe-shared-if-no-user-state-captured-and-test-reset-defined
- id: first-user-token
  scenario: Global repository captures Authorization header from the first login.
  expected_behavior: mutable-singleton-blocker-user-scope-or-dynamic-credentials-required
- id: server-request
  scenario: SSR repository reads cookies and request headers.
  expected_behavior: request-scoped-server-composition
- id: rsc-boundary
  scenario: Server component tries to pass a Use Case instance into a client component.
  expected_behavior: reject-nonserializable-pass-data-or-compose-client-separately
- id: test-injection
  scenario: Component tests need an InMemory repository without mutating production
    globals.
  expected_behavior: test-specific-root-props-provider-or-factory-override
- id: di-project
  scenario: Repository already uses a typed DI container with request scopes.
  expected_behavior: respect-accepted-policy-register-at-root-no-resolve-in-feature-code
- id: services-context
  scenario: One context exposes every repository, client, and Use Case.
  expected_behavior: reject-service-locator-narrow-feature-contract-required
quality_rubric:
  readiness_and_graph: 5
  lifecycle_classification: 5
  configuration_and_context: 5
  shared_client_safety: 5
  user_request_isolation: 5
  use_case_adapter_construction: 5
  server_client_boundary: 5
  react_binding: 5
  factory_or_di_policy: 5
  test_injection_and_disposal: 5
  security_and_architecture: 5
  composition_tests: 5
