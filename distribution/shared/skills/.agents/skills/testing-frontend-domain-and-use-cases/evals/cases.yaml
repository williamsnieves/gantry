skill: testing-frontend-domain-and-use-cases
version: 0.1.0
passing_policy:
  react_dependency_in_domain_test_allowed: 0
  browser_dependency_in_domain_test_allowed: 0
  concrete_adapter_in_use_case_test_allowed: 0
  repository_mock_when_inmemory_exists_allowed: 0
  mock_domain_object_allowed: 0
  real_provider_sdk_allowed: 0
  real_network_allowed: 0
  arbitrary_sleep_allowed: 0
  transport_error_asserted_as_application_semantic_allowed: 0
  duplicate_business_rule_testing_at_all_layers_required: 0
discovery:
  positive:
  - id: positive-domain
    prompt: Write pure frontend Domain tests for this Value Object and Entity behavior.
    expected: activate
  - id: positive-usecase
    prompt: Test this frontend Application Use Case with an InMemory repository and
      fake analytics port.
    expected: activate
  - id: positive-regression
    prompt: Move this business regression test out of the React component and test
      the Domain/Application behavior directly.
    expected: activate
  negative:
  - id: negative-adapter
    prompt: Test this frontend HTTP repository adapter against MSW and malformed payloads.
    expected: do-not-activate
    expected_alternative: testing-frontend-adapters
  - id: negative-hook
    prompt: Test this custom hook's cancellation and rerender behavior.
    expected: do-not-activate
    expected_alternative: testing-react-hooks
  - id: negative-component
    prompt: Test the PromotionPanel through user clicks and accessible roles.
    expected: do-not-activate
    expected_alternative: testing-react-components
procedure:
- id: promotion-domain-usecase
  fixture: fixtures/promotion-domain-usecase.md
  required_steps:
  - classify-domain-vs-usecase-vs-higher-layer-behavior
  - test-domain-public-api-with-no-react-browser-http-or-mocks
  - control-time-ids-randomness-and-timezone
  - use-real-domain-objects-in-usecase-tests
  - seed-fresh-contract-faithful-inmemory-repositories
  - use-semantic-stubs-spies-only-for-true-external-ports
  - execute-public-usecase-boundary
  - verify-response-semantic-errors-and-repository-visible-state
  - verify-negative-side-effects-only-when-semantic
  - exclude-concrete-adapters-provider-sdks-router-and-server-state
  - place-regression-at-lowest-defective-boundary
  - audit-duplicate-hook-component-e2e-business-coverage
  - run-focused-and-neighboring-fast-tests
  - produce-testing-record
  prohibited_actions:
  - render-domain-with-react-testing-library
  - mock-promotion-entity
  - mock-repository-interface-when-inmemory-exists
  - instantiate-http-promotion-repository
  - mock-axios-or-fetch
  - assert-http-409
  - use-real-clock
  - sleep-to-wait-for-async
  - assert-private-fields
  - test-swr-cache-in-usecase-test
  expected_output: expected/promotion-domain-usecase-record.md
edge_cases:
- id: domain-purity
  scenario: PromotionCode Value Object test imports React Testing Library even though
    no UI exists.
  expected_behavior: reject-react-dependency-use-pure-test
- id: inmemory
  scenario: ApplyPromotion repository port already has InMemoryPromotionRepository
    but test uses jest.fn find/save mocks.
  expected_behavior: use-inmemory-and-verify-observable-state
- id: external-port
  scenario: Use Case emits analytics after success.
  expected_behavior: use-provider-neutral-spy-and-assert-semantic-event
- id: transport-leak
  scenario: Use Case test asserts that missing subscription returns HTTP 404.
  expected_behavior: assert-stable-application-not-found-semantic-not-http-status
- id: regression-boundary
  scenario: Expired promotion invariant failed but regression currently exists only
    in Playwright.
  expected_behavior: add-domain-regression-test-and-keep-e2e-only-if-cross-boundary-risk-justifies
quality_rubric:
  boundary_classification: 5
  domain_purity: 5
  public_behavior_testing: 5
  inmemory_repository_use: 5
  external_port_doubles: 5
  state_and_result_verification: 5
  error_semantics: 5
  determinism: 5
  frontend_boundary_integrity: 5
  duplicate_coverage_restraint: 5
  execution_speed_and_isolation: 5
  final_status: 5
