skill: managing-frontend-design-tokens
version: 0.1.0
passing_policy:
  feature_root_global_token_definition_allowed: 0
  semantic_token_named_after_palette_only_allowed: 0
  danger_single_raw_red_for_all_contexts_allowed: 0
  dark_mode_repeated_raw_feature_pairs_when_semantic_tokens_exist_allowed: 0
  token_per_one_off_pixel_allowed: 0
  deprecated_token_silent_repurpose_allowed: 0
  deep_or_cyclic_alias_chain_allowed: 0
  full_vendor_catalog_mirroring_without_need_allowed: 0
  multiple_semantic_token_sources_of_truth_allowed: 0
  new_token_toolchain_without_approval_allowed: 0
discovery:
  positive:
  - id: positive-dark
    prompt: Design the semantic token mapping for light and dark mode without duplicating
      raw colors in features.
    expected: activate
  - id: positive-deprecate
    prompt: Deprecate this design token and plan migration to the new semantic token.
    expected: activate
  - id: positive-vendor
    prompt: Map our vendor design-system tokens into the project's semantic token
      model.
    expected: activate
  negative:
  - id: negative-tailwind
    prompt: Implement this card using Tailwind semantic utilities.
    expected: do-not-activate
    expected_alternative: implementing-tailwind-ui
  - id: negative-cssmodule
    prompt: Implement this CSS Module using existing design tokens.
    expected: do-not-activate
    expected_alternative: implementing-css-modules-ui
  - id: negative-variant
    prompt: Design the public Button variant API.
    expected: do-not-activate
    expected_alternative: designing-component-variants
procedure:
- id: theme-token-governance
  fixture: fixtures/theme-token-governance.md
  required_steps:
  - confirm-token-source-taxonomy-themes-styling-systems-and-accessibility-target
  - check-existing-token-reuse-before-creating-new-token
  - classify-proposed-values-as-base-semantic-component-or-local
  - separate-palette-values-from-semantic-product-meaning
  - define-light-dark-theme-mappings-with-stable-semantics
  - model-danger-contexts-and-contrast-pairs
  - evaluate-spacing-scale-changes-and-reject-token-per-pixel-growth
  - define-vendor-token-mapping-boundary-and-direction
  - define-deprecation-replacement-migration-new-usage-prevention-and-removal
  - accept-local-one-off-values-when-no-system-semantic-value-exists
  - validate-alias-graph-and-single-source-of-truth
  - define-theme-contrast-vendor-and-visual-tests
  - audit-token-proliferation-semantic-drift-and-under-tokenization
  - produce-token-governance-record
  prohibited_actions:
  - define-warning-token-in-feature-root
  - name-semantic-token-red-600
  - use-one-danger-red-for-text-surface-action-without-contrast-review
  - add-space-13-because-one-card-needs-13px
  - mirror-entire-vendor-token-catalog
  - alias-deprecated-error-token-to-warning-semantic
  - create-offset-minus1-global-token-for-one-icon
  - edit-generated-token-css-directly
  - create-second-token-source-for-tailwind
  - install-style-dictionary
  expected_output: expected/theme-token-governance-record.md
edge_cases:
- id: dark-mode
  scenario: Components repeat bg-white/dark:bg-slate-950 even though project wants
    semantic themes.
  expected_behavior: create-or-reuse-surface-semantic-token-with-light-dark-mapping
- id: danger-color
  scenario: Team proposes one `--danger-red` for danger text, button background, border,
    and alert surface.
  expected_behavior: define-context-specific-danger-semantic-roles-and-check-contrast
- id: spacing
  scenario: A component needs 13px padding while system scale has 12px and 16px and
    no other 13px usage.
  expected_behavior: prefer-local-one-off-or-design-review-not-new-global-space-step-by-default
- id: vendor
  scenario: Radix/vendor exposes 100 color tokens but project uses 12 semantic roles.
  expected_behavior: map-required-semantic-roles-only-not-full-vendor-mirror
- id: deprecated
  scenario: '`color.error.red` is deprecated in favor of text/surface/border danger
    tokens.'
  expected_behavior: inventory-contexts-and-migrate-semantically-not-one-string-replacement
- id: one-off
  scenario: One icon needs translateY(-1px) optical alignment.
  expected_behavior: local-one-off-value-not-global-token
quality_rubric:
  source_of_truth_and_ownership: 5
  token_hierarchy_and_semantics: 5
  theme_and_dark_mode: 5
  danger_status_and_accessibility: 5
  spacing_and_scale_governance: 5
  vendor_mapping: 5
  deprecation_and_migration: 5
  aliases_and_versioning: 5
  local_values_and_proliferation_restraint: 5
  tooling_and_multi_styling_integration: 5
  testing_and_visual_evidence: 5
  final_status: 5
