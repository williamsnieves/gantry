skill: updating-documentation
version: 0.1.0

passing_policy:
  invented_behavior_allowed: 0
  unverified_commands_claimed_valid_allowed: 0
  manual_generated_file_edits_allowed: 0
  unrelated_rewrites_allowed: 0

discovery:
  positive:
    - prompt: "Update project documentation for this completed feature."
      expected: activate
    - prompt: "Update API docs, examples, and migration guidance for this approved contract change."
      expected: activate
  negative:
    - prompt: "Review the docs but do not edit them."
      expected: do-not-activate
    - prompt: "Document a product decision that is still open."
      expected: do-not-activate

procedure:
  - fixture: fixtures/api-field-change.md
    required_steps:
      - identify-approved-source
      - map-impact
      - update-grounded-content
      - validate-examples
      - handle-generated-docs
      - validate-and-report
    prohibited_actions:
      - invent-command
      - edit-generated-output-only
      - rewrite-unrelated-docs
    expected_output: expected/api-field-change.md

edge_cases:
  - scenario: "README command no longer exists."
    expected_behavior: replace-or-remove-with-verified-command
  - scenario: "Old API remains supported during migration."
    expected_behavior: document-deprecation-and-migration
  - scenario: "Generated API docs are stale."
    expected_behavior: update-source-and-regenerate
  - scenario: "Nearby architecture doc is unaffected."
    expected_behavior: leave-unchanged

context_efficiency:
  always_loaded:
    - SKILL.md
  conditionally_loaded:
    - references/documentation-impact-analysis.md
    - references/documentation-standards.md
    - references/examples-and-command-validation.md
    - references/documentation-validation.md
  must_not_load:
    - references/generated-documentation.md
    - references/documentation-drift-and-removal.md
    - evals/
