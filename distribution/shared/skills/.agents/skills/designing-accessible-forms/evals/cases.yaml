skill: designing-accessible-forms
version: 0.1.0
passing_policy:
  placeholder_only_label_allowed: 0
  color_only_error_allowed: 0
  field_error_without_programmatic_association_allowed: 0
  business_rule_duplicated_as_frontend_authority_allowed: 0
  stale_async_validation_result_allowed: 0
  raw_server_error_exposed_allowed: 0
  hidden_invalid_field_blocks_submit_allowed: 0
  multi_step_focus_left_on_removed_control_allowed: 0
  unlabeled_loading_spinner_replacing_submit_name_allowed: 0
  new_form_library_selection_allowed: 0
discovery:
  positive:
  - id: positive-form
    prompt: Design the accessible labels, validation, errors, submit behavior, and
      focus contract for this new form.
    expected: activate
  - id: positive-async
    prompt: Design accessible async username validation including race safety and
      error/status behavior.
    expected: activate
  - id: positive-wizard
    prompt: Design the accessibility contract for this multi-step form including progress,
      validation, and cross-step errors.
    expected: activate
  negative:
  - id: negative-review
    prompt: Audit this already-implemented form for accessibility defects.
    expected: do-not-activate
    expected_alternative: reviewing-web-accessibility
  - id: negative-domain
    prompt: Design the business rule that decides whether a customer is eligible for
      this promotion.
    expected: do-not-activate
    expected_alternative: frontend Domain/backend business design
  - id: negative-library
    prompt: Should we use React Hook Form, Formik, or native forms?
    expected: do-not-activate
    expected_alternative: project/library decision
procedure:
- id: subscription-form
  fixture: fixtures/subscription-form.md
  required_steps:
  - confirm-form-purpose-fields-accessibility-target-libraries-and-validation-authority
  - define-programmatic-labels-help-required-and-group-semantics
  - classify-ui-shape-interaction-domain-and-backend-validation-ownership
  - define-validation-timing-without-premature-announcement
  - associate-field-errors-and-avoid-color-only-invalid-state
  - define-failed-submit-error-summary-focus-and-data-preservation
  - define-submitting-state-and-duplicate-action-prevention
  - map-server-field-form-auth-network-and-business-errors
  - design-async-validation-trigger-race-safety-network-failure-and-final-authority
  - design-dynamic-field-add-remove-focus-identity-and-hidden-validation
  - design-date-range-label-format-order-error-and-business-rule-ownership
  - design-multi-step-progress-navigation-focus-and-cross-step-error-recovery
  - define-localization-privacy-and-verification
  - audit-form-overmodeling-and-business-rule-duplication
  - produce-accessible-form-design-record
  prohibited_actions:
  - use-placeholder-as-email-label
  - mark-required-only-with-unexplained-asterisk
  - show-red-border-without-error-text-or-invalid-state
  - focus-every-error-on-change
  - disable-whole-form-during-submit
  - treat-username-network-failure-as-username-taken
  - allow-old-async-result-to-overwrite-new-input
  - expose-provider-message
  - keep-hidden-invalid-dependent-field-blocking-submit
  - duplicate-server-eligibility-rule-client-side
  expected_output: expected/subscription-form-record.md
edge_cases:
- id: required
  scenario: Email is required but only an asterisk is shown and no programmatic required
    state exists.
  expected_behavior: visible-and-programmatic-required-contract-with-associated-error
- id: async
  scenario: Username A availability request returns after user changed the value to
    B.
  expected_behavior: old-result-ignored-or-cancelled-latest-input-remains-authoritative
- id: server
  scenario: Server returns a stable `EMAIL_ALREADY_USED` field error plus a form-level
    network error in another path.
  expected_behavior: field-error-mapped-to-email-form-error-separate-input-preserved
- id: dynamic
  scenario: User adds/removes traveler rows and a hidden invalid row can still block
    submit.
  expected_behavior: stable-group-identity-logical-focus-and-hidden-validation-policy
- id: date-range
  scenario: Start/end dates need parse/order validation while a 30-day maximum is
    backend business policy.
  expected_behavior: ui-handles-shape-order-backend-remains-authoritative-for-business-limit
- id: multi-step
  scenario: Final submit on step 4 returns an error for a field on step 2.
  expected_behavior: navigate-to-step-2-render-error-and-focus-summary-or-field-logically
quality_rubric:
  labels_descriptions_and_groups: 5
  required_optional_semantics: 5
  validation_ownership: 5
  timing_and_error_association: 5
  submission_and_error_summary: 5
  server_error_mapping: 5
  async_validation: 5
  dynamic_fields: 5
  date_and_date_range: 5
  multi_step_forms: 5
  testing_localization_privacy: 5
  final_status: 5
