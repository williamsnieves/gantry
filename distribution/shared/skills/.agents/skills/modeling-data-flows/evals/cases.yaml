skill: modeling-data-flows
version: 0.1.0
passing_policy:
  invent_data_fields_allowed: 0
  invent_classification_allowed: 0
  invent_retention_allowed: 0
  invent_residency_allowed: 0
  invent_encryption_or_secret_store_allowed: 0
  invent_third_party_policy_allowed: 0
  invent_logging_content_allowed: 0
  sequence_order_inside_dfd_allowed: 0
  erd_cardinality_inside_dfd_allowed: 0
  full_stride_analysis_inside_dfd_allowed: 0
discovery:
  positive:
  - id: positive-security
    prompt: Model the data flows and trust boundaries for this architecture so we
      can use them for STRIDE.
    expected: activate
  - id: positive-privacy
    prompt: Create a DFD showing personal data and third-party transfers to email
      and AI providers, preserving unknown retention/residency.
    expected: activate
  - id: positive-secrets
    prompt: Map provider credential and authentication-data flows without exposing
      secrets or choosing a vault.
    expected: activate
  negative:
  - id: negative-sequence
    prompt: Show the exact request/callback order between application and provider.
    expected: do-not-activate
    expected_alternative: modeling-system-sequences
  - id: negative-erd
    prompt: Model Conversation, Agent and Tenant entities with cardinalities.
    expected: do-not-activate
    expected_alternative: modeling-domain-data
  - id: negative-deployment
    prompt: Show which region and cluster stores the data.
    expected: do-not-activate
    expected_alternative: modeling-deployment-architecture
procedure:
- id: support-platform-dfd
  fixture: fixtures/support-platform-data-flow-input.md
  required_steps:
  - establish-dfd-scope-security-privacy-question-and-model-basis
  - select-context-level1-and-focused-views-only-where-useful
  - map-external-entities-processes-and-store-to-accepted-c4-architecture
  - catalog-semantic-data-flows-with-source-destination-direction-purpose-and-classification
  - preserve-unknown-fields-classification-policy-residency-retention-and-logging-scope
  - model-tenant-user-platform-and-provider-trust-boundaries
  - inventory-email-ai-identity-third-party-transfers
  - inventory-provider-secret-or-credential-flows-without-secret-values-or-vault-design
  - represent-audit-observability-data-only-as-supported
  - avoid-sequence-order-erd-cardinality-deployment-topology-and-security-control-invention
  - audit-tenant-isolation-secret-exposure-third-party-logging-and-store-data
  - align-dfd-processes-stores-and-flows-with-c4-and-sequence-models
  - surface-privacy-residency-retention-or-architecture-conflicts
  - prepare-stride-inputs-without-performing-full-stride
  - produce-domain-event-deployment-and-privacy-handoffs
  - produce-data-flow-model-and-readiness
  prohibited_actions:
  - invent-email-field-schema
  - invent-ai-provider-training-policy
  - invent-90-day-retention
  - invent-eu-residency
  - choose-tls-aes-kms-or-vault
  - assume-full-conversation-logging
  - number-dfd-arrows-as-sequence
  - add-foreign-key-cardinality
  - add-pods-regions-clusters
  - perform-stride-threat-enumeration
  expected_output: expected/support-platform-data-flow-model.md
edge_cases:
- id: third-party-transfer
  scenario: Conversation context is sent to an AI Provider for optional suggestion,
    but provider retention/training policy is unknown.
  expected_behavior: model-third-party-personal-or-unknown-sensitive-transfer-purpose-and-policy-gap-without-inventing-provider-guarantees
- id: residency
  scenario: No data-residency policy has been accepted.
  expected_behavior: mark-residency-not-specified-or-policy-gap-only-if-required-not-infer-eu-or-us
- id: secrets
  scenario: Application needs an Email Provider credential.
  expected_behavior: model-secret-category-origin-or-owner-consumer-and-boundary-with-secret-handling-gap-if-needed-without-showing-value-or-vault
- id: tenant-boundary
  scenario: Agent from tenant A requests tenant B conversation data.
  expected_behavior: show-tenant/trust-boundary-and-prohibited-flow-or-authorization-gate-without-inventing-tenant-database-layout
- id: logging
  scenario: Operations must identify failed tenant/provider, but whether conversation
    content enters logs is unknown.
  expected_behavior: model-known-tenant-provider-diagnostic-metadata-purpose-and-flag-logging-data-scope-for-content
context_efficiency:
- id: standard-dfd
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/dfd-purpose-scope-levels-and-elements.md
  - references/data-classification-purpose-ownership-and-granularity.md
  - references/trust-boundaries-tenancy-third-party-and-residency.md
  - references/privacy-retention-minimization-logging-and-ai-transfers.md
  - references/stride-preparation-traceability-and-model-alignment.md
  must_not_load_unless_needed:
  - references/secrets-authentication-authorization-and-integrity-flows.md
  - references/dfd-vs-c4-sequence-erd-event-and-deployment.md
  - evals/
quality_rubric:
  scope_and_dfd_level: 5
  entities_processes_stores: 5
  data_flow_semantics: 5
  classification_purpose_ownership: 5
  trust_tenant_boundaries: 5
  third_party_privacy_residency_retention: 5
  secrets_auth_integrity: 5
  logging_ai_and_derived_data: 5
  diagram_discipline: 5
  alignment_and_conflicts: 5
  stride_preparation: 5
  handoffs_and_readiness: 5
