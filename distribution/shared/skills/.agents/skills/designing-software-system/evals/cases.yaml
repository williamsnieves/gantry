skill: designing-software-system
version: 0.1.0
passing_policy:
  run_every_skill_mechanically_allowed: 0
  skip_architecture_drivers_allowed: 0
  select_winner_before_tradeoff_allowed: 0
  accepted_adr_without_authority_allowed: 0
  skip_validation_for_meaningful_architecture_allowed: 0
  skip_stride_when_material_trust_risk_exists_allowed: 0
  silent_upstream_repair_allowed: 0
  overmodel_small_crud_allowed: 0
  undermodel_payment_platform_allowed: 0
  duplicate_current_artifact_allowed: 0
discovery:
  positive:
  - id: positive-end-to-end
    prompt: Take this product idea from requirements through an accepted architecture
      package and choose only the architecture skills we actually need.
    expected: activate
  - id: positive-router
    prompt: Orchestrate the smallest complete requirements and architecture workflow
      for this system.
    expected: activate
  - id: positive-brownfield
    prompt: Plan and orchestrate the requirements/architecture work for this brownfield
      modernization, reusing current artifacts where valid.
    expected: activate
  negative:
  - id: negative-specific-c4
    prompt: Create only the C4 L1/L2 model for this accepted architecture.
    expected: do-not-activate
    expected_alternative: modeling-c4-architecture
  - id: negative-validation
    prompt: Validate this already assembled architecture package.
    expected: do-not-activate
    expected_alternative: validating-architecture-design
  - id: negative-implementation
    prompt: Implement this already accepted OpenSpec change.
    expected: do-not-activate
    expected_alternative: implementation orchestration
procedure:
- id: small-crud-routing
  fixture: fixtures/small-internal-crud-system.md
  required_steps:
  - establish-scope-profile-and-existing-artifact-inventory
  - activate-minimum-requirements-foundation-needed
  - ensure-architecture-drivers-before-candidate-design
  - select-only-material-behavioral-models
  - generate-candidate-tradeoff-adr-flow-when-architecture-significant
  - select-c4-and-domain-or-key-sequence-only-where-needed
  - skip-event-complex-state-detailed-dfd-and-complex-deployment-with-explicit-rationale
  - activate-stride-only-if-security-trust-risk-warrants
  - always-run-architecture-validation-before-package-acceptance
  - produce-smallest-complete-dag-and-handoff
  expected_output: expected/small-internal-crud-orchestration-plan.md
- id: payment-platform-routing
  fixture: fixtures/payment-platform-system.md
  required_steps:
  - establish-critical-profile-and-authoritative-requirements-gaps
  - activate-measurable-nfr-quality-and-architecture-driver-work
  - activate-usecase-process-state-modeling-as-risk-requires
  - run-candidate-tradeoff-adr-chain
  - activate-c4-critical-sequences-dfd-domain-data-event-flow-deployment
  - activate-stride
  - require-reliability-security-recovery-evidence
  - run-validation-and-route-blockers-back
  - produce-critical-smallest-complete-dag-and-openspec-handoff
  expected_output: expected/payment-platform-orchestration-plan.md
edge_cases:
- id: existing-valid-prd
  scenario: A current accepted PRD and FR catalog already exist.
  expected_behavior: mark-those-nodes-already-satisfied-and-start-from-missing-nfr-quality-driver-work-rather-than-recreate
- id: small-crud
  scenario: Internal CRUD for five staff, no sensitive data, no lifecycle complexity,
    no external providers, conventional hosting.
  expected_behavior: skip-event-flow-complex-state-detailed-dfd-complex-deployment-with-rationale
- id: payment
  scenario: Payment platform has authorization, pending/captured/refunded states,
    callbacks, retries, PCI/security concerns and strict recovery goals.
  expected_behavior: activate-state-sequence-dfd-domain-event-deployment-stride-quality-and-validation
- id: risk-escalation
  scenario: Initially simple CRUD later adds external AI processing of personal data.
  expected_behavior: expand-graph-to-dfd-provider-sequence-stride-and-relevant-security-deployment-work
- id: backtracking
  scenario: Deployment modeling reveals accepted RTO cannot be met by chosen single-region
    architecture.
  expected_behavior: route-back-to-tradeoff-architecture-decision-and-adr-before-revalidation
- id: ritual
  scenario: Template mandates every architecture diagram for every project.
  expected_behavior: flag-ritual-architecture-and-select-risk-based-subset
- id: eventing-not-accepted
  scenario: Team likes Kafka but no asynchronous requirement/decision exists.
  expected_behavior: do-not-activate-event-flow-or-messaging-deployment-based-on-preference
- id: validation-not-optional
  scenario: All diagrams exist but no architecture validation has run.
  expected_behavior: architecture-package-not-accepted-until-validating-architecture-design-completes
context_efficiency:
- id: standard-orchestration
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/orchestration-scope-profiles-and-smallest-complete-graph.md
  - references/requirements-foundation-and-backtracking-gates.md
  - references/architecture-decision-model-selection-and-dependency-dag.md
  - references/security-stride-validation-and-feedback-loop.md
  - references/package-assembly-openspec-handoff-and-acceptance-gates.md
  must_not_load_unless_needed:
  - references/behavioral-model-selection-usecase-process-state.md
  - references/system-profiles-small-crud-payment-saas-event-brownfield-critical.md
  - evals/
quality_rubric:
  scope_profile_existing_artifacts: 5
  requirements_foundation: 5
  behavioral_model_selection: 5
  architecture_decision_sequence: 5
  architecture_model_selection: 5
  dependency_dag_parallelism_backtracking: 5
  security_stride_activation: 5
  validation_feedback_loop: 5
  smallest_complete_graph: 5
  over_under_modeling_detection: 5
  package_acceptance_and_manifest: 5
  openspec_handoff: 5
