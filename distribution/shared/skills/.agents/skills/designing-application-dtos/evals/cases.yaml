skill: designing-application-dtos
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  domain_types_in_dtos_allowed: 0
  entity_outputs_allowed: 0
  orm_or_provider_types_allowed: 0
  http_framework_types_allowed: 0
  speculative_fields_allowed: 0
  implicit_mapping_allowed: 0
  ambiguous_optionality_allowed: 0
discovery:
  positive:
  - id: positive-request-response
    prompt: Design the ApplyPromotion Request and Response DTOs and their Domain mappings.
    expected: activate
  - id: positive-entity-leak
    prompt: Replace this Use Case Entity return with a stable primitive-only Response
      DTO.
    expected: activate
  negative:
  - id: negative-use-case
    prompt: Design the complete ApplyPromotion orchestration and its ports.
    expected: do-not-activate
    expected_alternative: designing-application-use-cases
  - id: negative-controller
    prompt: Create the NestJS request class with Swagger decorators and route validation.
    expected: do-not-activate
    expected_alternative: implementing-http-controllers
  - id: negative-domain
    prompt: Model Money as an immutable Value Object.
    expected: do-not-activate
    expected_alternative: modeling-domain-value-objects
  - id: negative-provider
    prompt: Map the campaign provider response into the SDK payload.
    expected: do-not-activate
    expected_alternative: implementing-external-service-adapters
procedure:
- id: apply-promotion-dtos
  fixture: fixtures/apply-promotion-dtos.md
  required_steps:
  - confirm-request-and-response-need
  - identify-accepted-consumer-fields
  - define-primitive-only-request
  - define-primitive-only-response
  - define-optionality-and-nullability
  - define-id-enum-and-date-semantics
  - map-request-to-domain
  - map-domain-to-response
  - separate-validation-ownership
  - audit-boundaries
  - design-mapping-and-contract-tests
  - assess-compatibility
  - decide-readiness
  prohibited_actions:
  - put-id-value-object-in-request
  - return-promotion-entity
  - return-money-value-object
  - reuse-prisma-row
  - reuse-provider-payload
  - include-http-status
  - add-unused-fields
  - automatic-entity-spread
  expected_output: expected/apply-promotion-dtos-report.md
edge_cases:
- id: single-id-query
  scenario: Use Case accepts only one ID and project policy permits a direct primitive.
  expected_behavior: no-request-dto-required
- id: nested-money
  scenario: Response exposes a Money value.
  expected_behavior: plain-amount-currency-object
- id: optional-nullable
  scenario: appliedAt may be absent before application but explicitly null in public
    contract.
  expected_behavior: document-exact-nullability-and-mapping
- id: entity-to-primitives
  scenario: Entity has toPrimitives with many internal fields.
  expected_behavior: select-only-required-response-fields
- id: provider-enum
  scenario: Provider enum differs from accepted Application status.
  expected_behavior: map-in-adapter-and-expose-stable-application-enum
- id: sensitive-field
  scenario: Entity contains internal provider token.
  expected_behavior: exclude-from-response
context_efficiency:
- id: simple-command-response
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/dto-suitability-and-boundaries.md
  - references/request-dto-design.md
  - references/response-dto-design.md
  - references/mapping-and-validation-ownership.md
  - references/compatibility-security-and-testing.md
  must_not_load:
  - references/optionality-enums-dates-and-money.md
  - references/refactoring-leaky-dtos.md
  - evals/
quality_rubric:
  dto_suitability: 5
  consumer_field_traceability: 5
  primitive_only_contract: 5
  request_mapping: 5
  response_mapping: 5
  optionality_and_field_semantics: 5
  validation_ownership: 5
  boundary_purity: 5
  compatibility: 5
  security_minimization: 5
  test_quality: 5
  non_speculation: 5
  context_efficiency: 4
