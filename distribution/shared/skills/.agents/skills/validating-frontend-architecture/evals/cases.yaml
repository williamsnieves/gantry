skill: validating-frontend-architecture
version: 0.1.0
passing_policy:
  profile_agnostic_enforcement_allowed: 0
  invented_layer_allowed: 0
  invented_tool_allowed: 0
  folder_aesthetic_as_violation_allowed: 0
  component_concrete_adapter_import_allowed: 0
  cross_feature_internal_import_allowed: 0
  service_locator_allowed: 0
  shared_dumping_ground_allowed: 0
  server_secret_client_leak_allowed: 0
  unsupported_public_deep_import_allowed: 0
discovery:
  positive:
  - id: positive-validate
    prompt: Validate this frontend repository against its selected architecture profile
      and import boundaries.
    expected: activate
  - id: positive-cross-feature
    prompt: Find cross-feature internal imports, shared-folder misuse, cycles, and
      public-surface violations.
    expected: activate
  - id: positive-automation
    prompt: Check whether our ESLint/Nx/dependency rules actually enforce the accepted
      frontend architecture.
    expected: activate
  negative:
  - id: negative-review
    prompt: Review whether this architecture is a good long-term design.
    expected: do-not-activate
    expected_alternative: reviewing-frontend-architecture
  - id: negative-select-profile
    prompt: Choose Profile A, B, or C for this application.
    expected: do-not-activate
    expected_alternative: classifying-frontend-architecture-profile
  - id: negative-implementation
    prompt: Refactor the repository into vertical slices.
    expected: do-not-activate
    expected_alternative: implementation or migration skill
procedure:
- id: promotion-architecture-validation
  fixture: fixtures/promotion-architecture-validation.md
  required_steps:
  - confirm-selected-profile-and-repository-policies
  - inspect-production-import-graph
  - validate-profile-specific-layer-direction
  - check-components-hooks-for-concrete-adapters-and-global-factory
  - detect-cross-feature-internal-imports
  - verify-public-surfaces-and-package-exports
  - classify-shared-code-and-dumping-ground-risk
  - validate-composition-and-service-locator-boundaries
  - validate-server-client-import-separation
  - classify-file-feature-package-and-barrel-cycles
  - interpret-test-type-generated-and-dynamic-imports
  - discover-existing-architecture-tools
  - map-automation-to-accepted-rules-and-find-gaps
  - rank-evidence-backed-findings-and-smallest-remediation
  - produce-validation-record-and-status
  prohibited_actions:
  - require-domain-layer-in-profile-a
  - install-dependency-cruiser
  - ban-all-barrels
  - ban-all-shared-code
  - flag-test-only-import-as-production-leak-without-evidence
  - ignore-component-http-adapter-import
  - allow-feature-internal-deep-import
  - approve-global-service-locator
  - ignore-server-secret-client-import
  - recommend-repository-wide-rewrite
  expected_output: expected/promotion-architecture-validation-record.md
edge_cases:
- id: profile-a
  scenario: Small Profile A feature has components, hooks, api, and tests only.
  expected_behavior: validate-lightweight-boundaries-do-not-require-domain-application
- id: component-adapter
  scenario: React hook imports HttpPromotionRepository directly.
  expected_behavior: high-boundary-violation
- id: cross-feature
  scenario: Promotions imports Billing internal hook through a relative path.
  expected_behavior: internal-boundary-bypass
- id: shared
  scenario: One-feature promotion mapper is placed in shared/utils.
  expected_behavior: feature-owned-misplaced-in-shared
- id: barrel
  scenario: Feature index exports only public contracts and creates no cycle.
  expected_behavior: intentional-public-surface-not-violation
- id: type-only
  scenario: Package imports an internal type from another package with import type.
  expected_behavior: still-public-contract-boundary-violation-if-internal
- id: tool-gap
  scenario: ESLint passes but no rule checks cross-feature imports.
  expected_behavior: automation-gap-not-architecture-proof
quality_rubric:
  profile_awareness: 5
  dependency_direction: 5
  component_hook_boundaries: 5
  cross_feature_and_public_surfaces: 5
  shared_code_ownership: 5
  composition_and_service_locator: 5
  server_client_and_packages: 5
  cycle_and_special_import_classification: 5
  tooling_discovery_and_interpretation: 5
  automation_gap_analysis: 5
  findings_severity_and_remediation: 5
  objective_scope_and_no_redesign: 5
