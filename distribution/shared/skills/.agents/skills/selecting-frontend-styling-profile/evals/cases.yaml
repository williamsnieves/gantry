skill: selecting-frontend-styling-profile
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  implementation_allowed: 0
  new_styling_system_allowed: 0
  universal_tailwind_ban_allowed: 0
  universal_css_modules_requirement_allowed: 0
  undocumented_hybrid_allowed: 0
  invented_token_allowed: 0
  feature_to_shared_by_appearance_allowed: 0
  accessibility_breaking_wrapper_allowed: 0
  global_feature_css_allowed: 0
discovery:
  positive:
  - id: positive-profile
    prompt: Select the approved styling profile for this frontend feature and document
      tokens, variants, theming, and responsive behavior.
    expected: activate
  - id: positive-hybrid
    prompt: Decide the boundaries between our design system, Tailwind, CSS Modules,
      and headless primitives.
    expected: activate
  - id: positive-migration
    prompt: Define the styling migration and exception policy without rewriting the
      whole application.
    expected: activate
  negative:
  - id: negative-css-implementation
    prompt: Write the CSS Module for this component.
    expected: do-not-activate
    expected_alternative: implementing-css-modules-ui
  - id: negative-tailwind-implementation
    prompt: Implement this UI with Tailwind classes.
    expected: do-not-activate
    expected_alternative: implementing-tailwind-ui
  - id: negative-component
    prompt: Design the component props and interaction states.
    expected: do-not-activate
    expected_alternative: designing-react-components
procedure:
- id: mixed-styling-profile
  fixture: fixtures/mixed-styling-profile.md
  required_steps:
  - confirm-scope-and-accepted-ui-behavior
  - inspect-repository-style-evidence-and-rules
  - classify-active-styling-systems
  - distinguish-supporting-tools-from-competing-systems
  - select-primary-profile-or-explicit-hybrid
  - define-primitive-ownership-and-import-policy
  - select-authoritative-token-source
  - define-variant-and-state-styling-strategy
  - define-theme-ownership-ssr-and-contrast
  - define-responsive-layout-policy
  - bound-global-css-specificity-inline-and-important-exceptions
  - define-accessibility-baseline
  - classify-feature-shared-and-design-system-ownership
  - define-migration-exceptions-and-validation
  - produce-styling-profile-record
  prohibited_actions:
  - write-css-or-tailwind-classes
  - install-tailwind
  - ban-tailwind-universally
  - force-css-modules-universally
  - invent-token-names-not-in-source
  - allow-feature-raw-radix-imports
  - move-promotion-card-to-design-system-based-on-appearance
  - create-second-theme-provider
  - put-feature-selectors-in-global-css
  - use-deep-selector-to-reach-vendor-internals
  - start-repository-wide-migration
  expected_output: expected/mixed-styling-profile-record.md
edge_cases:
- id: design-system-plus-modules
  scenario: Shared primitives come from the company design system while feature layout
    uses CSS Modules.
  expected_behavior: coherent-supporting-tools-or-explicit-boundary-not-automatic-conflict
- id: tailwind-request
  scenario: Task casually requests Tailwind but repository policy mandates CSS Modules
    and Tailwind is absent.
  expected_behavior: preserve-css-modules-or-require-approved-exception
- id: tailwind-repo
  scenario: Repository consistently uses Tailwind theme tokens and approved variants.
  expected_behavior: select-tailwind-without-banning-it
- id: runtime-value
  scenario: Progress bar width is calculated at runtime.
  expected_behavior: allow-bounded-inline-style-or-css-custom-property
- id: important-third-party
  scenario: Third-party widget style requires one documented `!important` override.
  expected_behavior: allow-scoped-third-party-exception-with-removal-trigger
- id: generic-card
  scenario: Promotion card looks generic but has one feature-specific consumer.
  expected_behavior: keep-feature-local
- id: headless-wrapper
  scenario: Wrapper removes keyboard and focus behavior from Radix primitive.
  expected_behavior: reject-wrapper
quality_rubric:
  scope_and_evidence: 5
  profile_and_hybrid_selection: 5
  primitive_ownership: 5
  tokens: 5
  variants_and_state_styling: 5
  themes: 5
  responsive_strategy: 5
  global_css_and_specificity: 5
  accessibility: 5
  component_ownership: 5
  migration_and_exceptions: 5
  validation_and_non_implementation: 5
