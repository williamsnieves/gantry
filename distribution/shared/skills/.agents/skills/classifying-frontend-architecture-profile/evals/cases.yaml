skill: classifying-frontend-architecture-profile
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  implementation_allowed: 0
  folder_count_as_architecture_allowed: 0
  forced_domain_layer_allowed: 0
  speculative_package_allowed: 0
  speculative_shared_abstraction_allowed: 0
  understructured_complex_behavior_allowed: 0
  invented_future_scale_allowed: 0
discovery:
  positive:
  - id: positive-profile-choice
    prompt: Choose Profile A, B, or C for this frontend capability and explain the
      boundaries.
    expected: activate
  - id: positive-domain-question
    prompt: Does this React feature justify frontend Domain and Application layers?
    expected: activate
  - id: positive-monorepo-package
    prompt: Decide whether this capability should remain feature-local or become a
      package.
    expected: activate
  negative:
  - id: negative-entry
    prompt: Apply the frontend standard and discover all applicable rules.
    expected: do-not-activate
    expected_alternative: applying-frontend-engineering-standard
  - id: negative-slicing
    prompt: Plan this frontend change into vertical slices.
    expected: do-not-activate
    expected_alternative: planning-frontend-vertical-slices
  - id: negative-implementation
    prompt: Create the folders and implement Profile B.
    expected: do-not-activate
    expected_alternative: focused implementation skills
procedure:
- id: profile-classification-cases
  fixture: fixtures/frontend-profile-cases.md
  required_steps:
  - confirm-scope-behavior-and-ownership
  - inspect-current-repository-profile
  - assess-behavior-and-state-complexity
  - classify-client-server-or-shared-authority
  - evaluate-domain-application-and-port-justification
  - inspect-consumers-public-contracts-and-release-boundaries
  - inspect-rendering-testing-and-deployment-implications
  - challenge-overengineering
  - challenge-understructuring
  - select-lightest-valid-profile
  - define-required-boundaries-and-excluded-complexity
  - define-migration-and-scaling-triggers
  - produce-profile-decision-with-confidence
  prohibited_actions:
  - write-code
  - create-folders
  - select-profile-by-file-count
  - force-profile-b-for-all-features
  - select-profile-c-because-workspaces-exist
  - promote-single-consumer-to-package
  - copy-backend-domain-rules
  - ignore-offline-reconciliation-complexity
  - redesign-entire-repository
  expected_output: expected/frontend-profile-cases-record.md
edge_cases:
- id: small-form
  scenario: One form submits server-authoritative data through an existing typed client.
  expected_behavior: profile-a-no-domain-application-ceremony
- id: offline-workflow
  scenario: One app owns offline drafts, optimistic transitions, conflict resolution,
    and retry.
  expected_behavior: profile-b-with-domain-application-and-ports
- id: monorepo-one-consumer
  scenario: Workspace repository has one application consuming the feature.
  expected_behavior: not-profile-c-solely-because-monorepo
- id: multiple-apps
  scenario: Admin and customer apps consume one capability with different adapters
    and independent release.
  expected_behavior: profile-c-or-mixed-profile-with-public-package-contract
- id: visual-complexity
  scenario: Large dashboard only renders server-owned aggregates.
  expected_behavior: may-remain-profile-a
- id: legacy-flat
  scenario: Complex client-owned workflow lives under root components/hooks/services.
  expected_behavior: select-profile-b-change-local-migration-no-repository-wide-reorg
quality_rubric:
  scope_and_evidence: 5
  behavior_complexity: 5
  authority_classification: 5
  domain_application_justification: 5
  port_adapter_justification: 5
  consumer_and_public_boundary_evidence: 5
  rendering_testing_and_release_analysis: 5
  overengineering_challenge: 5
  understructuring_challenge: 5
  profile_selection_and_confidence: 5
  deferred_complexity_and_triggers: 5
  migration_proportionality: 5
