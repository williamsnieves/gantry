skill: reviewing-frontend-security
version: 0.1.0
passing_policy:
  frontend_route_guard_as_authorization_allowed: 0
  secret_in_client_bundle_allowed: 0
  dangerously_set_inner_html_auto_fail_without_source_sink_analysis_allowed: 0
  long_lived_refresh_token_localstorage_without_explicit_risk_analysis_allowed: 0
  untrusted_redirect_without_structural_policy_allowed: 0
  frontend_file_validation_as_authoritative_security_allowed: 0
  user_controlled_third_party_script_url_allowed: 0
  postmessage_star_for_privileged_flow_allowed: 0
  owasp_cwe_taxonomy_duplicated_instead_of_handoff_allowed: 0
  asvs_conformance_claim_allowed: 0
discovery:
  positive:
  - id: positive-xss
    prompt: Review this React frontend for unsafe HTML, DOM XSS, client token storage,
      redirects, and third-party script risks.
    expected: activate
  - id: positive-upload
    prompt: Review the browser side of this file upload and preview flow for security
      issues and required server handoffs.
    expected: activate
  - id: positive-authz
    prompt: Review whether these frontend role guards are being mistaken for real
      authorization.
    expected: activate
  negative:
  - id: negative-backend
    prompt: Review this backend API for SQL injection and SSRF.
    expected: do-not-activate
    expected_alternative: reviewing-application-security
  - id: negative-threat-model
    prompt: Threat model this new browser/provider architecture using STRIDE.
    expected: do-not-activate
    expected_alternative: threat-modeling-with-stride
  - id: negative-asvs
    prompt: Verify exact ASVS controls for this application.
    expected: do-not-activate
    expected_alternative: verifying-security-controls
procedure:
- id: frontend-security-review
  fixture: fixtures/frontend-security-surface.md
  required_steps:
  - define-browser-scope-auth-model-sensitive-data-third-parties-and-backend-authority
  - inventory-browser-sources-sinks-storage-navigation-files-and-runtime-scripts
  - review-dangerouslysetinnerhtml-source-sanitizer-context-and-exploitability
  - review-localstorage-token-type-lifetime-scope-xss-and-session-architecture
  - review-client-environment-variables-and-prove-true-secrets-are-not-shipped
  - review-redirect-inputs-with-structural-same-origin-or-allowlist-policy
  - review-file-selection-preview-and-client-validation-while-handing-authoritative-controls-to-server
  - review-third-party-script-origin-privilege-data-access-change-control-and-csp-isolation
  - review-route-guards-client-roles-and-tenant-cache-as-ux-not-authoritative-security
  - review-sensitive-hydration-storage-url-console-and-telemetry-exposure
  - review-postmessage-iframes-service-workers-or-cross-origin-boundaries-if-present
  - validate-scanner-findings-before-confirming
  - handoff-taxonomy-to-reviewing-application-security-and-control-evidence-to-verifying-security-controls
  - define-negative-browser-tests-and-server-infra-remediation
  - produce-frontend-security-review-record
  prohibited_actions:
  - call-every-dangerouslysetinnerhtml-xss
  - call-public-oauth-client-id-secret
  - trust-hidden-admin-button
  - store-refresh-token-localstorage-without-review
  - redirect-with-startswith-trusted-domain-only
  - trust-file-type-from-browser
  - render-untrusted-svg-same-origin-without-policy
  - load-script-from-query-param
  - postmessage-sensitive-data-to-star
  - claim-asvs-compliance
  expected_output: expected/frontend-security-surface-record.md
edge_cases:
- id: dangerous-html
  scenario: User-authored rich HTML is rendered through dangerouslySetInnerHTML after
    the project's established allowlist sanitizer.
  expected_behavior: inspect-sanitizer-context-and-malicious-fixtures-do-not-auto-confirm-xss
- id: token
  scenario: Frontend stores a 30-day refresh bearer token in localStorage and loads
    multiple third-party scripts.
  expected_behavior: flag-high-value-persistent-browser-readable-credential-risk-and-recommend-session-architecture-review
- id: env
  scenario: NEXT_PUBLIC_ANALYTICS_SITE_ID and VITE_WEBHOOK_SECRET are both in client
    bundle.
  expected_behavior: public-site-id-may-be-intended-public-webhook-secret-is-confirmed-secret-exposure
- id: redirect
  scenario: returnTo is accepted when it startsWith('https://example.com'), including
    crafted host confusion cases.
  expected_behavior: require-structural-url-origin-validation-and-negative-tests
- id: upload
  scenario: Client checks image MIME but allows SVG preview inline; server trusts
    MIME and has no size limit.
  expected_behavior: frontend-active-content-risk-plus-explicit-server-content-and-resource-control-handoff
- id: third-party
  scenario: A query parameter selects the URL inserted into a script element.
  expected_behavior: confirmed-arbitrary-script-execution-origin-risk
quality_rubric:
  browser_trust_model: 5
  xss_and_unsafe_html: 5
  token_and_session_storage: 5
  secrets_and_sensitive_data: 5
  redirect_and_cross_origin: 5
  file_upload_and_preview: 5
  third_party_runtime_scripts: 5
  authorization_server_boundary: 5
  browser_storage_postmessage_iframe: 5
  cross_cutting_security_handoffs: 5
  negative_tests_and_evidence: 5
  final_status: 5
