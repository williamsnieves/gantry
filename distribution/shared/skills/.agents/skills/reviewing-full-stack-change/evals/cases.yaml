skill: reviewing-full-stack-change
version: 0.1.0
passing_policy:
  review_without_authoritative_spec_allowed: 0
  skip_backend_or_frontend_evidence_allowed: 0
  typecheck_as_contract_proof_allowed: 0
  frontend_backend_error_mismatch_allowed: 0
  frontend_permission_as_authorization_proof_allowed: 0
  mock_drift_ignored_allowed: 0
  adversarial_review_before_contract_known_allowed: 0
  orphan_acceptance_criterion_allowed: 0
  required_risk_review_missing_but_pass_allowed: 0
  required_docs_stale_but_pass_allowed: 0
discovery:
  positive:
  - id: positive-pr
    prompt: Review this completed backend + frontend change end to end against the
      spec, API contract, tests, and rollout plan.
    expected: activate
  - id: positive-contract
    prompt: Both stacks are implemented; verify the API contract, error handling,
      auth semantics, and critical journey before merge.
    expected: activate
  - id: positive-final
    prompt: Run the final full-stack review including adversarial challenge, detail
      analysis, and docs impact.
    expected: activate
  negative:
  - id: negative-prepare
    prompt: Prepare this new frontend/backend change and define the API before implementation.
    expected: do-not-activate
    expected_alternative: preparing-full-stack-change
  - id: negative-front
    prompt: Review only this frontend PR.
    expected: do-not-activate
    expected_alternative: reviewing-frontend-architecture
  - id: negative-back
    prompt: Review only this backend module.
    expected: do-not-activate
    expected_alternative: reviewing-backend-code
procedure:
- id: subscription-upgrade-final-review
  fixture: fixtures/subscription-upgrade-final-review.md
  required_steps:
  - establish-authoritative-spec-acceptance-criteria-and-preparation-decisions
  - consume-specification-validation-evidence
  - consume-backend-validation-architecture-code-and-risk-evidence
  - consume-frontend-validation-architecture-accessibility-and-risk-evidence
  - compare-api-contract-across-spec-backend-frontend-runtime-schema-mocks-and-docs
  - verify-errors-authorization-idempotency-redirect-provider-and-rollout-semantics
  - trace-every-acceptance-criterion-and-critical-cross-stack-journey
  - delegate-adversarial-review-over-integrated-contract-and-failure-paths
  - delegate-detail-analysis-for-propagation-mocks-config-and-stale-references
  - aggregate-and-consolidate-specialist-findings
  - verify-triggered-security-privacy-performance-and-mechanical-evidence
  - assess-documentation-impact-and-route-to-updating-documentation
  - distinguish-preexisting-debt-from-change-introduced-or-worsened-issues
  - refuse-readiness-until-blocking-spec-contract-risk-validation-doc-findings-are-resolved
  - produce-full-stack-change-review-record
  prohibited_actions:
  - reimplement-all-backend-and-frontend-review-rules
  - pass-because-both-stacks-typecheck
  - ignore-response-nullability-drift
  - accept-frontend-422-when-backend-returns-409
  - accept-hidden-button-as-auth-proof
  - ignore-old-client-new-backend-rollout
  - accept-stale-mock-as-test-proof
  - run-adversarial-review-without-known-contract
  - mark-ac-covered-with-no-evidence
  - skip-required-doc-update
  expected_output: expected/subscription-upgrade-final-review-record.md
edge_cases:
- id: local-pass-integration-fail
  scenario: Backend tests expect 409 UPGRADE_CONFLICT and frontend tests mock 422
    INVALID_PLAN; both suites pass.
  expected_behavior: block-full-stack-change-for-contract-error-mismatch
- id: nullability
  scenario: Backend may return paymentUrl=null while frontend runtime schema requires
    non-null string.
  expected_behavior: identify-producer-consumer-nullability-contract-drift
- id: mixed-version
  scenario: New frontend requires a new field immediately but old backend may serve
    traffic during rolling deploy.
  expected_behavior: block-or-require-compatible-rollout-sequencing
- id: auth
  scenario: Frontend hides upgrade action but backend change validation found missing
    tenant ownership enforcement.
  expected_behavior: block-full-stack-readiness-regardless-of-frontend-behavior
- id: adversarial
  scenario: Backend commits upgrade session, response is lost, frontend retries without
    idempotency.
  expected_behavior: adversarial-finding-for-potential-duplicate-side-effect
- id: docs
  scenario: API field changed and all code/tests pass, but published API example still
    documents old field.
  expected_behavior: require-documentation-update-before-final-ready-if-doc-is-in-scope-source
quality_rubric:
  specification_gate: 5
  backend_evidence: 5
  frontend_evidence: 5
  contract_producer_consumer: 5
  errors_auth_idempotency_provider: 5
  compatibility_rollout: 5
  acceptance_and_journey_traceability: 5
  adversarial_review: 5
  detail_analysis: 5
  risk_and_mechanical_evidence: 5
  documentation_and_finding_aggregation: 5
  final_readiness: 5
