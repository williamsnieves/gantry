skill: testing-application-use-cases
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  repository_mocks_allowed: 0
  domain_mocks_allowed: 0
  real_infrastructure_allowed: 0
  sdk_or_http_types_allowed: 0
  incidental_interaction_only_tests_allowed: 0
  uncontrolled_time_or_ids_allowed: 0
  unexecuted_test_claims_allowed: 0
discovery:
  positive:
  - id: positive-use-case
    prompt: Test ApplyPromotionUseCase with InMemory repositories and a CampaignProvider
      stub.
    expected: activate
  - id: positive-mock-replacement
    prompt: Replace repository mocks in these Use Case tests with contract-faithful
      InMemory implementations.
    expected: activate
  - id: positive-side-effects
    prompt: Verify the Use Case does not save after provider failure and maps the
      Response DTO correctly.
    expected: activate
  negative:
  - id: negative-domain
    prompt: Test Promotion Entity redemption rules.
    expected: do-not-activate
    expected_alternative: testing-domain-models
  - id: negative-repository
    prompt: Test PrismaPromotionRepository against PostgreSQL.
    expected: do-not-activate
    expected_alternative: testing-repository-adapters
  - id: negative-provider
    prompt: Test the Acme SDK mapping and HTTP 429 handling.
    expected: do-not-activate
    expected_alternative: testing-external-service-adapters
  - id: negative-http
    prompt: Test the promotion REST endpoint end to end.
    expected: do-not-activate
    expected_alternative: testing-backend-http-e2e
procedure:
- id: apply-promotion-use-case-tests
  fixture: fixtures/apply-promotion-use-case-tests.md
  required_steps:
  - confirm-use-case-intention
  - inventory-orchestration-cases
  - construct-real-domain-state
  - seed-fresh-inmemory-repositories
  - configure-provider-neutral-doubles
  - test-primitive-to-domain-conversion
  - test-success-result-and-state
  - test-missing-and-authorization-cases
  - test-domain-and-provider-failures
  - test-idempotency-and-negative-side-effects
  - test-response-dto-mapping
  - audit-no-mocks-or-infrastructure
  - run-focused-and-neighboring-tests
  - record-evidence-and-gaps
  prohibited_actions:
  - mock-repository-port
  - mock-promotion
  - mock-domain-policy
  - use-prisma
  - use-acme-sdk
  - start-http-server
  - assert-http-status
  - assert-every-internal-call
  - claim-tests-pass-without-running
  expected_output: expected/apply-promotion-use-case-tests-record.md
edge_cases:
- id: missing-subscription
  scenario: Subscription is absent from InMemory repository.
  expected_behavior: not-found-and-no-provider-or-save
- id: domain-rejection
  scenario: PromotionEligibilityPolicy rejects an expired promotion.
  expected_behavior: real-domain-rejection-and-no-external-side-effect
- id: provider-failure
  scenario: CampaignProvider returns unavailable.
  expected_behavior: semantic-error-and-no-persistence
- id: idempotent-duplicate
  scenario: Provider returns accepted duplicate for same idempotency key.
  expected_behavior: accepted-idempotent-outcome-without-duplicate-state
- id: repository-concurrency
  scenario: Need to prove composite unique constraint under concurrent inserts.
  expected_behavior: route-to-repository-adapter-integration-test
- id: dto-leak
  scenario: Use Case response contains Promotion Entity.
  expected_behavior: return-to-use-case-or-dto-design
context_efficiency:
- id: simple-success-and-not-found
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/use-case-test-boundary.md
  - references/inmemory-repositories.md
  - references/external-port-doubles.md
  - references/outcomes-state-and-interactions.md
  - references/use-case-test-audit.md
  must_not_load:
  - references/failures-idempotency-and-side-effects.md
  - evals/
quality_rubric:
  use_case_boundary: 5
  real_domain_usage: 5
  inmemory_repository_fidelity: 5
  external_port_double_quality: 5
  primitive_conversion: 5
  outcome_and_state_verification: 5
  failure_and_side_effect_coverage: 5
  idempotency_accuracy: 5
  response_dto_testing: 5
  boundary_purity: 5
  execution_evidence: 5
  non_speculation: 5
  context_efficiency: 4
