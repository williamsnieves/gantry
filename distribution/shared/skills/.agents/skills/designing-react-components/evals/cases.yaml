skill: designing-react-components
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  implementation_code_allowed: 0
  repository_or_fetch_in_component_allowed: 0
  substantial_business_logic_in_component_allowed: 0
  mechanical_container_allowed: 0
  line_count_split_allowed: 0
  contradictory_boolean_state_allowed: 0
  speculative_shared_promotion_allowed: 0
  inaccessible_custom_interaction_allowed: 0
  new_library_selection_allowed: 0
discovery:
  positive:
  - id: positive-large-component
    prompt: Design the React component boundaries and props for this large feature
      screen.
    expected: activate
  - id: positive-state
    prompt: Replace contradictory loading/error/data booleans with a clear component
      rendering-state design.
    expected: activate
  - id: positive-reuse
    prompt: Decide whether this component should remain feature-local, use a container,
      or expose a render prop.
    expected: activate
  negative:
  - id: negative-hook
    prompt: Design the custom hook for this behavior.
    expected: do-not-activate
    expected_alternative: designing-react-custom-hooks
  - id: negative-effect
    prompt: Decide whether this useEffect is correct.
    expected: do-not-activate
    expected_alternative: designing-react-effects
  - id: negative-implement
    prompt: Write the React components.
    expected: do-not-activate
    expected_alternative: implementation workflow
procedure:
- id: promotion-components
  fixture: fixtures/promotion-component-design.md
  required_steps:
  - confirm-slice-state-data-and-accessibility-readiness
  - inventory-visible-and-interaction-responsibilities
  - classify-orchestration-business-effects-routing-and-composition
  - propose-component-tree
  - decide-container-and-presentation-boundary
  - design-typed-minimal-props
  - design-semantic-user-events
  - define-controlled-or-uncontrolled-ownership
  - replace-contradictory-booleans-with-explicit-state-model
  - split-by-responsibility-and-interaction-region
  - resolve-prop-drilling-without-global-state-default
  - classify-feature-local-versus-shared
  - choose-simplest-composition-api
  - define-semantic-html-and-accessibility-contract
  - define-server-client-styling-and-test-boundaries
  - produce-component-design-decision
  prohibited_actions:
  - write-jsx
  - write-css
  - allow-repository-call-in-view
  - rename-large-component-without-splitting-responsibilities
  - create-container-that-only-forwards-props
  - pass-state-setters-as-public-api
  - introduce-global-state
  - promote-campaign-form-to-design-system
  - use-clickable-div
  - add-render-prop-with-one-consumer
  - split-every-markup-region
  expected_output: expected/promotion-component-design-record.md
edge_cases:
- id: small-cohesive-screen
  scenario: One small screen connects one hook and renders one interaction.
  expected_behavior: colocated-container-and-view-may-be-accepted
- id: repository-call
  scenario: Presentational component imports PromotionRepository.
  expected_behavior: move-dependency-to-container-hook-or-application
- id: booleans
  scenario: isLoading, error, data, and isSuccess can all be truthy.
  expected_behavior: explicit-state-model-required
- id: prop-drilling
  scenario: Two layout levels pass feature callbacks unchanged.
  expected_behavior: consider-closer-composition-or-feature-context-not-global-state
- id: one-off-reuse
  scenario: Campaign form looks generic but has one consumer and promotion semantics.
  expected_behavior: feature-local
- id: render-prop
  scenario: One consumer needs fixed rendering and a hook can expose behavior.
  expected_behavior: reject-render-prop-as-unnecessary
quality_rubric:
  responsibility_inventory: 5
  boundary_and_container_decision: 5
  props_and_event_contracts: 5
  state_ownership_and_model: 5
  component_splitting: 5
  prop_drilling_context_and_composition: 5
  reuse_and_ownership: 5
  semantic_html: 5
  accessibility_contract: 5
  server_client_and_styling: 5
  test_boundary: 5
  scope_and_non_implementation: 5
