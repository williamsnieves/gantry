skill: planning-backend-vertical-slices
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  technical_layer_first_plans_allowed: 0
  invented_business_rules_allowed: 0
  unnecessary_modules_allowed: 0
  missing_inside_out_order_allowed: 0
  missing_test_mapping_allowed: 0
  implementation_actions_allowed: 0
discovery:
  positive:
  - id: positive-feature-plan
    prompt: Turn this ready backend change into vertical slices and an inside-out
      implementation order.
    expected: activate
  - id: positive-correct-layer-plan
    prompt: Rewrite this entity/repository/controller task list as backend behavior
      slices.
    expected: activate
  negative:
  - id: negative-model-entity
    prompt: Design the Subscription Entity and its invariants.
    expected: do-not-activate
    expected_alternative: modeling-domain-entities
  - id: negative-implement
    prompt: Implement the first vertical slice.
    expected: do-not-activate
  - id: negative-unresolved
    prompt: We do not know whether duplicate promotions should replace or reject.
      Plan the implementation anyway.
    expected: do-not-proceed-with-invention
  - id: negative-frontend
    prompt: Plan React feature slices for this page.
    expected: do-not-activate
procedure:
- id: promotion-slices
  fixture: fixtures/subscription-promotion.md
  required_steps:
  - confirm-readiness
  - inventory-observable-behaviors
  - group-vertical-slices
  - select-walking-skeleton
  - map-layers
  - define-inside-out-order
  - map-tdd-and-test-levels
  - identify-dependencies
  - route-focused-skills
  - surface-unresolved-decisions
  - decide-readiness
  prohibited_actions:
  - implement-code
  - plan-by-technical-layer
  - invent-duplicate-policy
  - create-unused-generic-repository
  - defer-all-tests-to-end
  expected_output: expected/subscription-promotion-plan.md
edge_cases:
- id: no-domain-behavior
  scenario: A simple pass-through integration has no domain invariant.
  expected_behavior: skip-domain-layer-with-reason
- id: infrastructure-only
  scenario: Observability exporter changes with no behavior or contract change.
  expected_behavior: infrastructure-only-plan
- id: migration
  scenario: A field changes representation across rolling deployments.
  expected_behavior: stage-prepare-compatibility-migrate-switch-verify-cleanup
- id: large-error-list
  scenario: Ten provider error codes map to three accepted business outcomes.
  expected_behavior: slice-by-business-outcome-not-provider-code
- id: unresolved-idempotency
  scenario: Duplicate semantics are not accepted.
  expected_behavior: decision-required
context_efficiency:
- id: small-feature
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/readiness-and-behavior-inventory.md
  - references/slice-design-and-walking-skeleton.md
  - references/inside-out-and-tdd-order.md
  - references/layer-port-adapter-mapping.md
  - references/slice-quality-and-readiness.md
  must_not_load:
  - references/dependencies-migrations-and-rollout.md
  - references/bugfix-refactor-and-infrastructure-only.md
  - evals/
quality_rubric:
  behavior_inventory: 5
  slice_coherence: 5
  walking_skeleton: 5
  inside_out_order: 5
  layer_proportionality: 5
  port_adapter_justification: 5
  test_mapping: 5
  dependency_sequencing: 5
  non_fabrication: 5
  skill_routing: 5
  readiness_decision: 5
  context_efficiency: 4
