skill: designing-responsive-layouts
version: 0.1.0
passing_policy:
  always_flexbox_rule_allowed: 0
  device_folklore_breakpoint_without_rationale_allowed: 0
  fixed_text_card_height_clipping_allowed: 0
  primary_action_hidden_for_layout_allowed: 0
  overflow_hidden_as_generic_fix_allowed: 0
  viewport_query_for_local_container_problem_allowed: 0
  js_resize_observer_replacing_supported_container_query_allowed: 0
  visual_order_conflicting_with_dom_order_allowed: 0
  critical_cta_truncation_allowed: 0
  page_horizontal_overflow_regression_allowed: 0
discovery:
  positive:
  - id: positive-dashboard
    prompt: Design this responsive dashboard grid and choose Grid/Flex/container queries
      intentionally.
    expected: activate
  - id: positive-table
    prompt: Design the mobile behavior for this data table without losing essential
      information.
    expected: activate
  - id: positive-overflow
    prompt: Find the structural cause of this responsive overflow regression and propose
      the correct layout fix.
    expected: activate
  negative:
  - id: negative-tailwind
    prompt: Implement the responsive classes for this already-designed layout using
      Tailwind.
    expected: do-not-activate
    expected_alternative: implementing-tailwind-ui
  - id: negative-cssmodules
    prompt: Implement the CSS Module media/container query rules for this approved
      layout.
    expected: do-not-activate
    expected_alternative: implementing-css-modules-ui
  - id: negative-token
    prompt: Create the global breakpoint token taxonomy.
    expected: do-not-activate
    expected_alternative: managing-frontend-design-tokens
procedure:
- id: responsive-dashboard
  fixture: fixtures/responsive-dashboard.md
  required_steps:
  - confirm-layout-purpose-supported-contexts-content-priority-tokens-and-accessibility
  - choose-normal-flow-flex-grid-container-or-viewport-query-by-layout-semantics
  - decide-container-vs-viewport-responsiveness
  - derive-minimal-thresholds-from-content-failure-points
  - define-dashboard-grid-card-minimums-and-variable-height-behavior
  - define-toolbar-action-priority-wrap-overflow-and-dom-order
  - define-card-content-action-and-local-container-behavior
  - choose-mobile-table-strategy-from-comparison-vs-row-reading-needs
  - stress-translated-cta-and-long-content
  - audit-zoom-text-scaling-rtl-and-fixed-dimensions
  - diagnose-overflow-root-cause-and-apply-structural-fix
  - prefer-css-native-responsiveness-over-js-measurement
  - define-threshold-browser-visual-and-overflow-tests
  - audit-breakpoint-proliferation-mobile-duplication-and-layout-abstractions
  - produce-responsive-layout-record
  prohibited_actions:
  - use-flex-for-dashboard-tracks-by-default
  - use-768-because-tablet
  - hide-primary-save-action
  - set-card-height-160-and-clip-german-text
  - convert-table-to-values-without-labels
  - add-overflow-hidden-to-page-root
  - use-window-width-hook-for-styling-only
  - use-viewport-breakpoint-for-sidebar-card-local-width
  - css-order-primary-action-after-secondary-while-dom-order-differs
  - truncate-primary-cta
  expected_output: expected/responsive-dashboard-record.md
edge_cases:
- id: dashboard-grid
  scenario: Dashboard has 6 cards with variable content and should move from multi-column
    to one column.
  expected_behavior: grid-with-content-driven-minimums-natural-height-and-minimal-thresholds
- id: toolbar
  scenario: Toolbar title plus 5 actions no longer fit on one row.
  expected_behavior: prioritize-actions-and-wrap-or-overflow-with-primary-actions-preserved
- id: card
  scenario: Same card appears in 320px sidebar and 800px main area at the same viewport
    width.
  expected_behavior: container-query-context-rather-than-viewport-only-breakpoint
- id: mobile-table
  scenario: Users compare values across 8 columns on desktop but mostly inspect one
    row on mobile.
  expected_behavior: choose-explicit-mobile-table-strategy-preserving-labels-and-essential-data
- id: translated-cta
  scenario: German primary CTA becomes 2.2x wider and overlaps a secondary action.
  expected_behavior: wrap-stack-or-reflow-with-full-primary-label-preserved
- id: overflow
  scenario: Grid page overflows horizontally because a flex child with a long URL
    refuses to shrink.
  expected_behavior: fix-min-content-constraint-with-min-width-0-or-appropriate-wrap-not-page-overflow-hidden
quality_rubric:
  layout_primitive_selection: 5
  container_vs_viewport: 5
  breakpoint_rationale: 5
  content_priority_and_reflow: 5
  dashboard_toolbar_card_patterns: 5
  mobile_table_strategy: 5
  translation_zoom_and_rtl: 5
  fixed_dimension_and_overflow_audit: 5
  css_vs_js_responsiveness: 5
  testing_and_browser_evidence: 5
  overmodeling_restraint: 5
  final_status: 5
