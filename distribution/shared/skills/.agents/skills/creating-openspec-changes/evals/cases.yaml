skill: creating-openspec-changes
version: 0.1.0

passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  manual_change_directory_creation_allowed: 0
  artifact_contradictions_allowed: 0
  validation_failures_allowed: 0
  regressions_allowed: 0

discovery:
  positive:
    - id: positive-exploration
      prompt: "Use this completed exploration brief to create the OpenSpec change."
      expected: activate
    - id: positive-clear
      prompt: "The scope and approach are agreed. Create and validate the planning artifacts for a new OpenSpec change."
      expected: activate
  negative:
    - id: negative-explore
      prompt: "Investigate how this feature should work before proposing anything."
      expected: do-not-activate
      expected_alternative: exploring-openspec-changes
    - id: negative-edit
      prompt: "Update the specs and design of the active change."
      expected: do-not-activate
      expected_alternative: editing-openspec-changes
    - id: negative-apply
      prompt: "Implement the tasks in this OpenSpec change."
      expected: do-not-activate

procedure:
  - id: core-profile
    fixture: fixtures/core-profile-request.md
    required_steps:
      - verify-readiness
      - discover-workflow
      - inspect-active-changes
      - use-official-scaffolding
      - create-required-artifacts
      - reconcile-artifacts
      - validate
      - report
    prohibited_actions:
      - manually-create-change-directory
      - implement-code
      - mark-tasks-complete
    expected_output: expected/core-profile-report.md

  - id: custom-schema
    fixture: fixtures/custom-schema-request.md
    required_behavior:
      - inspect-schema
      - follow-custom-dependencies
      - avoid-hardcoded-default-artifacts

edge_cases:
  - id: active-owner
    scenario: "An active change already owns the same intent and scope."
    expected_behavior: route-to-edit-or-continue
  - id: unresolved-decision
    scenario: "A material authorization model decision remains open."
    expected_behavior: stop-or-return-to-exploration
  - id: missing-openspec
    scenario: "OpenSpec is not initialized and setup was not requested."
    expected_behavior: report-setup-blocker
  - id: invalid-artifact
    scenario: "OpenSpec validation fails after artifact creation."
    expected_behavior: correct-and-revalidate
    prohibited_behavior:
      - claim-ready

context_efficiency:
  - id: core-existing-project
    always_loaded:
      - SKILL.md
    conditionally_loaded:
      - references/workflow-discovery.md
      - references/artifact-authoring.md
      - references/specification-deltas.md
      - references/task-planning.md
      - references/readiness-and-validation.md
    must_not_load:
      - references/brownfield-change-creation.md
      - evals/

quality_rubric:
  workflow_accuracy: 5
  scaffolding_correctness: 5
  artifact_quality: 5
  specification_testability: 5
  cross_artifact_consistency: 5
  task_completeness: 5
  validation_evidence: 5
  non_fabrication: 5
  context_efficiency: 4
