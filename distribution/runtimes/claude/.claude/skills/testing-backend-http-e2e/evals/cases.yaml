skill: testing-backend-http-e2e
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  direct_controller_invocation_allowed: 0
  production_environment_allowed: 0
  real_provider_credentials_by_default_allowed: 0
  mock_only_e2e_claim_allowed: 0
  lower_level_case_duplication_allowed: 0
  blocked_check_reported_as_pass_allowed: 0
  technical_error_leakage_allowed: 0
  cleanup_leaks_allowed: 0
discovery:
  positive:
  - id: positive-http-e2e
    prompt: Test POST /subscriptions/:id/promotions through the composed HTTP application
      and real database.
    expected: activate
  - id: positive-idempotency
    prompt: Verify the public Idempotency-Key replay behavior through real HTTP.
    expected: activate
  - id: positive-regression
    prompt: Add an E2E regression proving auth tenant context reaches the Use Case
      and persists the correct state.
    expected: activate
  negative:
  - id: negative-controller-unit
    prompt: Test the controller method with a Use Case spy.
    expected: do-not-activate
    expected_alternative: implementing-http-controllers
  - id: negative-use-case
    prompt: Test ApplyPromotionUseCase with InMemory repositories.
    expected: do-not-activate
    expected_alternative: testing-application-use-cases
  - id: negative-provider
    prompt: Test Acme HTTP 429 mapping against its sandbox.
    expected: do-not-activate
    expected_alternative: testing-external-service-adapters
procedure:
- id: apply-promotion-http-e2e
  fixture: fixtures/apply-promotion-http-e2e.md
  required_steps:
  - confirm-http-composition-readiness
  - select-critical-cross-layer-scenarios
  - define-real-http-test-composition
  - provision-isolated-persistence-and-migrations
  - configure-safe-test-auth-and-external-port-double
  - start-server-and-wait-for-readiness
  - issue-real-http-requests
  - assert-status-body-headers-and-error-safety
  - verify-durable-and-external-side-effects
  - test-idempotency-replay
  - verify-cleanup-shutdown-and-reset
  - classify-failures-honestly
  - audit-duplicate-coverage-and-boundaries
  prohibited_actions:
  - call-controller-directly
  - call-use-case-as-main-action
  - use-production-database
  - use-production-provider-key
  - use-inmemory-persistence-and-call-full-e2e
  - assert-only-mock-call
  - duplicate-every-domain-case
  - return-raw-error-message
  - claim-blocked-environment-passed
  - leave-server-or-database-open
  expected_output: expected/apply-promotion-http-e2e-record.md
edge_cases:
- id: forbidden
  scenario: Authenticated actor does not own the subscription.
  expected_behavior: 403-and-no-promotion-or-provider-call
- id: missing-idempotency
  scenario: Required Idempotency-Key header is absent.
  expected_behavior: 400-before-use-case-side-effects
- id: replay
  scenario: Same request and key are sent twice.
  expected_behavior: accepted-replay-contract-and-one-durable-state
- id: provider-unavailable
  scenario: Controlled CampaignProvider double returns unavailable.
  expected_behavior: safe-503-and-no-invalid-persistence
- id: database-blocked
  scenario: Testcontainers cannot start.
  expected_behavior: database-environment-blocked-not-pass
- id: duplicate-domain-case
  scenario: Proposal adds E2E for every invalid Promotion transition.
  expected_behavior: route-to-domain-tests-and-keep-one-representative-rejection
context_efficiency:
- id: critical-command-route
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/e2e-scope-and-scenario-selection.md
  - references/test-composition-and-environment.md
  - references/http-contract-auth-and-errors.md
  - references/side-effects-idempotency-and-async.md
  - references/failure-classification-and-duplication-audit.md
  must_not_load:
  - references/data-isolation-cleanup-and-ci.md
  - evals/
quality_rubric:
  real_http_boundary: 5
  scenario_selection: 5
  composition_fidelity: 5
  environment_safety: 5
  http_contract_assertions: 5
  auth_and_tenant_context: 5
  durable_side_effects: 5
  idempotency_and_failure_paths: 5
  cleanup_and_lifecycle: 5
  honest_failure_classification: 5
  duplication_control: 5
  boundary_purity: 5
  context_efficiency: 4
