skill: defining-quality-attributes
version: 0.1.0
passing_policy:
  invent_response_measure_allowed: 0
  architecture_tactic_inside_scenario_allowed: 0
  every_nfr_forced_into_scenario_allowed: 0
  security_scenario_replaces_stride_allowed: 0
  policy_gap_silently_resolved_allowed: 0
  dependency_feasibility_assumed_allowed: 0
  scenario_without_traceability_allowed: 0
  generic_slogan_scenario_marked_ready_allowed: 0
  tradeoff_silently_resolved_allowed: 0
  final_architecture_driver_classification_allowed: 0
discovery:
  positive:
  - id: positive-nfr
    prompt: Turn these NFRs into architecture-relevant quality attribute scenarios
      using source, stimulus, environment, artifact, response, and response measure.
    expected: activate
  - id: positive-outage
    prompt: Create availability, recovery, observability, security and modifiability
      scenarios from this NFR catalog before architecture design.
    expected: activate
  - id: positive-tbd
    prompt: Create the quality scenarios but keep unknown targets as TBD instead of
      guessing.
    expected: activate
  negative:
  - id: negative-nfr
    prompt: Formalize the PRD's vague quality expectations into NFRs.
    expected: do-not-activate
    expected_alternative: defining-non-functional-requirements
  - id: negative-driver
    prompt: Decide which of these quality scenarios are architecture drivers.
    expected: do-not-activate
    expected_alternative: identifying-architecture-drivers
  - id: negative-architecture
    prompt: Choose the best architecture to satisfy these quality scenarios.
    expected: do-not-activate
    expected_alternative: designing-system-architecture
procedure:
- id: support-platform-quality-scenarios
  fixture: fixtures/support-platform-nfrs.md
  required_steps:
  - establish-authoritative-nfr-prd-constraints-risks-and-measures
  - select-only-scenario-worthy-quality-concerns
  - assign-stable-scenario-ids-status-priority-and-traceability
  - define-source-stimulus-environment-artifact-response-and-response-measure
  - create-provider-outage-availability-and-reliability-scenarios
  - create-performance-and-scale-scenarios-with-tbd-measures-not-invented-values
  - create-security-and-observability-scenarios-without-replacing-stride-or-selecting-tools
  - create-recoverability-scenario-with-rto-rpo-tbd
  - create-modifiability-scenario-for-new-provider-change-if-supported
  - preserve-retention-policy-gap-without-inventing-privacy-scenario-outcome
  - surface-tradeoff-tensions-constraints-assumptions-and-provider-feasibility
  - audit-and-remove-architecture-tactics
  - trace-scenarios-to-nfrs-frs-goals-risks-and-constraints
  - flag-architecture-driver-candidates-without-final-classification
  - produce-tradeoff-and-architecture-validation-handoffs
  - produce-quality-attribute-scenarios-catalog
  prohibited_actions:
  - invent-p95-200ms
  - invent-99-99-availability
  - invent-rto-rpo
  - choose-cache-for-provider-outage
  - choose-kubernetes-for-scale
  - choose-datadog-for-observability
  - invent-retention-period
  - declare-tenant-isolation-final-architecture-driver
  - resolve-availability-vs-cost-tradeoff
  - perform-stride-threat-model
  expected_output: expected/support-platform-quality-scenarios.md
edge_cases:
- id: provider-outage
  scenario: Email provider is down but accepted NFR says existing conversations remain
    readable.
  expected_behavior: produce-concrete-availability-reliability-scenario-with-provider-source-production-environment-conversation-read-artifact-readable-response-and-verifiable-nonnumeric-measure
- id: traffic-spike
  scenario: Performance NFR identifies dashboard concern but load and target are TBD.
  expected_behavior: produce-performance-scenario-with-explicit-tbd-load-measure-target-not-invent-values
- id: modifiability
  scenario: Product expects future addition of another messaging provider but no change-effort
    target is accepted.
  expected_behavior: produce-modifiability-scenario-with-bounded-change-response-and-tbd-measure-not-plugin-architecture
- id: security
  scenario: Tenant A user attempts to access tenant B conversation.
  expected_behavior: produce-security-quality-scenario-denying-access-with-no-disclosure-and-route-threat-discovery-later-to-stride
- id: observability
  scenario: Email ingestion fails and operator must identify affected tenant/provider;
    no diagnostic-time target.
  expected_behavior: produce-observability-scenario-with-tbd-response-time-and-no-monitoring-vendor
- id: privacy-policy-gap
  scenario: Retention period remains unresolved.
  expected_behavior: do-not-invent-expiration-deletion-scenario-response-mark-policy-decision-required
context_efficiency:
- id: standard-quality-scenarios
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/quality-attribute-scenario-anatomy-and-measure-discipline.md
  - references/availability-performance-scalability-reliability-and-recovery-scenarios.md
  - references/security-privacy-observability-and-operability-scenarios.md
  - references/tradeoffs-constraints-assumptions-and-dependency-feasibility.md
  - references/architecture-driver-tradeoff-and-validation-handoffs.md
  must_not_load_unless_needed:
  - references/modifiability-maintainability-interoperability-and-testability-scenarios.md
  - references/usability-accessibility-and-cost-efficiency-scenarios.md
  - evals/
quality_rubric:
  scenario_anatomy: 5
  measure_discipline: 5
  availability_reliability: 5
  performance_scalability: 5
  recoverability: 5
  security_privacy: 5
  observability_operability: 5
  modifiability_maintainability: 5
  other_quality_attributes: 5
  tradeoffs_constraints_dependencies: 5
  traceability_and_no_tactic_leakage: 5
  handoffs_and_readiness: 5
