skill: recording-architecture-decisions
version: 0.1.0
passing_policy:
  accepted_without_authority_allowed: 0
  invented_decision_date_allowed: 0
  invented_decision_owner_allowed: 0
  multiple_unrelated_decisions_in_one_adr_allowed: 0
  fake_alternative_allowed: 0
  tradeoffs_without_downside_allowed: 0
  history_rewritten_allowed: 0
  supersession_link_omitted_allowed: 0
  vague_revisit_trigger_allowed: 0
  full_architecture_design_inside_adr_allowed: 0
discovery:
  positive:
  - id: positive-accepted
    prompt: Record our accepted architecture choice as an ADR with alternatives, trade-offs,
      consequences, risks and revisit triggers.
    expected: activate
  - id: positive-proposed
    prompt: Draft a PROPOSED ADR from this trade-off recommendation; the architecture
      board has not approved it yet.
    expected: activate
  - id: positive-supersede
    prompt: Create a new ADR that supersedes ADR-0012 and preserve the decision history.
    expected: activate
  negative:
  - id: negative-candidates
    prompt: Generate architecture candidates from these drivers.
    expected: do-not-activate
    expected_alternative: designing-system-architecture
  - id: negative-tradeoff
    prompt: Compare these candidates and recommend one.
    expected: do-not-activate
    expected_alternative: analyzing-architecture-tradeoffs
  - id: negative-c4
    prompt: Create C4 diagrams for the accepted architecture.
    expected: do-not-activate
    expected_alternative: modeling-c4-architecture
procedure:
- id: support-platform-adr
  fixture: fixtures/support-platform-tradeoff-decision.md
  required_steps:
  - establish-repository-adr-convention-and-next-stable-id
  - verify-decision-owner-authority-status-and-date-without-invention
  - split-unrelated-decisions-into-separate-adrs-if-needed
  - capture-decision-context-and-only-relevant-architecture-drivers
  - preserve-hard-constraints-and-material-assumptions-separately
  - write-concrete-bounded-decision-statement
  - document-meaningful-alternatives-considered-and-why-not-selected
  - record-explicit-benefit-vs-liability-tradeoffs
  - record-positive-negative-and-neutral-consequences
  - record-residual-risks-and-high-level-mitigation-evidence-actions
  - record-specific-revisit-triggers-and-reversal-conditions
  - link-tradeoff-analysis-drivers-quality-scenarios-and-related-adrs
  - audit-existing-adr-conflicts-and-supersession-needs
  - avoid-c4-sequence-erd-deployment-and-implementation-detail
  - produce-adr-file-and-downstream-modeling-security-validation-handoff
  prohibited_actions:
  - mark-accepted-without-board-approval
  - invent-decision-date
  - invent-cto-as-owner
  - combine-architecture-style-database-cloud-and-monitoring-into-one-adr
  - omit-negative-consequences
  - write-revisit-if-needed
  - erase-old-adr
  - silently-supersede-without-link
  - create-c4-diagram
  - write-implementation-plan
  expected_output: expected/ADR-0001-use-modular-monolith-for-v1.md
edge_cases:
- id: proposed-not-accepted
  scenario: Trade-off analysis recommends Candidate A but architecture board has not
    decided.
  expected_behavior: create-PROPOSED-adr-not-ACCEPTED
- id: accepted-with-conditions
  scenario: Board accepts Candidate A for v1 provided scale remains unproven and says
    to revisit if independent scaling becomes mandatory.
  expected_behavior: use-ACCEPTED-status-with-assumption-and-explicit-revisit-trigger-not-new-status-vocabulary
- id: supersession
  scenario: New service-separation decision replaces an old single-deployable decision.
  expected_behavior: new-adr-links-supersedes-old-and-old-marked-SUPERSEDED-when-write-scope-allows
- id: multiple-decisions
  scenario: Decision package says use modular monolith, PostgreSQL, GCP and Datadog.
  expected_behavior: split-independent-architectural-decisions-and-record-only-authoritative-significant-ones
- id: unknown-owner-date
  scenario: Decision content is accepted according to source but owner/date are absent.
  expected_behavior: preserve-TBD-for-missing-fields-not-invent-values
context_efficiency:
- id: standard-adr
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/adr-purpose-identity-status-and-scope.md
  - references/context-drivers-decision-alternatives-and-tradeoffs.md
  - references/consequences-risks-revisit-triggers-and-reversal.md
  - references/supersession-deprecation-rejection-and-history.md
  - references/traceability-references-index-and-repository-conventions.md
  must_not_load_unless_needed:
  - references/adr-boundary-vs-design-implementation-and-modeling.md
  - evals/
quality_rubric:
  identity_status_authority: 5
  decision_scope_and_significance: 5
  context_drivers_constraints_assumptions: 5
  decision_clarity: 5
  alternatives: 5
  tradeoffs: 5
  consequences: 5
  risks_and_revisit: 5
  history_and_supersession: 5
  traceability_and_repository_convention: 5
  no_design_or_implementation_bloat: 5
  handoffs_and_readiness: 5
