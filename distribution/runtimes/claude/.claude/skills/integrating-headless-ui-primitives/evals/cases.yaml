skill: integrating-headless-ui-primitives
version: 0.1.0
passing_policy:
  vendor_focus_management_removal_allowed: 0
  vendor_aria_removal_without_equivalent_allowed: 0
  business_logic_in_shared_primitive_allowed: 0
  deep_vendor_dom_selector_allowed: 0
  arbitrary_z_index_escalation_allowed: 0
  global_escape_handler_competing_with_vendor_allowed: 0
  ceremonial_wrapper_required_allowed: 0
  server_only_dependency_in_client_primitive_allowed: 0
  interactive_tooltip_content_allowed: 0
  vendor_private_dom_assertion_as_primary_test_allowed: 0
discovery:
  positive:
  - id: positive-dialog
    prompt: Integrate our Radix Dialog into shared UI while preserving focus, keyboard,
      ARIA, tokens, and portal layering.
    expected: activate
  - id: positive-combobox
    prompt: Wrap this React Aria combobox with our project variants without breaking
      keyboard or accessibility behavior.
    expected: activate
  - id: positive-portal
    prompt: Fix portal layering and nested overlay behavior for our headless menu
      inside a dialog.
    expected: activate
  negative:
  - id: negative-accessibility
    prompt: Review the whole page against WCAG 2.2 AA.
    expected: do-not-activate
    expected_alternative: reviewing-web-accessibility
  - id: negative-variants
    prompt: Design the semantic size and visual variant API for our Button.
    expected: do-not-activate
    expected_alternative: designing-component-variants
  - id: negative-tailwind
    prompt: Implement Tailwind classes for a normal non-headless card.
    expected: do-not-activate
    expected_alternative: implementing-tailwind-ui
procedure:
- id: shared-overlay-primitives
  fixture: fixtures/shared-overlay-primitives.md
  required_steps:
  - confirm-accepted-vendor-project-ui-boundary-styling-and-accessibility-target
  - decide-direct-vendor-vs-project-wrapper
  - define-small-stable-project-api-without-business-logic
  - preserve-vendor-keyboard-focus-aria-disabled-and-dismissal-contract
  - integrate-dialog-select-combobox-tooltip-menu-and-tabs-semantics
  - review-any-vendor-accessibility-overrides-explicitly
  - apply-project-tokens-variants-and-public-vendor-state-attributes
  - avoid-deep-vendor-dom-selectors-and-duplicate-event-handling
  - define-portal-container-semantic-layering-and-nested-overlay-behavior
  - validate-nextjs-ssr-client-boundary-and-stable-id_behavior
  - define-user-facing-keyboard-focus-and-portal-tests
  - use-real-browser-evidence-for-layering-positioning-and-focus-when-needed
  - audit-ceremonial-wrappers-business-leakage-and-custom-portal-positioning-engines
  - produce-headless-primitive-integration-record
  prohibited_actions:
  - disable-dialog-focus-trap-for-styling-convenience
  - remove-dialog-title-aria-link
  - target-radix-div-nth-child-tree
  - add-z-999999
  - add-document-escape-handler-on-top-of-menu
  - put-delete-account-usecase-in-shared-dialog
  - wrap-static-vendor-prop-one-to-one-with-no-project-value
  - put-interactive-button-inside-tooltip
  - import-dom-only-vendor-primitive-in-server-component
  - assert-vendor-generated-classnames
  expected_output: expected/shared-overlay-primitives-record.md
edge_cases:
- id: dialog
  scenario: Dialog wrapper wants to remove focus trap and hide title from accessibility
    tree.
  expected_behavior: reject-accessibility-regression-preserve-focus-and-accessible-name
- id: combobox
  scenario: Searchable select supports Arrow keys, active option, disabled options,
    and empty state.
  expected_behavior: use-combobox-pattern-preserve-vendor-keyboard-and-option-semantics
- id: tooltip
  scenario: Tooltip contains a clickable 'Learn more' button.
  expected_behavior: use-popover-or-other-interactive-pattern-not-tooltip
- id: menu
  scenario: Menu item navigation is reimplemented with custom document keydown handlers.
  expected_behavior: remove-duplicate-keyboard-logic-use-vendor-menu-contract
- id: tabs
  scenario: Tabs sync selected value with URL but shared Tabs currently imports router.
  expected_behavior: keep-url-sync-in-feature-route-shared-tabs-remain-ui-only
- id: override
  scenario: Vendor outside-click dismissal is disabled for a destructive confirmation.
  expected_behavior: allow-explicit-accessibility-preserving-configuration-with-reason-and-evidence
- id: portal-layer
  scenario: Combobox menu inside dialog renders behind modal because both use arbitrary
    z-index values.
  expected_behavior: use-project-portal-layer-model-and-correct-nested-overlay-container-order
quality_rubric:
  wrapper_boundary_and_ownership: 5
  accessibility_contract: 5
  dialog_behavior: 5
  combobox_select_behavior: 5
  tooltip_menu_tabs_behavior: 5
  vendor_override_safety: 5
  styling_tokens_and_variants: 5
  portal_layering_and_nested_overlays: 5
  ssr_client_boundary: 5
  testing_and_browser_evidence: 5
  overmodeling_restraint: 5
  final_status: 5
