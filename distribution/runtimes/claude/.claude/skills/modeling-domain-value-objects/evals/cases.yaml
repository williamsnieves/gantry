skill: modeling-domain-value-objects
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  mutable_value_objects_allowed: 0
  invalid_public_construction_allowed: 0
  reference_equality_allowed: 0
  side_effecting_operations_allowed: 0
  infrastructure_leakage_allowed: 0
  invented_constraints_allowed: 0
discovery:
  positive:
  - id: positive-email
    prompt: Create an immutable Email Value Object with validation, equality, and
      primitive serialization.
    expected: activate
  - id: positive-money
    prompt: Model Money as a Value Object with safe arithmetic and currency mismatch
      handling.
    expected: activate
  negative:
  - id: negative-entity
    prompt: Model an Order with identity, status transitions, and item lifecycle.
    expected: do-not-activate
    expected_alternative: modeling-domain-entities
  - id: negative-dto
    prompt: Create the HTTP request DTO for amount and currency.
    expected: do-not-activate
    expected_alternative: designing-application-dtos
  - id: negative-orm
    prompt: Create a TypeORM custom column type for Money.
    expected: do-not-activate
    expected_alternative: implementing-repository-adapters
  - id: negative-service
    prompt: Design exchange-rate conversion using an external provider.
    expected: do-not-activate
    expected_alternative: designing-external-service-ports
procedure:
- id: money-value-object
  fixture: fixtures/money-value-object.md
  required_steps:
  - confirm-value-object-suitability
  - define-semantic-responsibility
  - model-attributes
  - catalog-constraints
  - design-private-construction
  - define-normalization
  - define-value-equality
  - design-immutable-operations
  - define-serialization
  - design-domain-errors
  - design-tests
  - check-boundaries
  - decide-readiness
  prohibited_actions:
  - public-constructor-without-validation
  - setter
  - mutate-current-instance
  - reference-equality
  - ignore-currency-in-equality
  - silently-convert-currency
  - return-dto
  - invent-rounding-policy
  expected_output: expected/money-value-object-report.md
edge_cases:
- id: email-normalization
  scenario: Case-insensitive normalization is accepted but whitespace inside the address
    is not.
  expected_behavior: normalize-only-accepted-representation
- id: currency-mismatch
  scenario: Adding EUR Money to USD Money.
  expected_behavior: reject-incompatible-operation
- id: immutable-arithmetic
  scenario: Money.add returns a result.
  expected_behavior: new-instance-originals-unchanged
- id: composite-serialization
  scenario: Money serialization.
  expected_behavior: plain-object-with-amount-and-currency
- id: generic-versus-typed-id
  scenario: Identifier policy is unresolved.
  expected_behavior: decision-required
- id: keep-primitive
  scenario: A display-only optional note has no domain constraints or operations.
  expected_behavior: keep-primitive
context_efficiency:
- id: simple-email
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/value-object-suitability.md
  - references/construction-validation-and-normalization.md
  - references/immutability-equality-and-operations.md
  - references/serialization-and-errors.md
  - references/value-object-testing.md
  must_not_load:
  - references/money-date-range-and-identifiers.md
  - references/evolving-primitive-obsession.md
  - evals/
quality_rubric:
  suitability: 5
  constraint_model: 5
  valid_construction: 5
  normalization_accuracy: 5
  immutability: 5
  equality_semantics: 5
  operation_safety: 5
  serialization: 5
  boundary_purity: 5
  test_quality: 5
  non_fabrication: 5
  context_efficiency: 4
