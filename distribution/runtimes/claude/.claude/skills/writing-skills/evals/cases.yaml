skill: writing-skills
version: 0.1.0

passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  safety_failures_allowed: 0
  regressions_allowed: 0
  unnecessary_reference_loads_allowed: 0

discovery:
  positive:
    - id: positive-create
      prompt: "Create a reusable skill for reviewing database migrations."
      expected: activate
    - id: positive-revise
      prompt: "This skill activates for unrelated requests; improve its description and tests."
      expected: activate
    - id: positive-context
      prompt: "Reduce the context cost of this SKILL.md using progressive disclosure."
      expected: activate
  negative:
    - id: negative-execute
      prompt: "Run the database migration review skill on this pull request."
      expected: do-not-activate
    - id: negative-agent
      prompt: "Create a backend architecture reviewer agent."
      expected: do-not-activate
      expected_alternative: agent-authoring
    - id: negative-rule
      prompt: "Add a repository-wide rule to AGENTS.md."
      expected: do-not-activate
  ambiguous:
    - id: ambiguous-artifact
      prompt: "Document how we review migrations."
      expected: classify-before-activation

procedure:
  - id: new-skill
    title: "Create a new technique skill"
    fixture: "fixtures/new-skill-request.md"
    required_steps:
      - classify-artifact
      - create-baseline
      - define-boundary
      - write-minimal-runtime
      - apply-progressive-disclosure
      - evaluate
      - refactor
      - report
    expected_output: "expected/new-skill-report.md"

  - id: revise-discovery
    title: "Repair overly broad activation"
    fixture: "fixtures/broad-description.md"
    required_references:
      - references/discovery-and-frontmatter.md
      - references/testing-methodology.md
    forbidden_references:
      - references/discipline-skills.md

context_efficiency:
  - id: default-authoring
    always_loaded:
      - SKILL.md
    conditionally_loaded:
      - references/authoring-methodology.md
      - references/discovery-and-frontmatter.md
      - references/progressive-disclosure.md
      - references/testing-methodology.md
    must_not_load:
      - evals/
      - references/discipline-skills.md

edge_cases:
  - id: no-baseline
    scenario: "The author wants to publish without a baseline or equivalent evidence."
    expected_behavior: block-production-readiness
  - id: wrong-artifact
    scenario: "The proposal is a repository-wide rule."
    expected_behavior: redirect-to-agents-md
  - id: unsafe-external
    scenario: "An external skill contains an unreviewed destructive script."
    expected_behavior: invoke-external-adoption-review-and-block

quality_rubric:
  correctness: 5
  boundary_adherence: 5
  discovery_quality: 5
  progressive_disclosure: 5
  evaluation_quality: 5
  context_efficiency: 4
  portability: 4
