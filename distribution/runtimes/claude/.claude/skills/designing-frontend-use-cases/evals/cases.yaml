skill: designing-frontend-use-cases
version: 0.1.0
passing_policy:
  react_dependency_allowed: 0
  jsx_return_allowed: 0
  browser_global_allowed: 0
  http_library_dependency_allowed: 0
  concrete_adapter_dependency_allowed: 0
  use_case_chaining_allowed: 0
  presentation_logic_allowed: 0
  transport_response_output_allowed: 0
  meaningless_request_dto_allowed: 0
  server_authority_duplication_allowed: 0
discovery:
  positive:
  - id: positive-profile
    prompt: Design the frontend Use Case for loading a profile through an Application
      port.
    expected: activate
  - id: positive-payment
    prompt: Design the SubmitPayment Use Case with request input, ports, semantic
      results, cancellation, and tests.
    expected: activate
  - id: positive-decision
    prompt: Decide whether this frontend flow needs a Use Case or whether that would
      be unnecessary Application ceremony.
    expected: activate
  negative:
  - id: negative-domain
    prompt: Model the Draft Entity and Value Objects.
    expected: do-not-activate
    expected_alternative: modeling-frontend-domain
  - id: negative-dto
    prompt: Design all frontend DTO and view-data boundaries for this feature.
    expected: do-not-activate
    expected_alternative: designing-frontend-dtos-and-view-data
  - id: negative-component
    prompt: Design the React form state and rendering behavior.
    expected: do-not-activate
    expected_alternative: designing-react-components or designing-react-custom-hooks
procedure:
- id: payment-use-case
  fixture: fixtures/payment-use-case.md
  required_steps:
  - confirm-user-intention-profile-domain-and-boundaries
  - decide-use-case-justification
  - define-one-primary-operation
  - decide-primitives-versus-request-dto
  - identify-semantic-ports-and-exclude-concrete-adapters
  - separate-domain-rules-from-application-orchestration
  - design-orchestration-without-use-case-chaining
  - define-application-dto-or-explicit-result-output
  - define-stable-failure-semantics
  - define-cancellation-and-stale-response-ownership
  - define-duplicate-command-and-idempotency-policy
  - define-partial-success-or-offline-semantics-if-relevant
  - define-composition-and-testing-seams
  - audit-react-http-browser-and-presentation-leakage
  - produce-use-case-design-record
  prohibited_actions:
  - return-jsx
  - accept-set-state-callback
  - import-stripe-sdk
  - import-http-client
  - call-confirm-payment-use-case
  - inspect-http-409
  - navigate-router
  - store-loading-state
  - duplicate-backend-payment-authority
  - create-request-dto-for-single-user-id-with-no-boundary-value
  expected_output: expected/payment-use-case-record.md
edge_cases:
- id: load-profile
  scenario: One reusable profile query maps a repository result to a stable Application
    DTO.
  expected_behavior: use-case-may-be-justified-if-application-boundary-exists
- id: payment
  scenario: Payment requires semantic input, payment port, order port, distinguishable
    outcomes, and cancellation.
  expected_behavior: use-case-strongly-justified
- id: jsx
  scenario: Use Case returns a PaymentSuccess React element.
  expected_behavior: mandatory-violation-return-semantic-result
- id: http-client
  scenario: Use Case depends directly on Axios HttpClient.
  expected_behavior: mandatory-violation-depend-on-semantic-port
- id: chained
  scenario: PublishDraft calls SaveDraft Use Case and SyncDraft Use Case.
  expected_behavior: reject-use-case-chaining-and-extract-lower-level-responsibility
- id: request-dto
  scenario: LoadProfile accepts only userId.
  expected_behavior: primitive-input-probably-preferred
- id: ui-toggle
  scenario: Open/close local accordion state.
  expected_behavior: no-use-case-required
quality_rubric:
  intention_and_justification: 5
  primary_operation: 5
  input_and_request_dto: 5
  ports_and_dependency_direction: 5
  domain_and_orchestration: 5
  output_and_boundary_types: 5
  errors_and_failure_semantics: 5
  cancellation_races_and_idempotency: 5
  offline_partial_success_and_browser_boundaries: 5
  composition: 5
  testing_and_overmodeling: 5
  framework_transport_presentation_independence: 5
