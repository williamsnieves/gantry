skill: modeling-c4-architecture
version: 0.1.0
passing_policy:
  l3_for_every_container_allowed: 0
  l4_without_maintenance_reason_allowed: 0
  internal_container_on_l1_allowed: 0
  undecided_technology_invented_allowed: 0
  docker_container_confused_with_c4_container_allowed: 0
  folder_or_class_as_component_by_default_allowed: 0
  abstraction_levels_mixed_allowed: 0
  sequence_order_inside_c4_allowed: 0
  deployment_instances_inside_logical_c4_allowed: 0
  adr_conflict_silently_resolved_allowed: 0
discovery:
  positive:
  - id: positive-l1-l2
    prompt: Create C4 L1 and L2 diagrams for this accepted architecture, keeping unknown
      technologies as TBD.
    expected: activate
  - id: positive-l3
    prompt: Add an L3 component view only for the complex core application because
      we need to document module boundaries.
    expected: activate
  - id: positive-brownfield
    prompt: Model current and target C4 architecture and distinguish transitional
      containers.
    expected: activate
  negative:
  - id: negative-sequence
    prompt: Show the exact request/callback/retry order between frontend, API and
      provider.
    expected: do-not-activate
    expected_alternative: modeling-system-sequences
  - id: negative-dfd
    prompt: Show PII data movement and trust boundaries for threat modeling.
    expected: do-not-activate
    expected_alternative: modeling-data-flows
  - id: negative-deployment
    prompt: Show pods, clusters, regions, load balancers and replicas.
    expected: do-not-activate
    expected_alternative: modeling-deployment-architecture
procedure:
- id: support-platform-c4
  fixture: fixtures/support-platform-accepted-architecture.md
  required_steps:
  - establish-model-scope-architecture-version-audience-and-adr-basis
  - select-l1-and-l2-by-default
  - decide-l3-only-for-container-with-explicit-complexity-maintenance-or-boundary-need
  - omit-l4-without-strong-maintenance-reason
  - model-support-agent-manager-operator-and-relevant-external-systems-at-l1
  - keep-system-of-interest-opaque-at-l1
  - model-only-accepted-l2-containers-and-data-stores
  - describe-responsibilities-before-technologies-and-keep-undecided-technology-tbd
  - model-data-ownership-structurally-without-erd
  - model-directed-labeled-architectural-relationships
  - trace-major-elements-and-boundaries-to-adr-and-drivers
  - avoid-sequence-process-state-event-dfd-erd-and-deployment-detail
  - audit-element-identity-relationship-consistency-abstraction-levels-and-orphans
  - identify-sequence-dfd-stride-and-deployment-handoffs
  - produce-c4-architecture-model-and-readiness
  prohibited_actions:
  - put-core-module-inside-l1-context
  - invent-react-node-postgresql-kafka-kubernetes
  - treat-module-as-independent-deployable
  - add-pod-replica-region
  - number-arrows-as-runtime-sequence
  - create-conversation-table
  - create-retry-branch
  - create-state-transition
  - generate-l3-for-all-containers
  - generate-l4-class-diagram
  expected_output: expected/support-platform-c4-architecture-model.md
edge_cases:
- id: l3-justified
  scenario: Single deployable core application contains several explicitly governed
    business-capability modules whose boundaries are central to the ADR.
  expected_behavior: allow-one-l3-view-for-core-container-with-explicit-justification-and-do-not-create-l3-for-everything
- id: l4-overuse
  scenario: User asks to diagram every class because C4 has an L4 level.
  expected_behavior: reject-default-l4-and-require-strong-maintenance-reason
- id: undecided-tech
  scenario: ADR decides single deployable architecture but database and framework
    are not selected.
  expected_behavior: model-boundaries-responsibilities-and-technology-tbd-without-invention
- id: context-boundary
  scenario: Diagram puts Support Agent, Support Platform, Conversation Module and
    Database together at L1.
  expected_behavior: remove-internal-elements-from-l1-and-keep-system-as-one-box
- id: c4-vs-deployment
  scenario: Architecture runs with three replicas across two zones.
  expected_behavior: keep-logical-container-on-c4-and-defer-replicas-zones-to-deployment-model
context_efficiency:
- id: standard-c4
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/c4-purpose-levels-and-level-selection.md
  - references/system-context-people-external-systems-and-boundaries.md
  - references/container-model-responsibilities-data-stores-and-technologies.md
  - references/relationships-identities-naming-and-consistency.md
  - references/c4-vs-sequence-dfd-domain-event-and-deployment-models.md
  must_not_load_unless_needed:
  - references/component-model-l3-and-code-level-l4-discipline.md
  - references/brownfield-current-target-and-adr-traceability.md
  - evals/
quality_rubric:
  scope_and_level_selection: 5
  l1_context_quality: 5
  l2_container_quality: 5
  l3_l4_discipline: 5
  responsibilities_and_technology_discipline: 5
  data_store_and_ownership: 5
  relationships_boundaries_and_identity: 5
  traceability: 5
  current_target_brownfield: 5
  no_abstraction_or_model_leakage: 5
  audits_and_gaps: 5
  handoffs_and_readiness: 5
