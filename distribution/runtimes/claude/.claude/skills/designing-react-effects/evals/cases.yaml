skill: designing-react-effects
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  implementation_code_allowed: 0
  pure_derivation_effect_allowed: 0
  event_command_effect_allowed: 0
  exhaustive_deps_suppression_allowed: 0
  missing_cleanup_allowed: 0
  server_state_reimplementation_allowed: 0
  mounted_flag_as_race_solution_allowed: 0
  strict_mode_guard_hack_allowed: 0
  mechanical_memoization_allowed: 0
discovery:
  positive:
  - id: positive-effect-review
    prompt: Decide whether this useEffect is necessary and design its dependencies
      and cleanup.
    expected: activate
  - id: positive-widget
    prompt: Design the React lifecycle for this third-party widget.
    expected: activate
  - id: positive-stale
    prompt: Resolve stale closures and exhaustive-deps without suppressing the rule.
    expected: activate
  negative:
  - id: negative-hook
    prompt: Design the whole custom hook API and state machine.
    expected: do-not-activate
    expected_alternative: designing-react-custom-hooks
  - id: negative-component
    prompt: Design component props and semantic markup.
    expected: do-not-activate
    expected_alternative: designing-react-components
  - id: negative-implement
    prompt: Write the useEffect code.
    expected: do-not-activate
    expected_alternative: implementation workflow
procedure:
- id: effect-cases
  fixture: fixtures/react-effect-cases.md
  required_steps:
  - identify-external-system-for-each-candidate
  - consider-render-event-library-and-external-store-alternatives
  - decide-effect-necessity
  - select-component-hook-route-library-or-adapter-owner
  - define-trigger-resource-identity-and-lifecycle
  - enumerate-reactive-dependencies
  - resolve-stale-closures-without-suppression
  - define-cleanup-and-strict-mode-safety
  - define-ssr-and-hydration-behavior
  - define-races-cancellation-and-idempotency
  - handle-fetch-subscription-analytics-debounce-and-widget-semantics
  - define-observable-tests
  - produce-effect-design-decision
  prohibited_actions:
  - write-effect-code
  - store-derived-filtered-list
  - submit-via-state-watching-effect
  - disable-exhaustive-deps
  - use-empty-array-despite-changing-id
  - add-mounted-flag-as-ordering-solution
  - rebuild-swr-fetching
  - emit-user-action-analytics-from-state-watcher
  - omit-widget-destroy
  - suppress-strict-mode-second-setup-with-ref
  - memoize-every-function
  expected_output: expected/react-effect-cases-record.md
edge_cases:
- id: fetch-on-mount
  scenario: Component fetches a resource in an empty-array Effect while SWR is approved.
  expected_behavior: delegate-to-server-state-library
- id: derived-list
  scenario: Effect updates filteredItems from items and query.
  expected_behavior: move-to-render-derivation
- id: subscription
  scenario: Hook subscribes to a room ID and needs unsubscribe on change.
  expected_behavior: effect-required-with-room-dependency-and-symmetric-cleanup
- id: analytics-click
  scenario: Effect observes submitted=true to emit button-click analytics.
  expected_behavior: move-to-event-handler
- id: analytics-view
  scenario: Impression event depends on actual mounted visible panel.
  expected_behavior: lifecycle-effect-may-be-justified-with-dedup-semantics
- id: debounce
  scenario: Search command must run 300ms after the latest user input.
  expected_behavior: define-timer-cancel-latest-input-and-owner
- id: widget
  scenario: Imperative chart has create/update/destroy APIs.
  expected_behavior: effect-lifecycle-with-instance-ref-and-strict-mode-safety
quality_rubric:
  effect_necessity: 5
  alternative_selection: 5
  ownership_and_trigger: 5
  lifecycle_and_cleanup: 5
  dependency_correctness: 5
  stale_closure_and_identity: 5
  strict_mode_ssr_hydration: 5
  races_cancellation_idempotency: 5
  common_case_reasoning: 5
  widget_dom_storage_design: 5
  test_strategy: 5
  scope_and_non_implementation: 5
