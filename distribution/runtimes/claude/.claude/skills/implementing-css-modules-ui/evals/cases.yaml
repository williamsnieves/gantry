skill: implementing-css-modules-ui
version: 0.1.0
passing_policy:
  css_modules_profile_mismatch_allowed: 0
  feature_global_leakage_allowed: 0
  root_token_mutation_from_component_allowed: 0
  hardcoded_semantic_color_when_token_exists_allowed: 0
  deep_selector_against_vendor_internals_allowed: 0
  routine_important_allowed: 0
  runtime_value_class_explosion_allowed: 0
  focus_outline_removed_without_replacement_allowed: 0
  new_variant_or_css_tooling_without_approval_allowed: 0
  css_hash_assertions_as_primary_behavior_tests_allowed: 0
discovery:
  positive:
  - id: positive-module
    prompt: Implement this component with our CSS Modules conventions, tokens, responsive
      behavior, and variants.
    expected: activate
  - id: positive-runtime
    prompt: Style this runtime progress value in CSS Modules without generating dozens
      of classes.
    expected: activate
  - id: positive-selector
    prompt: Refactor this brittle deep CSS Module selector and global leakage.
    expected: activate
  negative:
  - id: negative-select
    prompt: Should this project use Tailwind, CSS Modules, or CSS-in-JS?
    expected: do-not-activate
    expected_alternative: selecting-frontend-styling-profile
  - id: negative-tailwind
    prompt: Implement this component using the project's Tailwind utilities.
    expected: do-not-activate
    expected_alternative: implementing-tailwind-ui
  - id: negative-tokens
    prompt: Design the global design token taxonomy for the application.
    expected: do-not-activate
    expected_alternative: managing-frontend-design-tokens
procedure:
- id: promotion-card-css-modules
  fixture: fixtures/promotion-card-css-modules.md
  required_steps:
  - confirm-css-modules-profile-token-theme-responsive-and-primitive-policy
  - separate-component-styles-from-global-token-theme-concerns
  - implement-scoped-semantic-classes
  - reuse-semantic-tokens-and-escalate-missing-global-token-needs
  - compose-explicit-component-variants-with-existing-class-utility
  - handle-runtime-values-with-css-variable-or-inline-style
  - choose-responsive-layout-primitive-based-on-problem
  - support-wrap-translation-zoom-and-logical-properties
  - audit-deep-selectors-vendor-internals-specificity-and-important
  - preserve-focus-reduced-motion-and-accessibility-styling
  - define-real-browser-or-visual-evidence-where-needed
  - audit-css-modules-overmodeling-and-global-leakage
  - produce-css-modules-record
  prohibited_actions:
  - define-color-danger-token-in-feature-root
  - use-global-feature-class
  - target-radix-internal-div-tree
  - use-important-to-win-normal-cascade
  - generate-progress-0-through-100-classes
  - remove-focus-outline
  - invent-new-breakpoint
  - install-cva
  - install-sass
  - assert-generated-css-hash-as-primary-test
  expected_output: expected/promotion-card-css-modules-record.md
edge_cases:
- id: component-module
  scenario: PromotionCard needs local layout, states, focus styling, and responsive
    behavior.
  expected_behavior: scoped-semantic-module-with-project-tokens-and-shallow-selectors
- id: global-token
  scenario: Three components need the same semantic warning surface and no token exists.
  expected_behavior: report-global-token-need-do-not-copy-hardcoded-color-in-each-module
- id: runtime-value
  scenario: Progress width is a runtime percentage from 0 to 100.
  expected_behavior: css-custom-property-or-inline-style-not-generated-class-set
- id: variant
  scenario: Button has explicit variant and size plus disabled/loading states.
  expected_behavior: compose-valid-classes-from-existing-variant-contract-without-specificity-explosion
- id: deep-selector
  scenario: Module uses `.root > div:nth-child(2) > div > span` to style a vendor
    primitive.
  expected_behavior: deep-selector-smell-use-semantic-class-or-documented-public-slot-boundary
quality_rubric:
  profile_and_scope: 5
  global_boundary: 5
  tokens_and_theme: 5
  variant_composition: 5
  runtime_values: 5
  responsive_layout: 5
  selectors_and_specificity: 5
  accessibility_styling: 5
  shared_primitive_integration: 5
  testing_and_visual_evidence: 5
  overmodeling_restraint: 5
  final_status: 5
