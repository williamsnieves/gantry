skill: designing-system-architecture
version: 0.1.0
passing_policy:
  winner_selected_allowed: 0
  technology_preference_as_architecture_reason_allowed: 0
  fake_alternative_allowed: 0
  every_responsibility_as_service_allowed: 0
  data_ownership_omitted_allowed: 0
  failure_operational_model_omitted_allowed: 0
  hard_constraint_violation_hidden_allowed: 0
  assumption_promoted_to_fact_allowed: 0
  detailed_c4_sequence_erd_deployment_design_allowed: 0
  unsupported_architecture_tactic_allowed: 0
discovery:
  positive:
  - id: positive-candidates
    prompt: Generate several candidate system architectures from these accepted architecture
      drivers and constraints, but do not pick a winner.
    expected: activate
  - id: positive-brownfield
    prompt: Design viable evolution candidates for this existing system using our
      architecture drivers and migration constraints.
    expected: activate
  - id: positive-distributed
    prompt: Generate simple, selectively separated, and distributed candidates only
      where the drivers justify them.
    expected: activate
  negative:
  - id: negative-tradeoffs
    prompt: Compare these three architecture candidates and choose the best one.
    expected: do-not-activate
    expected_alternative: analyzing-architecture-tradeoffs
  - id: negative-adr
    prompt: Record our accepted architecture choice as an ADR.
    expected: do-not-activate
    expected_alternative: recording-architecture-decisions
  - id: negative-c4
    prompt: Create C4 L1/L2 diagrams for the chosen architecture.
    expected: do-not-activate
    expected_alternative: modeling-c4-architecture
procedure:
- id: support-platform-candidates
  fixture: fixtures/support-platform-architecture-drivers.md
  required_steps:
  - establish-architecture-scope-decision-horizon-and-input-versions
  - summarize-primary-secondary-conditional-drivers-constraints-assumptions-tensions-and-gaps
  - derive-mechanism-neutral-architectural-forces
  - derive-major-responsibilities-from-usecases-processes-states-and-integrations
  - generate-two-to-four-meaningfully-different-viable-candidates-without-fake-options
  - describe-boundaries-deployable-units-and-dependency-direction-at-high-level
  - describe-data-ownership-authority-and-consistency-implications
  - describe-communication-style-long-running-workflow-and-provider-interaction-implications
  - describe-failure-boundaries-degraded-mode-and-trust-boundaries
  - describe-deployment-scaling-and-operational-shape-without-detailed-diagrams
  - assess-team-ownership-modifiability-cost-lockin-and-complexity
  - record-candidate-specific-assumptions-risks-and-unknowns
  - check-hard-constraint-compliance
  - map-driver-coverage-without-scoring-or-selecting-winner
  - audit-candidate-differentiation-and-remove-technology-only-alternatives
  - produce-evaluation-questions-and-tradeoff-analysis-handoff
  - produce-candidate-system-architectures-record
  prohibited_actions:
  - declare-microservices-best
  - declare-modular-monolith-best
  - choose-kubernetes
  - choose-kafka
  - choose-postgresql
  - create-fake-candidate-differing-only-cloud-runtime
  - turn-every-capability-into-service
  - create-c4-diagrams
  - create-sequence-diagrams
  - create-erd-or-deployment-diagram
  expected_output: expected/support-platform-candidate-architectures.md
edge_cases:
- id: small-team
  scenario: One five-engineer team owns build and operations, with no independent-deployment
    requirement.
  expected_behavior: ensure-candidates-explicitly-account-for-operational-complexity-and-do-not-assume-microservices
- id: tenant-isolation
  scenario: Tenant isolation is a primary driver across data access and integrations.
  expected_behavior: make-trust-data-ownership-boundary-treatment-explicit-in-each-candidate-without-choosing-schema-strategy
- id: provider-outage
  scenario: Email provider outage must not make existing conversations unreadable.
  expected_behavior: compare-failure-boundary-and-degraded-mode-shape-without-prescribing-cache-or-queue
- id: unknown-scale
  scenario: Future scale is still unknown.
  expected_behavior: record-unknown-and-avoid-distributed-architecture-justification-based-on-aspirational-scale
- id: single-viable
  scenario: Hard policy requires on-prem deployment and forbids external managed services,
    eliminating several candidates.
  expected_behavior: allow-single-viable-candidate-status-and-explain-constraint-elimination-without-fabricating-alternatives
context_efficiency:
- id: standard-architecture-candidate-design
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/architecture-scope-drivers-forces-and-candidate-generation.md
  - references/responsibility-boundaries-decomposition-and-ownership.md
  - references/data-ownership-consistency-and-communication-styles.md
  - references/failure-security-deployment-scaling-and-operational-model.md
  - references/constraint-compliance-driver-coverage-and-candidate-differentiation.md
  must_not_load_unless_needed:
  - references/team-modifiability-cost-complexity-and-lockin.md
  - references/brownfield-migration-and-evolution-candidates.md
  - evals/
quality_rubric:
  scope_and_driver_grounding: 5
  architectural_forces: 5
  responsibilities_and_boundaries: 5
  candidate_diversity_and_viability: 5
  data_ownership_and_consistency: 5
  communication_and_workflows: 5
  failure_security_deployment_scaling: 5
  operational_model_and_team_fit: 5
  modifiability_cost_complexity_lockin: 5
  assumptions_risks_unknowns: 5
  constraint_and_driver_coverage: 5
  no_selection_and_tradeoff_handoff: 5
