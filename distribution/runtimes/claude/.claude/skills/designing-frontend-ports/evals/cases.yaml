skill: designing-frontend-ports
version: 0.1.0
passing_policy:
  provider_api_leak_allowed: 0
  http_response_leak_allowed: 0
  generic_get_json_port_allowed: 0
  endpoint_mirroring_allowed: 0
  browser_api_leak_allowed: 0
  generic_storage_api_allowed_without_semantic_need: 0
  analytics_any_payload_allowed: 0
  cache_library_metadata_leak_allowed: 0
  vendor_cancellation_token_allowed: 0
  god_browser_capabilities_port_allowed: 0
discovery:
  positive:
  - id: positive-repository
    prompt: Design the frontend repository port for remote and IndexedDB-backed drafts
      without leaking provider details.
    expected: activate
  - id: positive-browser
    prompt: Design semantic ports for analytics, clipboard, geolocation, notifications,
      and clock.
    expected: activate
  - id: positive-cache
    prompt: Decide whether cache freshness and cancellation should be visible in this
      frontend port contract.
    expected: activate
  negative:
  - id: negative-adapter
    prompt: Implement the localStorage adapter for ThemePreferenceStore.
    expected: do-not-activate
    expected_alternative: infrastructure adapter skill
  - id: negative-http
    prompt: Build the common HTTP client with auth headers and JSON decoding.
    expected: do-not-activate
    expected_alternative: implementing-frontend-http-clients
  - id: negative-usecase
    prompt: Design the orchestration for SaveDraft.
    expected: do-not-activate
    expected_alternative: designing-frontend-use-cases
procedure:
- id: offline-draft-and-browser-ports
  fixture: fixtures/offline-draft-and-browser-ports.md
  required_steps:
  - confirm-intention-domain-usecase-dto-and-external-capabilities
  - decide-port-justification
  - decide-domain-vs-application-owner
  - classify-repository-external-browser-time-cache-sync-and-subscription-ports
  - name-contracts-in-product-language
  - keep-methods-narrow-and-avoid-endpoint-crud-ceremony
  - define-stable-inputs-and-outputs
  - define-not-found-and-failure-semantics
  - define-cancellation-and-race-ownership
  - hide-localstorage-indexeddb-browser-and-provider-details
  - decide-cache-visible-vs-transparent-semantics
  - define-sync-subscription-lifecycle-if-needed
  - constrain-analytics-security-and-privacy
  - define-server-client-runtime
  - define-test-doubles-and-contract-test-need
  - audit-generic-god-and-mock-driven-ports
  - produce-port-design-record
  prohibited_actions:
  - expose-indexeddb-transaction
  - create-get-json-repository
  - create-localstorage-key-value-port-for-domain-drafts
  - expose-navigator-geolocation-position
  - create-track-any-payload-analytics
  - return-react-query-cache-object
  - expose-axios-cancel-token
  - create-browser-capabilities-god-port
  - mirror-sync-v2-endpoint
  - add-unused-crud-methods
  expected_output: expected/offline-draft-and-browser-ports-record.md
edge_cases:
- id: localstorage
  scenario: Theme preference is persisted in localStorage.
  expected_behavior: semantic-theme-preference-store-not-generic-localstorage-port
- id: analytics
  scenario: Vendor SDK exposes track(name, any). Privacy allows only category and
    outcome.
  expected_behavior: typed-semantic-analytics-port-constrains-payload
- id: geolocation
  scenario: App needs current coordinates for nearby pickup.
  expected_behavior: application-geolocation-port-with-stable-position-and-permission-errors
- id: remote-repository
  scenario: Orders come from BFF today and IndexedDB cache tomorrow.
  expected_behavior: repository-contract-hides-source
- id: cache
  scenario: Product explicitly shows 'offline cached' state.
  expected_behavior: cache-freshness-may-be-semantic-without-library-metadata
- id: cancellation
  scenario: Search request becomes obsolete as query changes.
  expected_behavior: port-supports-cancellation-race-policy-owned-by-consumer-layer
quality_rubric:
  justification_and_ownership: 5
  product_language_and_interface_segregation: 5
  repository_semantics: 5
  browser_capability_semantics: 5
  inputs_outputs_and_provider_independence: 5
  not_found_and_failures: 5
  cancellation_and_races: 5
  cache_sync_and_subscriptions: 5
  security_privacy_and_runtime: 5
  test_doubles_and_contract_tests: 5
  overmodeling_restraint: 5
  final_decision: 5
