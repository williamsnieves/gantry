skill: refactoring-backend-toward-hexagonal-architecture
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  big_bang_rewrite_allowed: 0
  multiple_unrelated_behaviors_allowed: 0
  refactor_without_characterization_allowed: 0
  generic_forwarding_seam_allowed: 0
  speculative_domain_model_allowed: 0
  silent_contract_change_allowed: 0
  dual_write_without_reconciliation_allowed: 0
  legacy_removal_without_exit_checks_allowed: 0
discovery:
  positive:
  - id: positive-controller-service
    prompt: Incrementally move this legacy controller/service behavior toward hexagonal
      architecture.
    expected: activate
  - id: positive-caller
    prompt: Characterize the legacy path, introduce ports and adapters, and redirect
      one caller.
    expected: activate
  - id: positive-strangler
    prompt: Execute the next safe strangler step from the brownfield adaptation plan.
    expected: activate
  negative:
  - id: negative-profile
    prompt: Map the current and target brownfield architecture and identify seams.
    expected: do-not-activate
    expected_alternative: adapting-backend-rules-to-existing-code
  - id: negative-unknown-domain
    prompt: Find the business invariants hidden in this legacy service.
    expected: do-not-activate
    expected_alternative: extracting-domain-model-from-legacy-code
  - id: negative-greenfield
    prompt: Implement a new backend behavior from scratch.
    expected: do-not-activate
    expected_alternative: implementing-backend-inside-out
procedure:
- id: legacy-promotion-refactor
  fixture: fixtures/legacy-promotion-refactor.md
  required_steps:
  - confirm-one-behavior-and-brownfield-plan
  - characterize-current-contract-state-and-effects
  - confirm-safe-seam
  - classify-and-move-responsibilities-inward
  - implement-domain-and-application-boundaries
  - introduce-only-required-ports
  - isolate-repository-and-provider-adapters
  - preserve-data-public-and-error-compatibility
  - preserve-accepted-transaction-and-idempotency-semantics
  - redirect-one-caller-with-rollback-and-observability
  - run-focused-and-cross-layer-validation
  - compare-architecture-before-and-after
  - decide-whether-legacy-path-is-removable
  - record-residual-debt-and-next-slice
  prohibited_actions:
  - rewrite-entire-module
  - rename-legacy-service-as-use-case
  - create-generic-legacy-bridge
  - invent-domain-invariant
  - change-public-response-silently
  - change-side-effect-order-without-decision
  - run-old-and-new-provider-side-effects
  - dual-write-without-reconciliation
  - migrate-all-callers-at-once
  - delete-legacy-path-before-exit-conditions
  expected_output: expected/legacy-promotion-refactor-record.md
edge_cases:
- id: unknown-invariants
  scenario: Legacy service contains eligibility rules with contradictory examples.
  expected_behavior: return-to-domain-model-extraction
- id: wrapper-no-value
  scenario: Proposed facade forwards every method and still exposes Prisma rows.
  expected_behavior: reject-seam-as-no-boundary-value
- id: provider-shadow
  scenario: Parallel run would invoke the provider from both old and new paths.
  expected_behavior: reject-and-use-side-effect-free-shadow-or-single-authority
- id: legacy-data
  scenario: Stored legacy state cannot be represented by the new Domain model.
  expected_behavior: require-explicit-data-policy-before-redirection
- id: one-caller
  scenario: Three controllers call the legacy service.
  expected_behavior: migrate-one-caller-validate-then-plan-next
- id: removal-blocked
  scenario: New path passes but one scheduled job still calls the legacy code.
  expected_behavior: retain-legacy-path-with-owner-and-exit-condition
context_efficiency:
- id: single-controller-refactor
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/characterization-and-safe-seams.md
  - references/moving-responsibilities-inward.md
  - references/ports-adapters-and-compatibility.md
  - references/caller-redirection-rollout-and-rollback.md
  - references/validation-removal-and-drift.md
  must_not_load:
  - references/transactions-data-and-external-effects.md
  - evals/
quality_rubric:
  behavior_and_scope_control: 5
  characterization_quality: 5
  seam_quality: 5
  responsibility_movement: 5
  domain_application_boundaries: 5
  port_adapter_proportionality: 5
  compatibility_and_data_safety: 5
  transactions_idempotency_and_side_effects: 5
  caller_redirection_and_rollback: 5
  validation_and_drift: 5
  legacy_removal_governance: 5
  non_speculation_and_incrementality: 5
  context_efficiency: 4
