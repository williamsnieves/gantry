skill: planning-frontend-test-strategy
version: 0.1.0
passing_policy:
  implementation_allowed: 0
  all_e2e_strategy_allowed: 0
  duplicate_every_scenario_allowed: 0
  domain_mocking_allowed: 0
  repository_mock_when_inmemory_exists_allowed: 0
  adapter_self_mock_allowed: 0
  fetch_internal_mock_for_http_ui_allowed: 0
  private_implementation_assertion_allowed: 0
  axe_as_conformance_allowed: 0
  jsdom_as_visual_proof_allowed: 0
  invented_test_library_allowed: 0
discovery:
  positive:
  - id: positive-strategy
    prompt: Plan the frontend test strategy and map each behavior to Domain, Use Case,
      adapter, hook, component, visual, or E2E.
    expected: activate
  - id: positive-duplication
    prompt: Reduce duplicate tests and decide which critical journeys truly need E2E.
    expected: activate
  - id: positive-environment
    prompt: Define test doubles, browser environments, CI stages, and regression ownership
      for this feature.
    expected: activate
  negative:
  - id: negative-component-test
    prompt: Write the component tests for this interaction.
    expected: do-not-activate
    expected_alternative: testing-react-components
  - id: negative-hook-test
    prompt: Implement tests for this custom hook.
    expected: do-not-activate
    expected_alternative: testing-react-hooks
  - id: negative-accessibility-design
    prompt: Design the keyboard and focus contract.
    expected: do-not-activate
    expected_alternative: designing-accessible-web-interfaces
procedure:
- id: promotion-test-strategy
  fixture: fixtures/promotion-test-strategy.md
  required_steps:
  - confirm-accepted-behavior-architecture-and-tooling
  - inventory-behaviors-and-risks
  - map-each-behavior-to-lowest-reliable-boundary
  - plan-domain-use-case-adapter-hook-and-component-coverage
  - plan-accessibility-visual-route-package-and-e2e-evidence
  - select-test-doubles-and-realistic-environments
  - remove-duplicate-scenarios-without-losing-distinct-risk
  - control-data-time-locale-network-storage-and-concurrency
  - define-flakiness-and-selector-policy
  - place-suites-in-ci
  - define-regression-ownership-and-maintenance
  - record-gaps-and-final-decision
  prohibited_actions:
  - write-test-code
  - put-all-errors-in-e2e
  - mock-domain-entity
  - mock-promotion-repository-in-use-case-test
  - mock-adapter-in-adapter-test
  - mock-global-fetch-in-component-test
  - assert-hook-setter-call
  - assert-css-class-for-semantic-state
  - claim-axe-proves-aa
  - use-jsdom-for-responsive-visual-proof
  - invent-new-test-framework
  expected_output: expected/promotion-test-strategy-record.md
edge_cases:
- id: ui-only
  scenario: Static accessible notice with no business or data behavior.
  expected_behavior: component-accessibility-and-possibly-visual-no-domain-use-case-or-e2e
- id: rich-domain
  scenario: Offline planner has pure transitions, Use Cases, IndexedDB, hook state,
    and several screens.
  expected_behavior: inside-out-layered-coverage-plus-small-critical-e2e-set
- id: duplicate-error
  scenario: Invalid code is tested in adapter, hook, component, route, and E2E with
    identical assertions.
  expected_behavior: retain-only-levels-proving-distinct-mapping-state-ui-or-integration-risk
- id: visual
  scenario: Responsive chart clips only in a real browser dark theme.
  expected_behavior: real-browser-visual-evidence-not-jsdom
- id: production-bug
  scenario: A null API date crashed mapping.
  expected_behavior: smallest-regression-at-adapter-mapper-boundary-not-automatic-e2e
- id: accessibility
  scenario: axe passes but dialog focus restoration is wrong.
  expected_behavior: component-or-browser-focus-test-plus-manual-evidence
quality_rubric:
  behavior_and_risk_inventory: 5
  lowest_boundary_mapping: 5
  domain_and_use_case_policy: 5
  adapter_and_environment_policy: 5
  hook_and_component_policy: 5
  accessibility_and_visual_evidence: 5
  route_package_and_e2e_selection: 5
  duplication_control: 5
  doubles_data_and_determinism: 5
  flakiness_and_ci: 5
  regression_and_ownership: 5
  scope_and_non_implementation: 5
