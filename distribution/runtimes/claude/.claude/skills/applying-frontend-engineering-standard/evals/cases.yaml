skill: applying-frontend-engineering-standard
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  implementation_code_allowed: 0
  silent_library_selection_allowed: 0
  forced_hexagonal_layers_allowed: 0
  invented_requirement_allowed: 0
  unresolved_conflict_ignored_allowed: 0
  style_preference_as_rule_allowed: 0
discovery:
  positive:
  - id: positive-ready-change
    prompt: Apply our frontend engineering standard to this accepted React feature
      before implementation.
    expected: activate
  - id: positive-repository-profile
    prompt: Determine the applicable frontend rules, affected layers, UI system, and
      validation path for this change.
    expected: activate
  - id: positive-brownfield
    prompt: Prepare this legacy frontend change under the local architecture without
      forcing a rewrite.
    expected: activate
  negative:
  - id: negative-profile-only
    prompt: Choose whether this project should use Profile A, B, or C.
    expected: do-not-activate
    expected_alternative: classifying-frontend-architecture-profile
  - id: negative-plan
    prompt: Break this feature into frontend vertical slices.
    expected: do-not-activate
    expected_alternative: planning-frontend-vertical-slices
  - id: negative-implement
    prompt: Implement this React feature.
    expected: do-not-activate
    expected_alternative: focused frontend implementation skills
procedure:
- id: subscription-promotion-ui
  fixture: fixtures/subscription-promotion-ui.md
  required_steps:
  - confirm-accepted-user-visible-behavior
  - read-rule-precedence-and-local-agents
  - discover-framework-rendering-state-data-styling-ui-and-test-profile
  - identify-capability-and-ownership
  - indicate-current-architecture-profile
  - classify-affected-layers-state-and-data
  - classify-components-hooks-effects-and-composition
  - classify-styling-design-system-and-accessibility
  - map-behavior-to-test-boundaries
  - route-focused-skills
  - define-repository-native-validation
  - record-conflicts-and-deviations
  - select-smallest-valid-implementation-path
  - make-frontend-standard-decision
  prohibited_actions:
  - write-production-code
  - introduce-state-library
  - introduce-styling-library
  - force-domain-layer
  - promote-component-to-shared-without-evidence
  - invent-offline-state
  - ignore-accessibility
  - invent-command
  - resolve-design-conflict-silently
  expected_output: expected/subscription-promotion-ui-record.md
edge_cases:
- id: simple-presentational
  scenario: A static legal notice component has no business state or data.
  expected_behavior: profile-a-indicated-no-domain-or-application-layers
- id: offline-workflow
  scenario: Feature owns offline drafts, optimistic transitions, and reconciliation.
  expected_behavior: profile-b-or-c-indicated-and-domain-application-classification
- id: tailwind-request-css-modules-repo
  scenario: Task says use Tailwind but repository policy mandates CSS Modules.
  expected_behavior: record-conflict-and-smallest-design-or-local-override-decision
- id: inaccessible-design
  scenario: Design requires a clickable div with keyboard behavior unspecified.
  expected_behavior: accessibility-decision-or-semantic-button-path
- id: react-query-not-installed
  scenario: Remote state exists but repository uses approved SWR abstraction.
  expected_behavior: preserve-current-strategy-no-silent-react-query
- id: shared-component-overreach
  scenario: One feature needs a unique campaign banner.
  expected_behavior: keep-feature-local-unless-reuse-evidence
context_efficiency:
- id: simple-profile-a-change
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/rule-precedence-and-repository-discovery.md
  - references/frontend-profile-indicators.md
  - references/ui-styling-and-accessibility-profile.md
  - references/test-and-validation-selection.md
  - references/frontend-standard-application-audit.md
  must_not_load:
  - references/layer-state-and-data-classification.md
  - evals/
quality_rubric:
  specification_and_precedence: 5
  repository_discovery: 5
  profile_indication: 5
  capability_and_ownership: 5
  layer_state_and_data_classification: 5
  react_boundary_classification: 5
  styling_and_ui_system: 5
  accessibility: 5
  test_and_validation_selection: 5
  focused_skill_routing: 5
  conflict_and_deviation_handling: 5
  proportionality_and_non_implementation: 5
  context_efficiency: 4
