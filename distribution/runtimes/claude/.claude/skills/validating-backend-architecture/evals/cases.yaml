skill: validating-backend-architecture
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  unsupported_architecture_rules_allowed: 0
  personal_style_findings_allowed: 0
  blocked_checks_reported_as_pass_allowed: 0
  accepted_exceptions_ignored_allowed: 0
  direct_only_import_analysis_allowed: 0
  automatic_refactoring_allowed: 0
  evidence_free_findings_allowed: 0
discovery:
  positive:
  - id: positive-slice-validation
    prompt: Validate this backend vertical slice for hexagonal dependency and boundary
      violations.
    expected: activate
  - id: positive-controller-coupling
    prompt: Check whether controllers call repositories or providers directly.
    expected: activate
  - id: positive-import-rules
    prompt: Add or run architecture checks for Domain, Application, Infrastructure,
      DTOs, Use Cases, and composition.
    expected: activate
  negative:
  - id: negative-implementation
    prompt: Refactor this controller to use a Use Case.
    expected: do-not-activate
    expected_alternative: implementing-http-controllers
  - id: negative-general-review
    prompt: Review this code for performance, security, architecture, and style.
    expected: do-not-activate
    expected_alternative: reviewing-backend-code
  - id: negative-behavior
    prompt: Run the backend test matrix and verify acceptance criteria.
    expected: do-not-activate
    expected_alternative: validating-backend-change
procedure:
- id: promotion-slice-architecture
  fixture: fixtures/promotion-slice-architecture.md
  required_steps:
  - confirm-scope-and-governing-rules
  - map-capability-layers
  - discover-and-run-native-checks
  - inspect-direct-and-transitive-dependencies
  - inspect-cross-module-public-contracts
  - inspect-repository-and-provider-port-adapter-boundaries
  - inspect-controller-coupling
  - inspect-use-case-chaining-and-concrete-dependencies
  - inspect-dto-domain-error-boundaries
  - inspect-composition-and-service-locator
  - inspect-test-boundaries-and-cycles
  - handle-generated-code-and-accepted-exceptions
  - classify-findings-with-evidence
  - record-unavailable-checks-honestly
  - route-remediation-without-changing-code
  prohibited_actions:
  - rewrite-code
  - invent-rule
  - report-style-preference
  - ignore-transitive-leak
  - ignore-accepted-exception
  - mark-unavailable-pass
  - report-filename-only-violation
  - suppress-new-violation-as-baseline
  - claim-repository-wide-validation-from-changed-files-only
  expected_output: expected/promotion-slice-architecture-report.md
edge_cases:
- id: type-only-leak
  scenario: Application imports a provider SDK type with `import type`.
  expected_behavior: report-provider-contract-leak-despite-type-only-runtime
- id: test-import-infrastructure
  scenario: Repository adapter integration test imports Prisma adapter.
  expected_behavior: allowed-because-infrastructure-is-test-subject
- id: deep-public-import
  scenario: Cross-module deep import targets an explicitly public contract and repository
    has no barrel policy.
  expected_behavior: do-not-report-automatically
- id: accepted-exception
  scenario: Legacy module has documented temporary Application-to-Infrastructure dependency.
  expected_behavior: classify-accepted-temporary-and-check-scope-expiry-no-silent-fail
- id: use-case-through-container
  scenario: Use Case calls another Use Case using `container.resolve`.
  expected_behavior: detect-use-case-chaining-and-service-locator
- id: generated-sdk
  scenario: Generated SDK contains framework/provider imports.
  expected_behavior: exclude-documented-generated-output-but-validate-maintained-wrapper-boundary
context_efficiency:
- id: changed-slice
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/dependency-direction-and-layers.md
  - references/ports-adapters-controllers-and-use-cases.md
  - references/dto-domain-error-and-composition-boundaries.md
  - references/architecture-automation-and-evidence.md
  - references/backend-architecture-audit-checklist.md
  must_not_load:
  - references/module-and-public-contract-boundaries.md
  - references/brownfield-baselines-and-exceptions.md
  - evals/
quality_rubric:
  scope_and_rule_fidelity: 5
  dependency_direction_analysis: 5
  module_boundary_analysis: 5
  port_adapter_analysis: 5
  controller_and_use_case_analysis: 5
  dto_domain_error_analysis: 5
  composition_and_service_locator_analysis: 5
  test_boundary_analysis: 5
  cycle_and_transitive_analysis: 5
  automation_and_evidence: 5
  exception_and_baseline_handling: 5
  finding_quality_and_routing: 5
  context_efficiency: 4
