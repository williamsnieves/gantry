skill: modeling-domain-entities
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  partially_valid_entities_allowed: 0
  anemic_setter_models_allowed: 0
  exposed_mutable_collections_allowed: 0
  infrastructure_leakage_allowed: 0
  wrong_equality_semantics_allowed: 0
  invented_business_rules_allowed: 0
discovery:
  positive:
  - id: positive-new-entity
    prompt: Model the Promotion Domain Entity with identity, lifecycle, invariants,
      and tests.
    expected: activate
  - id: positive-anemic
    prompt: Refactor this anemic Order entity so callers cannot set status or mutate
      items directly.
    expected: activate
  negative:
  - id: negative-value-object
    prompt: Create an immutable Money type with currency-aware equality.
    expected: do-not-activate
    expected_alternative: modeling-domain-value-objects
  - id: negative-persistence
    prompt: Create the TypeORM entity and database column mappings.
    expected: do-not-activate
    expected_alternative: implementing-repository-adapters
  - id: negative-service
    prompt: Design a pure pricing calculation that spans multiple aggregates.
    expected: do-not-activate
    expected_alternative: designing-domain-services
  - id: negative-dto
    prompt: Create the API response DTO.
    expected: do-not-activate
    expected_alternative: designing-application-dtos
procedure:
- id: promotion-entity
  fixture: fixtures/promotion-entity.md
  required_steps:
  - confirm-entity-suitability
  - resolve-identity-policy
  - define-responsibility
  - model-lifecycle
  - catalog-invariants
  - design-valid-construction
  - design-intent-operations
  - encapsulate-collections
  - define-identity-equality
  - define-domain-serialization
  - design-tests
  - check-boundaries
  - decide-readiness
  prohibited_actions:
  - public-set-status
  - public-set-items
  - accept-partial-state
  - import-orm
  - return-api-dto
  - invent-reactivation-rule
  - compare-all-attributes-for-equality
  expected_output: expected/promotion-entity-report.md
edge_cases:
- id: invalid-partial-construction
  scenario: A public constructor allows status Active without activation date.
  expected_behavior: reject-and-use-valid-construction
- id: transition-invariant
  scenario: Redeemed promotion is requested to expire.
  expected_behavior: reject-prohibited-transition
- id: collection-exposure
  scenario: Getter returns internal mutable redemptions array.
  expected_behavior: return-copy-readonly-or-query
- id: infrastructure-concern
  scenario: Entity method calls repository to detect duplicates.
  expected_behavior: move-orchestration-outside-domain-entity
- id: id-policy
  scenario: Project uses generic Id but request asks for PromotionId only here.
  expected_behavior: follow-central-policy-or-require-central-decision
- id: not-an-entity
  scenario: Email address has no lifecycle and is value-defined.
  expected_behavior: route-to-value-object
context_efficiency:
- id: new-simple-entity
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/entity-suitability-and-identity.md
  - references/lifecycle-and-invariants.md
  - references/construction-and-reconstitution.md
  - references/rich-behavior-and-collections.md
  - references/entity-testing.md
  must_not_load:
  - references/evolving-anemic-entities.md
  - references/serialization-errors-and-events.md
  - evals/
quality_rubric:
  entity_suitability: 5
  identity_policy: 5
  lifecycle_model: 5
  invariant_protection: 5
  construction_validity: 5
  rich_behavior: 5
  collection_encapsulation: 5
  equality_semantics: 5
  boundary_purity: 5
  test_quality: 5
  non_fabrication: 5
  context_efficiency: 4
