skill: testing-frontend-adapters
version: 0.1.0
passing_policy:
  adapter_mocked_as_sut_allowed: 0
  fetch_internal_mock_when_msw_is_approved_allowed: 0
  global_404_to_undefined_allowed: 0
  malformed_payload_leaks_inward_allowed: 0
  infinite_auth_refresh_retry_allowed: 0
  offline_semantics_invented_without_contract_allowed: 0
  plain_object_as_indexeddb_proof_allowed: 0
  production_provider_credentials_allowed: 0
  sandbox_test_mixed_with_fast_unit_suite_without_policy_allowed: 0
  react_ui_behavior_in_adapter_suite_allowed: 0
discovery:
  positive:
  - id: positive-http
    prompt: Test this frontend HTTP repository adapter with MSW including mapping,
      404, malformed payload, and cancellation.
    expected: activate
  - id: positive-idb
    prompt: Test this IndexedDB repository mapping, migrations, corrupt data, and
      missing records against a browser-like IndexedDB runtime.
    expected: activate
  - id: positive-sandbox
    prompt: Add a safe provider sandbox compatibility test for this frontend vendor
      adapter.
    expected: activate
  negative:
  - id: negative-usecase
    prompt: Test this Use Case with an InMemory repository.
    expected: do-not-activate
    expected_alternative: testing-frontend-domain-and-use-cases
  - id: negative-hook
    prompt: Test the hook loading/error state after this repository call.
    expected: do-not-activate
    expected_alternative: testing-react-hooks
  - id: negative-e2e
    prompt: Test the full user checkout flow in a real browser.
    expected: do-not-activate
    expected_alternative: testing-frontend-user-journeys
procedure:
- id: subscription-adapters
  fixture: fixtures/subscription-adapters.md
  required_steps:
  - inspect-port-adapter-runtime-validation-http-storage-auth-offline-and-sandbox-policies
  - select-faithful-boundary-per-adapter
  - execute-real-adapter-not-a-mock
  - verify-request-and-inbound-outbound-mapping
  - verify-operation-specific-404-semantics
  - verify-malformed-provider-payload-rejection-and-stable-error
  - verify-cancellation-propagation-if-supported
  - verify-representative-auth-refresh-integration-if-project-policy-supports-it
  - verify-explicit-offline-semantics-without-inventing-fallbacks
  - verify-indexeddb-roundtrip-mapping-missing-and-migration-on-browser-like-runtime
  - design-safe-provider-sandbox-contract-test-with-test-only-credentials-and-cleanup
  - reuse-shared-port-contract-suite-where-multiple-implementations-exist
  - separate-fast-adapter-browser-and-sandbox-test-layers
  - audit-security-privacy-isolation-and-cleanup
  - produce-adapter-testing-record
  prohibited_actions:
  - mock-subscription-adapter
  - spy-on-global-fetch-instead-of-approved-msw
  - map-all-404-to-undefined
  - accept-malformed-provider-payload
  - retry-refresh-indefinitely
  - assume-indexeddb-means-offline-support
  - use-plain-map-to-prove-indexeddb
  - use-production-provider-token
  - leave-sandbox-resources
  - render-react-component-in-adapter-test
  expected_output: expected/subscription-adapters-record.md
edge_cases:
- id: '404'
  scenario: GET subscription lookup returns 404 while POST apply-promotion endpoint
    also can return 404.
  expected_behavior: lookup-maps-to-port-absence-if-defined-command-maps-to-stable-not-found-error-not-global-undefined
- id: malformed
  scenario: Provider returns 200 JSON with missing required subscription id and unknown
    enum.
  expected_behavior: runtime-validation-or-mapper-rejects-with-stable-malformed-external-data-semantic
- id: auth-refresh
  scenario: First request gets 401, approved HTTP client refresh succeeds, retried
    request succeeds.
  expected_behavior: representative-adapter-integration-passes-with-one-bounded-refresh-no-loop
- id: offline
  scenario: Remote repository loses network but port has no local-first policy.
  expected_behavior: stable-unavailable-network-error-no-invented-indexeddb-fallback
- id: indexeddb
  scenario: Stored v1 record must migrate to v2 and map ISO date to inward date representation.
  expected_behavior: browser-like-indexeddb-migration-roundtrip-proves-correct-mapping-and-cleanup
- id: sandbox
  scenario: Vendor exposes a test project with seeded resources and test-only credentials.
  expected_behavior: separate-tagged-sandbox-contract-test-with-safe-resource-lifecycle-and-no-production-secrets
quality_rubric:
  boundary_faithfulness: 5
  request_mapping: 5
  response_mapping_and_runtime_validation: 5
  stable_error_semantics: 5
  cancellation: 5
  auth_refresh_boundary: 5
  offline_semantics: 5
  indexeddb_storage_runtime: 5
  provider_sandbox_safety: 5
  contract_test_reuse_and_layering: 5
  security_isolation_cleanup: 5
  final_status: 5
