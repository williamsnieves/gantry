skill: modeling-event-flows
version: 0.1.0
passing_policy:
  invent_event_interaction_allowed: 0
  invent_broker_or_topic_allowed: 0
  invent_exactly_once_allowed: 0
  invent_retry_policy_allowed: 0
  invent_dead_letter_queue_allowed: 0
  invent_dedup_key_allowed: 0
  invent_event_schema_fields_allowed: 0
  invent_versioning_policy_allowed: 0
  event_sourcing_implied_allowed: 0
  c4_state_domain_conflict_silently_resolved_allowed: 0
discovery:
  positive:
  - id: positive-event
    prompt: Model the producer, event, consumers, delivery semantics, ordering, retries,
      deduplication and versioning for this accepted async integration.
    expected: activate
  - id: positive-provider
    prompt: Document the provider event flow, preserving provider-defined guarantees
      and our unknown retry/dedup policy.
    expected: activate
  - id: positive-consumers
    prompt: Create an event catalog and consumer ownership model for these accepted
      integration events.
    expected: activate
  negative:
  - id: negative-sequence
    prompt: Show the exact temporal request/callback sequence.
    expected: do-not-activate
    expected_alternative: modeling-system-sequences
  - id: negative-state
    prompt: Model OPEN to RESOLVED transitions and invalid state changes.
    expected: do-not-activate
    expected_alternative: modeling-state-machines
  - id: negative-broker
    prompt: Design Kafka topics, partitions, retention and broker cluster layout.
    expected: do-not-activate
    expected_alternative: messaging/deployment infrastructure design
procedure:
- id: support-platform-event-flow
  fixture: fixtures/support-platform-event-flow-input.md
  required_steps:
  - establish-event-flow-scope-and-verify-accepted-asynchronous-interaction
  - identify-accepted-producers-events-consumers-and-contract-ownership
  - model-event-purpose-and-semantic-contract-without-invented-payload-fields
  - record-delivery-semantics-only-when-known-and-flag-unknowns
  - record-ordering-scope-and-late-outoforder-policy-only-when-known
  - record-retry-owner-eligibility-terminal-behavior-without-invented-attempts-or-backoff
  - record-deduplication-and-idempotency-separately-without-invented-keys
  - record-dead-letter-or-permanent-failure-behavior-without-assuming-dlq
  - record-versioning-and-compatibility-policy-only-when-evidenced
  - record-event-emission-order-and-dualwrite-consistency-question-without-prescribing-outbox
  - align-events-with-state-domain-dfd-sequence-c4-and-adrs
  - avoid-event-sourcing-cqrs-broker-topic-schema-registry-invention
  - audit-fanout-fanin-cycles-retry-storm-duplicate-effect-ordering-schema-and-orphan-risks
  - produce-deployment-security-and-validation-handoffs
  - produce-event-flow-model-and-readiness
  prohibited_actions:
  - invent-kafka
  - invent-topic-name
  - invent-exactly-once
  - invent-three-retries
  - invent-exponential-backoff
  - invent-dlq
  - invent-event-id-uuid
  - invent-json-schema-fields
  - invent-schema-registry
  - invent-outbox
  expected_output: expected/support-platform-event-flow-model.md
edge_cases:
- id: delivery-semantics
  scenario: Architecture says async event exists but does not state at-least-once/at-most-once.
  expected_behavior: mark-delivery-semantics-required-not-infer-broker-default
- id: dedup
  scenario: Provider may deliver duplicate event; duplicate business effect would
    be harmful but identity basis is unknown.
  expected_behavior: flag-deduplication-or-idempotency-policy-and-identity-gap-without-inventing-key
- id: dead-letter
  scenario: Consumer can permanently reject an event but no DLQ/handling policy exists.
  expected_behavior: require-dead-letter-behavior-without-assuming-a-queue
- id: versioning
  scenario: Producer and consumer deploy independently but event evolution policy
    is unspecified.
  expected_behavior: flag-event-versioning-policy-required-and-compatibility-risk
- id: event-sourcing
  scenario: System publishes ConversationResolved event.
  expected_behavior: do-not-infer-event-store-cqrs-or-event-sourced-aggregate
- id: event-emission-order
  scenario: State must be persisted and event emitted, but atomicity/order decision
    is absent.
  expected_behavior: flag-event-emission-order-or-dualwrite-consistency-risk-without-prescribing-outbox
context_efficiency:
- id: standard-event-flow
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/event-flow-purpose-producer-event-consumer-and-ownership.md
  - references/delivery-ordering-retries-deduplication-and-dead-letter.md
  - references/schema-versioning-compatibility-and-breaking-changes.md
  - references/state-domain-dfd-sequence-and-c4-alignment.md
  - references/event-sourcing-cqrs-broker-and-infrastructure-boundaries.md
  must_not_load_unless_needed:
  - references/event-identity-correlation-idempotency-and-replay.md
  - references/fanout-fanin-choreography-backpressure-and-failure-risks.md
  - evals/
quality_rubric:
  scope_and_async_evidence: 5
  producer_event_consumer_ownership: 5
  delivery_and_ordering: 5
  retry_and_dead_letter: 5
  dedup_idempotency_identity: 5
  schema_versioning_compatibility: 5
  emission_consistency_and_failure: 5
  alignment_with_other_models: 5
  no_broker_event_sourcing_invention: 5
  fanout_fanin_risk_audits: 5
  traceability: 5
  handoffs_and_readiness: 5
