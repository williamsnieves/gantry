skill: analyzing-details
version: 0.1.0

passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  invented_requirements_allowed: 0
  optional_enhancements_reported_as_defects_allowed: 0
  code_modifications_allowed: 0

discovery:
  positive:
    - id: positive-completeness
      prompt: "Analyze this change in detail and identify omissions or inconsistencies before implementation."
      expected: activate
    - id: positive-propagation
      prompt: "Check whether this requirement is fully propagated through specs, design, tasks, code, tests, and docs."
      expected: activate
    - id: positive-pr
      prompt: "Perform a meticulous completeness review of this pull request."
      expected: activate
  negative:
    - id: negative-adversarial
      prompt: "Try to break this authorization change under hostile conditions."
      expected: do-not-activate
      expected_alternative: reviewing-adversarially
    - id: negative-audit
      prompt: "Audit the whole repository for security and technical debt."
      expected: do-not-activate
      expected_alternative: auditing-code
    - id: negative-validation
      prompt: "Run lint, tests, and build."
      expected: do-not-activate
      expected_alternative: validating-changes

procedure:
  - id: cross-layer-change
    fixture: fixtures/cross-layer-change.md
    required_steps:
      - anchor-authoritative-intent
      - inventory-surfaces
      - trace-propagation
      - inspect-boundaries
      - compare-representations
      - classify-findings
      - assess-materiality
      - report-readiness
    prohibited_actions:
      - modify-files
      - invent-product-decision
      - report-style-preference
    expected_output: expected/cross-layer-change.md

edge_cases:
  - id: generated-client
    scenario: "An API schema changes but the plan omits generated client regeneration."
    expected_behavior: report-propagation-omission
  - id: framework-default
    scenario: "A detail appears absent but is supplied by a verified framework convention."
    expected_behavior: reject-false-positive
  - id: unresolved-copy
    scenario: "The required error message text has not been approved."
    expected_behavior: record-open-question-not-invent-copy
  - id: deferred-scope
    scenario: "A related feature is explicitly out of scope and tracked separately."
    expected_behavior: do-not-report-as-omission
  - id: no-findings
    scenario: "All authoritative requirements are consistently represented."
    expected_behavior: report-ready-and-document-coverage

quality_rubric:
  intent_anchoring: 5
  surface_inventory: 5
  propagation_accuracy: 5
  omission_detection: 5
  inconsistency_detection: 5
  false_positive_control: 5
  materiality_calibration: 5
  correction_quality: 5
  readiness_accuracy: 5
