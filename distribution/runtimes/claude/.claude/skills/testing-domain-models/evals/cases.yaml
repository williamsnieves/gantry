skill: testing-domain-models
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  infrastructure_dependencies_allowed: 0
  domain_mocks_allowed: 0
  private_field_assertions_allowed: 0
  uncontrolled_time_or_randomness_allowed: 0
  unexecuted_test_claims_allowed: 0
  low_value_coverage_padding_allowed: 0
discovery:
  positive:
  - id: positive-entity
    prompt: Create pure unit tests for Promotion Entity invariants and state transitions.
    expected: activate
  - id: positive-value-object
    prompt: Test Money equality, currency mismatch, immutability, and serialization.
    expected: activate
  - id: positive-domain-service
    prompt: Test PromotionEligibilityPolicy with real Domain objects and no mocks.
    expected: activate
  negative:
  - id: negative-use-case
    prompt: Test ApplyPromotionUseCase with repositories and provider doubles.
    expected: do-not-activate
    expected_alternative: testing-application-use-cases
  - id: negative-repository
    prompt: Test PrismaPromotionRepository against PostgreSQL.
    expected: do-not-activate
    expected_alternative: testing-repository-adapters
  - id: negative-http
    prompt: Test POST /subscriptions/:id/promotions.
    expected: do-not-activate
    expected_alternative: testing-backend-http-e2e
procedure:
- id: promotion-domain-tests
  fixture: fixtures/promotion-domain-tests.md
  required_steps:
  - identify-domain-model-types
  - inventory-accepted-behavior
  - design-pure-public-api-fixtures
  - test-valid-and-invalid-construction
  - test-permitted-and-rejected-transitions
  - test-unchanged-state-after-rejection
  - test-value-equality-and-immutability
  - test-collection-encapsulation-and-serialization
  - test-domain-service-with-real-domain-inputs
  - audit-no-mocks-or-infrastructure
  - run-focused-and-neighboring-tests
  - record-evidence-and-gaps
  prohibited_actions:
  - import-prisma
  - import-http-framework
  - mock-promotion
  - mock-money
  - mock-domain-service
  - assert-private-status-field
  - use-real-clock
  - claim-tests-pass-without-running
  expected_output: expected/promotion-domain-tests-record.md
edge_cases:
- id: rejected-transition-state
  scenario: Redeem fails for an expired Promotion.
  expected_behavior: assert-domain-error-and-state-unchanged
- id: collection-leak
  scenario: Caller mutates array returned by Entity.
  expected_behavior: entity-internal-collection-remains-unchanged
- id: money-reference
  scenario: Two Money instances have equal amount/currency.
  expected_behavior: use-semantic-equals-not-reference-equality
- id: time-boundary
  scenario: Promotion expires exactly at current time.
  expected_behavior: use-explicit-time-and-accepted-boundary-rule
- id: domain-service-repository
  scenario: Domain Service test asks for a repository mock.
  expected_behavior: return-to-domain-service-design-or-move-orchestration-outward
- id: serialization-copy
  scenario: Composite primitive output contains a mutable array.
  expected_behavior: mutating-output-does-not-change-domain-state
context_efficiency:
- id: entity-only
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/domain-test-purity.md
  - references/entity-testing.md
  - references/test-data-and-assertions.md
  - references/domain-test-audit.md
  must_not_load:
  - references/value-object-testing.md
  - references/domain-service-testing.md
  - evals/
quality_rubric:
  purity: 5
  behavior_inventory: 5
  public_api_testing: 5
  entity_invariants_and_transitions: 5
  value_object_equality_and_immutability: 5
  domain_service_testing: 5
  deterministic_data: 5
  assertion_quality: 5
  serialization_and_collections: 5
  execution_evidence: 5
  boundary_audit: 5
  non_speculation: 5
  context_efficiency: 4
