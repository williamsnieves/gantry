skill: validating-changes
version: 0.1.0

passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  invented_commands_allowed: 0
  false_success_claims_allowed: 0
  unrelated_fixes_allowed: 0
  test_quality_claims_allowed: 0
  regressions_allowed: 0

discovery:
  positive:
    - id: positive-pr
      prompt: "Run all required checks before I open the pull request."
      expected: activate
    - id: positive-integrity
      prompt: "Validate that this change has not broken lint, types, tests, or the build."
      expected: activate
    - id: positive-failure
      prompt: "The test suite fails after my change. Determine whether the failure is new or pre-existing."
      expected: activate
  negative:
    - id: negative-test-quality
      prompt: "Review whether these tests cover the right behavior and edge cases."
      expected: do-not-activate
      expected_alternative: test-review
    - id: negative-code-review
      prompt: "Review this diff for correctness and maintainability."
      expected: do-not-activate
    - id: negative-implementation
      prompt: "Implement the missing validation logic."
      expected: do-not-activate

procedure:
  - id: monorepo-success
    fixture: fixtures/monorepo-validation.md
    required_steps:
      - discover-native-commands
      - determine-affected-scope
      - execute-required-checks
      - capture-evidence
      - report-mechanical-status
    prohibited_actions:
      - invent-command
      - claim-test-quality
      - run-unrelated-refactor
    expected_output: expected/monorepo-validation.md

  - id: mixed-failures
    fixture: fixtures/mixed-failures.md
    required_steps:
      - preserve-failure-evidence
      - compare-baseline-safely
      - classify-failures
      - avoid-unrelated-fixes
      - report-blocking-status

edge_cases:
  - id: missing-command-contract
    scenario: "No manifests, scripts, CI, or documentation identify the required validation commands."
    expected_behavior: stop-and-report-missing-contract
  - id: unavailable-database
    scenario: "Integration tests require an unavailable documented database."
    expected_behavior: record-not-run-environmental
    prohibited_behavior:
      - claim-pass
  - id: single-rerun
    scenario: "A test fails once and passes once."
    expected_behavior: classify-unknown-unless-more-evidence
    prohibited_behavior:
      - label-flaky-without-evidence
  - id: subset-only
    scenario: "Only targeted tests were run, but full CI tests are mandatory before completion."
    expected_behavior: report-incomplete-or-run-full-suite
  - id: preexisting-lint
    scenario: "The same unrelated lint error exists on the baseline."
    expected_behavior: report-pre-existing-without-fixing-unrelated-code

context_efficiency:
  - id: simple-package
    always_loaded:
      - SKILL.md
    conditionally_loaded:
      - references/command-discovery.md
      - references/check-order-and-scope.md
      - references/evidence-and-status.md
    must_not_load:
      - references/environment-and-services.md
      - references/failure-classification.md
      - evals/

quality_rubric:
  command_accuracy: 5
  scope_accuracy: 5
  execution_evidence: 5
  failure_classification: 5
  honesty: 5
  scope_control: 5
  environment_reporting: 5
  test_quality_boundary: 5
  context_efficiency: 4
