skill: modeling-state-machines
version: 0.1.0
passing_policy:
  invent_state_allowed: 0
  activity_as_state_allowed: 0
  invent_transition_allowed: 0
  invent_illegal_transition_semantics_allowed: 0
  invent_concurrency_policy_allowed: 0
  invent_idempotency_or_ordering_semantics_allowed: 0
  implementation_locking_strategy_allowed: 0
  state_explosion_allowed: 0
  provider_state_blindly_merged_allowed: 0
  unreachable_or_nondeterministic_model_marked_ready_allowed: 0
discovery:
  positive:
  - id: positive-lifecycle
    prompt: Model this subscription lifecycle with states, events, guards, transitions,
      cancellations and illegal transitions.
    expected: activate
  - id: positive-concurrency
    prompt: Model the state machine and highlight unspecified concurrent transition
      semantics.
    expected: activate
  - id: positive-payment
    prompt: Create a payment attempt state model including callback, cancel, failure,
      duplicate event and ordering gaps where supported.
    expected: activate
  negative:
  - id: negative-process
    prompt: Create a decision flowchart for manager approval.
    expected: do-not-activate
    expected_alternative: modeling-process-flows
  - id: negative-sequence
    prompt: Show frontend API provider database message order.
    expected: do-not-activate
    expected_alternative: modeling-system-sequences
  - id: negative-enum
    prompt: List all status enum values in this TypeScript file.
    expected: do-not-activate
    expected_alternative: code/file inspection
procedure:
- id: support-platform-conversation-state
  fixture: fixtures/support-platform-lifecycle-input.md
  required_steps:
  - define-conversation-as-lifecycle-subject
  - extract-only-accepted-stable-states
  - identify-initial-state-or-flag-gap
  - define-resolve-event-guard-transition-and-semantic-effect
  - exclude-unaccepted-reopen-transition
  - document-important-illegal-resolve-from-resolved-behavior-as-gap-if-unspecified
  - analyze-reply-capability-by-state
  - analyze-manager-reassign-vs-agent-resolve-concurrency-without-inventing-locking-or-winner
  - preserve-retention-as-out-of-scope-policy-gap
  - avoid-ui-api-database-service-and-enum-implementation-detail
  - audit-reachability-terminal-semantics-dead-states-and-determinism
  - trace-states-transitions-to-frs-usecases-processflows-and-rules
  - identify-sequence-and-data-model-handoffs
  - produce-state-machine-model-and-readiness
  prohibited_actions:
  - add-reopened-as-legal-state
  - invent-archived-state
  - choose-resolve-idempotent-semantics
  - choose-optimistic-locking
  - choose-database-transaction
  - invent-event-ordering-policy
  - create-frontend-api-db-sequence
  - model-clicking-resolve-as-state
  - create-retention-expired-transition
  - mark-concurrency-unknown-as-resolved
  expected_output: expected/support-platform-state-machine-model.md
edge_cases:
- id: illegal-transition
  scenario: Conversation is already RESOLVED and another resolve request arrives;
    behavior is unspecified.
  expected_behavior: record-illegal-or-duplicate-transition-semantics-as-required-not-choose-error-noop-or-idempotent-success
- id: concurrency
  scenario: Agent resolves conversation at the same time a manager reassigns it.
  expected_behavior: flag-concurrency-policy-required-and-semantic-race-without-locking-versioning-tactic
- id: rollback-cancel
  scenario: Payment can be cancelled before confirmation, but after provider capture
    a compensating refund may be required.
  expected_behavior: distinguish-cancel-transition-from-compensation-and-do-not-assume-database-rollback
- id: reopen
  scenario: Stakeholders discuss reopening resolved conversations, but feature is
    not accepted.
  expected_behavior: exclude-transition-from-legal-machine-and-record-proposed-or-open-decision
- id: state-explosion
  scenario: Model proposes OPEN_ASSIGNED_HIGH_PRIORITY and OPEN_UNASSIGNED_LOW_PRIORITY
    as separate states.
  expected_behavior: reject-attribute-combination-state-explosion-and-keep-orthogonal-properties-outside-lifecycle-unless-transitions-depend-on-them
context_efficiency:
- id: standard-state-machine
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/state-machine-purpose-subject-states-events-and-transitions.md
  - references/guards-effects-illegal-transitions-and-invariants.md
  - references/cancellation-rollback-reopen-failure-and-terminal-states.md
  - references/concurrency-idempotency-ordering-and-race-semantics.md
  - references/reachability-determinism-completeness-and-diagram-discipline.md
  must_not_load_unless_needed:
  - references/state-explosion-composite-parallel-and-provider-state.md
  - references/state-machine-vs-process-sequence-usecase-and-data-model.md
  - evals/
quality_rubric:
  subject_and_state_quality: 5
  events_guards_transitions: 5
  effects_invariants_illegal_transitions: 5
  initial_terminal_failure_states: 5
  cancel_reopen_rollback: 5
  concurrency_races: 5
  idempotency_ordering_external_events: 5
  state_explosion_provider_state: 5
  reachability_determinism: 5
  diagram_discipline: 5
  traceability_and_boundaries: 5
  handoffs_and_readiness: 5
