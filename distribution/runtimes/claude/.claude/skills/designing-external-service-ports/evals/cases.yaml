skill: designing-external-service-ports
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  provider_specific_contracts_allowed: 0
  sdk_or_http_types_allowed: 0
  generic_api_clients_allowed: 0
  unjustified_operations_allowed: 0
  undefined_failure_semantics_allowed: 0
  hidden_resilience_ownership_allowed: 0
  credential_leakage_allowed: 0
discovery:
  positive:
  - id: positive-payment
    prompt: Design a provider-neutral PaymentGateway port for this Use Case, including
      failure and idempotency semantics.
    expected: activate
  - id: positive-provider-leak
    prompt: Replace the campaign SDK dependency in Application with a testable external-service
      port.
    expected: activate
  - id: positive-clock
    prompt: Design a deterministic Clock port for Application Use Cases.
    expected: activate
  negative:
  - id: negative-adapter
    prompt: Implement the Stripe payment adapter with retries.
    expected: do-not-activate
    expected_alternative: implementing-external-service-adapters
  - id: negative-repository
    prompt: Design the repository for persisting Payment aggregates.
    expected: do-not-activate
    expected_alternative: designing-domain-repositories
  - id: negative-domain
    prompt: Calculate a discount across several Money values.
    expected: do-not-activate
    expected_alternative: designing-domain-services
  - id: negative-generic-client
    prompt: Create an ExternalApiClient with request(method, path, body).
    expected: do-not-proceed
procedure:
- id: campaign-provider-port
  fixture: fixtures/campaign-provider-port.md
  required_steps:
  - confirm-port-suitability
  - resolve-application-ownership
  - define-focused-capability
  - derive-operations-from-use-case
  - design-provider-neutral-inputs
  - design-semantic-outputs
  - define-failure-taxonomy
  - assign-timeout-retry-and-idempotency
  - define-security-and-privacy
  - design-test-doubles
  - define-adapter-handoff
  - audit-boundaries
  - decide-readiness
  prohibited_actions:
  - use-provider-sdk-request
  - return-provider-response
  - expose-http-status
  - expose-api-key
  - name-port-after-provider
  - generic-request-method
  - hide-retry-policy
  - invent-fallback
  expected_output: expected/campaign-provider-port-report.md
edge_cases:
- id: payment-stages
  scenario: Provider supports authorize and capture separately.
  expected_behavior: model-distinct-application-intentions
- id: async-notification
  scenario: Email provider only acknowledges queueing.
  expected_behavior: return-queued-not-delivered
- id: ambiguous-timeout
  scenario: Timeout may occur after provider applied the command.
  expected_behavior: define-idempotency-and-reconciliation
- id: external-identity-score
  scenario: Provider returns proprietary score but Application only needs verified/review/rejected.
  expected_behavior: map-to-stable-application-decision
- id: clock
  scenario: Use Case needs current time.
  expected_behavior: focused-clock-port-with-deterministic-fake
- id: tenant-credentials
  scenario: Different tenants use different provider accounts.
  expected_behavior: pass-provider-neutral-tenant-context-and-resolve-credentials-in-adapter
context_efficiency:
- id: simple-notifier
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/port-suitability-and-ownership.md
  - references/operation-input-output-design.md
  - references/success-and-failure-semantics.md
  - references/test-doubles-and-use-case-testing.md
  - references/adapter-handoff.md
  must_not_load:
  - references/resilience-idempotency-and-async.md
  - references/security-privacy-and-tenancy.md
  - references/refactoring-provider-coupling.md
  - evals/
quality_rubric:
  port_suitability: 5
  application_ownership: 5
  capability_focus: 5
  operation_traceability: 5
  provider_neutral_contract: 5
  success_failure_semantics: 5
  resilience_and_idempotency: 5
  security_privacy: 5
  testability: 5
  adapter_handoff: 5
  replacement_resilience: 5
  non_speculation: 5
  context_efficiency: 4
