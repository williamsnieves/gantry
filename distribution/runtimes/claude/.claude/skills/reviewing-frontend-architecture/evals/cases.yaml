skill: reviewing-frontend-architecture
version: 0.1.0
passing_policy:
  must_should_conflation_allowed: 0
  preference_as_blocker_allowed: 0
  profile_escalation_without_evidence_allowed: 0
  repository_wide_rewrite_for_local_issue_allowed: 0
  performance_claim_without_evidence_allowed: 0
  axe_as_conformance_allowed: 0
  accepted_deviation_re_reported_as_violation_allowed: 0
  new_policy_invention_allowed: 0
  new_library_selection_allowed: 0
  suggestions_mixed_with_blockers_allowed: 0
discovery:
  positive:
  - id: positive-review
    prompt: Review this frontend change against our definitive standard and separate
      violations from suggestions.
    expected: activate
  - id: positive-holistic
    prompt: Review architecture, hooks, Effects, accessibility, styling, tests, performance,
      and security for this PR.
    expected: activate
  - id: positive-deviation
    prompt: Assess whether this frontend deviation is acceptable and what remediation
      is minimally required.
    expected: activate
  negative:
  - id: negative-validation
    prompt: Check imports, cycles, and public-surface violations against the selected
      profile.
    expected: do-not-activate
    expected_alternative: validating-frontend-architecture
  - id: negative-implementation
    prompt: Refactor this hook and component for me.
    expected: do-not-activate
    expected_alternative: implementation/refactoring skill
  - id: negative-profile
    prompt: Choose the architecture profile for this project.
    expected: do-not-activate
    expected_alternative: classifying-frontend-architecture-profile
procedure:
- id: promotion-architecture-review
  fixture: fixtures/promotion-architecture-review.md
  required_steps:
  - confirm-profile-scope-behavior-and-validation-evidence
  - classify-rules-as-mandatory-convention-policy-deviation-or-suggestion
  - review-profile-fit-ownership-and-layer-responsibilities
  - review-state-effects-races-and-cancellation
  - review-components-hooks-and-composition
  - review-styling-shared-ui-and-accessibility
  - review-error-semantics-and-recovery
  - review-test-strategy-quality-and-duplication
  - review-performance-only-with-evidence
  - review-security-and-privacy
  - review-abstractions-yagni-brownfield-and-migration-context
  - rank-findings-by-impact
  - separate-suggestions-and-accepted-deviations
  - recommend-smallest-remediation
  - produce-review-record-and-final-status
  prohibited_actions:
  - turn-every-should-into-high-severity
  - force-profile-b-on-profile-a
  - ban-useeffect
  - ban-tailwind
  - require-usememo-for-performance-without-measurement
  - claim-axe-proves-aa
  - recommend-new-state-library
  - reopen-approved-migration-deviation-without-new-impact
  - rewrite-repository
  - mix-advisory-naming-suggestion-into-blockers
  expected_output: expected/promotion-architecture-review-record.md
edge_cases:
- id: profile-a
  scenario: Profile A feature has no Domain or Application layers.
  expected_behavior: no-violation-if-complexity-does-not-justify-them
- id: effect
  scenario: Effect derives a filtered list from props.
  expected_behavior: flag-default-or-material-concern-and-recommend-render-derivation
- id: performance
  scenario: Reviewer dislikes rerenders but has no measurements.
  expected_behavior: advisory-or-evidence-required-not-blocker-and-no-blanket-memoization
- id: accessibility
  scenario: Critical dialog cannot be operated by keyboard.
  expected_behavior: high-or-blocker-functional-accessibility-finding
- id: deviation
  scenario: Temporary CSS Modules/Tailwind migration boundary is already accepted
    and documented.
  expected_behavior: record-accepted-deviation-not-violation
- id: shared
  scenario: Generic-looking component has one feature-specific consumer.
  expected_behavior: do-not-promote-to-shared-without-real-consumer-evidence
- id: testing
  scenario: Every API error is repeated in adapter, component, and E2E.
  expected_behavior: flag-duplication-and-keep-distinct-risk-per-boundary
quality_rubric:
  rule_classification: 5
  severity_and_impact: 5
  profile_fit_and_ownership: 5
  state_effects_and_async: 5
  components_hooks_and_composition: 5
  styling_accessibility_and_errors: 5
  testing: 5
  performance_evidence: 5
  security_and_privacy: 5
  abstraction_brownfield_and_deviations: 5
  minimal_remediation: 5
  review_status_and_scope_control: 5
