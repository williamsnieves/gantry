skill: extracting-domain-model-from-legacy-code
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  production_refactor_allowed: 0
  table_to_entity_inference_allowed: 0
  provider_concept_in_domain_allowed: 0
  known_bug_as_invariant_allowed: 0
  contradiction_silently_resolved_allowed: 0
  every_primitive_value_object_allowed: 0
  io_domain_service_allowed: 0
  invented_product_rule_allowed: 0
discovery:
  positive:
  - id: positive-legacy-service
    prompt: Discover the Domain model hidden inside this legacy controller, service,
      Prisma, and provider flow.
    expected: activate
  - id: positive-invariants
    prompt: Extract candidate invariants, Entities, and Value Objects before we refactor.
    expected: activate
  - id: positive-contradictions
    prompt: Compare legacy paths and propose the Domain model without guessing contradictory
      rules.
    expected: activate
  negative:
  - id: negative-accepted-model
    prompt: Implement the accepted Promotion Entity.
    expected: do-not-activate
    expected_alternative: modeling-domain-entities
  - id: negative-refactor
    prompt: Move the legacy flow to hexagonal architecture.
    expected: do-not-activate
    expected_alternative: refactoring-backend-toward-hexagonal-architecture
  - id: negative-greenfield
    prompt: Design a Domain model from these new product requirements.
    expected: do-not-activate
    expected_alternative: focused Domain modeling skills
procedure:
- id: promotion-domain-extraction
  fixture: fixtures/legacy-promotion-domain-extraction.md
  required_steps:
  - confirm-one-coherent-legacy-capability
  - gather-product-test-contract-data-code-and-provider-evidence
  - trace-all-entry-points-and-state-writers
  - inventory-decisions-and-state-transitions
  - separate-domain-application-persistence-provider-delivery-compatibility-and-security
  - identify-invariants-with-confidence-and-counterexamples
  - propose-entities-with-identity-and-lifecycle-evidence
  - propose-value-objects-with-real-semantics
  - propose-pure-domain-services-only
  - classify-semantic-errors-and-repository-concepts
  - exclude-technical-provider-and-legacy-concepts
  - record-unknown-data-contradictions-and-known-bugs
  - challenge-over-modeling-and-anemic-modeling
  - propose-pure-domain-test-cases
  - produce-decision-aware-modeling-handoff
  prohibited_actions:
  - modify-production-code
  - map-every-table-to-entity
  - map-every-column-to-value-object
  - put-http-status-in-domain
  - put-provider-operation-id-in-domain-without-business-evidence
  - call-legacy-service-domain-service
  - resolve-contradiction-without-decision
  - freeze-known-bug
  - propose-repository-crud
  - model-entire-repository
  expected_output: expected/legacy-promotion-domain-extraction-record.md
edge_cases:
- id: table-with-id
  scenario: Audit table has an ID but no business lifecycle or behavior.
  expected_behavior: do-not-propose-entity
- id: provider-operation-id
  scenario: Provider operation ID is persisted for reconciliation only.
  expected_behavior: keep-as-external-reference-or-application-infrastructure-concept
- id: value-object-overuse
  scenario: A one-off optional description string has no validation or semantics.
  expected_behavior: keep-primitive-not-value-object
- id: contradictory-expiry
  scenario: API rejects at end time while scheduled job expires one hour later.
  expected_behavior: record-contradiction-and-product-decision-required
- id: legacy-pending
  scenario: LEGACY_PENDING exists only for a retired integration process.
  expected_behavior: classify-compatibility-or-technical-state-not-domain-lifecycle-automatically
- id: service-with-io
  scenario: EligibilityService reads repositories and calls provider.
  expected_behavior: not-domain-service-split-domain-decision-from-application-orchestration
context_efficiency:
- id: single-legacy-capability
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/evidence-and-decision-mining.md
  - references/separating-domain-from-technical-concerns.md
  - references/entities-value-objects-and-services.md
  - references/state-transitions-data-and-contradictions.md
  - references/modeling-proposal-and-handoff.md
  - references/domain-extraction-audit.md
  must_not_load:
  - evals/
quality_rubric:
  scope_and_evidence_quality: 5
  decision_and_transition_mining: 5
  concern_separation: 5
  invariant_quality: 5
  entity_candidate_quality: 5
  value_object_candidate_quality: 5
  domain_service_quality: 5
  error_and_repository_semantics: 5
  legacy_data_and_contradiction_handling: 5
  overmodeling_and_anemic_challenge: 5
  test_proposal_and_handoff: 5
  non_speculation_and_no_refactor: 5
  context_efficiency: 4
