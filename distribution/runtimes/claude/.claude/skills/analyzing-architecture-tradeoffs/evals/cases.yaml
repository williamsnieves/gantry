skill: analyzing-architecture-tradeoffs
version: 0.1.0
passing_policy:
  invented_numeric_score_allowed: 0
  invented_weight_allowed: 0
  invented_threshold_allowed: 0
  hard_constraint_violation_ignored_allowed: 0
  unknown_evidence_as_nonrisk_allowed: 0
  distributed_is_better_assumption_allowed: 0
  technology_popularity_as_decision_reason_allowed: 0
  forced_winner_allowed: 0
  dominance_claim_with_unknown_material_evidence_allowed: 0
  constraint_exception_silently_waived_allowed: 0
discovery:
  positive:
  - id: positive-compare
    prompt: Compare these candidate architectures against our drivers, constraints,
      team size, risks and quality scenarios and recommend only if the evidence supports
      it.
    expected: activate
  - id: positive-sensitive
    prompt: Analyze which architecture choice is sensitive to our unknown scale and
      RTO/RPO targets.
    expected: activate
  - id: positive-no-winner
    prompt: Perform trade-off analysis and allow the result to be no clear winner
      if the candidates are Pareto-optimal.
    expected: activate
  negative:
  - id: negative-generate
    prompt: Generate three architecture candidates from these drivers.
    expected: do-not-activate
    expected_alternative: designing-system-architecture
  - id: negative-adr
    prompt: Write the ADR for our already accepted decision.
    expected: do-not-activate
    expected_alternative: recording-architecture-decisions
  - id: negative-benchmark
    prompt: Run a load test and benchmark these implementations.
    expected: do-not-activate
    expected_alternative: performance/testing workflow
procedure:
- id: support-platform-tradeoff
  fixture: fixtures/support-platform-candidate-architectures.md
  required_steps:
  - establish-decision-scope-candidates-drivers-hard-constraints-and-owner
  - normalize-candidates-to-comparable-architecture-level
  - derive-evaluation-criteria-only-from-authoritative-inputs
  - apply-hard-constraint-gate-before-preference-comparison
  - record-evidence-strength-for-material-conclusions
  - compare-primary-and-conditional-driver-support-qualitatively
  - analyze-availability-consistency-security-modifiability-observability-recovery-performance-and-scale-tradeoffs
  - analyze-team-operational-complexity-and-cognitive-load
  - analyze-cost-lockin-reversibility-and-optionality-without-fabricated-numbers
  - analyze-candidate-specific-risks-and-assumption-dependence
  - perform-sensitivity-analysis-for-scale-rto-rpo-provider-capability-retention-and-team-growth
  - avoid-inventing-thresholds-and-fake-numeric-scores
  - identify-dominated-or-pareto-optimal-candidates-only-where-evidence-supports
  - allow-recommendation-conditional-recommendation-defer-or-no-clear-winner
  - define-reversal-triggers-and-targeted-spikes-if-material
  - produce-adr-handoff-and-final-status
  prohibited_actions:
  - score-candidates-87-vs-82-without-model
  - assign-weights-from-analyst-preference
  - invent-scale-threshold
  - invent-cost-estimate
  - claim-microservices-more-scalable-by-default
  - claim-modular-monolith-more-secure-by-default
  - ignore-team-operational-burden
  - force-a-winner
  - silently-waive-constraint
  - write-final-adr
  expected_output: expected/support-platform-tradeoff-analysis.md
edge_cases:
- id: unknown-scale
  scenario: Scale targets are still unknown and distributed candidate's main advantage
    is independent scaling.
  expected_behavior: mark-decision-sensitive-to-scale-and-avoid-claiming-distributed-candidate-wins-without-threshold-evidence
- id: small-team
  scenario: Five engineers own build and operations; distributed candidate has seven
    independently deployed units.
  expected_behavior: treat-operational-and-cognitive-load-as-material-liability-without-automatically-eliminating-candidate
- id: hard-constraint
  scenario: Candidate requires a managed service prohibited by an accepted on-prem
    policy.
  expected_behavior: fail-hard-constraint-gate-and-eliminate-unless-explicit-exception-decision-is-open
- id: pareto
  scenario: Candidate A is simpler/cheaper to operate while Candidate B isolates failures
    better and no stakeholder preference resolves the tension.
  expected_behavior: allow-no-clear-winner-or-defer-rather-than-manufacture-score
- id: dominance
  scenario: Candidate C adds complexity and no material driver benefit compared with
    B under all known evidence.
  expected_behavior: may-mark-c-dominated-if-no-material-unknown-could-reverse-comparison
- id: reversal-trigger
  scenario: Recommendation favors simpler candidate today but strict independent scaling
    may become necessary later.
  expected_behavior: record-explicit-reversal-trigger-with-required-evidence-not-invented-threshold
context_efficiency:
- id: standard-tradeoff-analysis
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/tradeoff-analysis-scope-criteria-and-evidence.md
  - references/quality-attribute-tensions-and-candidate-comparison.md
  - references/risk-assumptions-sensitivity-thresholds-and-reversibility.md
  - references/dominance-pareto-weighting-and-fake-precision.md
  - references/recommendation-defer-reversal-triggers-and-adr-handoff.md
  must_not_load_unless_needed:
  - references/team-operations-migration-cost-and-lockin.md
  - references/atam-inspired-sensitivity-tradeoff-risk-thinking.md
  - evals/
quality_rubric:
  scope_candidate_normalization: 5
  criteria_and_constraint_gate: 5
  evidence_strength: 5
  driver_and_quality_comparison: 5
  team_operations_migration: 5
  cost_lockin_reversibility: 5
  risk_and_assumptions: 5
  sensitivity_thresholds: 5
  dominance_pareto: 5
  no_fake_scoring: 5
  recommendation_or_defer: 5
  reversal_triggers_and_adr_handoff: 5
