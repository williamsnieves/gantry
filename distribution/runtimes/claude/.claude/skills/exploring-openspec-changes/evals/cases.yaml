skill: exploring-openspec-changes
version: 0.1.0

passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  artifact_writes_allowed: 0
  code_writes_allowed: 0
  unsupported_claims_allowed: 0
  regressions_allowed: 0

discovery:
  positive:
    - id: positive-unclear
      prompt: "Explore this idea against the current codebase before we create an OpenSpec change."
      expected: activate
    - id: positive-options
      prompt: "We need to solve duplicate orders, but compare the possible approaches before proposing a change."
      expected: activate
    - id: positive-overlap
      prompt: "Check whether this request belongs to an existing OpenSpec change or needs a new one."
      expected: activate
  negative:
    - id: negative-create
      prompt: "Create the OpenSpec proposal, specs, design, and tasks for this feature."
      expected: do-not-activate
      expected_alternative: creating-openspec-changes
    - id: negative-edit
      prompt: "Update the active OpenSpec change with what we learned."
      expected: do-not-activate
      expected_alternative: editing-openspec-changes
    - id: negative-implement
      prompt: "Implement the approved OpenSpec tasks."
      expected: do-not-activate

procedure:
  - id: unclear-bug
    fixture: fixtures/duplicate-orders.md
    required_steps:
      - frame-problem
      - inspect-openspec-state
      - inspect-current-behavior
      - refine-problem
      - compare-options
      - recommend-action
      - produce-handoff
    prohibited_actions:
      - create-change-directory
      - write-openspec-artifacts
      - modify-code
    expected_output: expected/duplicate-orders.md

  - id: active-overlap
    fixture: fixtures/active-change-overlap.md
    required_steps:
      - inspect-active-changes
      - compare-intent
      - recommend-continue-or-new
    expected_behavior:
      - do-not-default-to-new-change

edge_cases:
  - id: already-clear
    scenario: "The request, approach, affected capability, and acceptance behavior are already fully decided."
    expected_behavior: recommend-direct-creation-handoff
  - id: unsupported-hypothesis
    scenario: "The reported root cause is contradicted by code and tests."
    expected_behavior: correct-understanding-with-evidence
  - id: no-openspec
    scenario: "The repository has no OpenSpec setup but the user intends to adopt it."
    expected_behavior: use-brownfield-exploration-and-report-setup-gap
  - id: no-worthwhile-change
    scenario: "Investigation shows the issue is configuration already supported by the project."
    expected_behavior: recommend-stop-without-change

context_efficiency:
  - id: normal-existing-project
    always_loaded:
      - SKILL.md
    conditionally_loaded:
      - references/exploration-methodology.md
      - references/openspec-state-discovery.md
      - references/option-analysis.md
      - references/handoff-readiness.md
    must_not_load:
      - references/brownfield-exploration.md
      - evals/

quality_rubric:
  evidence_quality: 5
  current_state_accuracy: 5
  openspec_state_awareness: 5
  option_quality: 4
  recommendation_traceability: 5
  handoff_completeness: 5
  non_commitment: 5
  context_efficiency: 4
