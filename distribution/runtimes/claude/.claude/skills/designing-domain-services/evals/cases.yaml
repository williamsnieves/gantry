skill: designing-domain-services
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  infrastructure_dependencies_allowed: 0
  application_orchestration_allowed: 0
  hidden_time_or_randomness_allowed: 0
  entity_invariant_theft_allowed: 0
  generic_service_designs_allowed: 0
  invented_business_rules_allowed: 0
discovery:
  positive:
  - id: positive-policy
    prompt: Design a pure PromotionEligibilityPolicy using Promotion, Subscription,
      and current time.
    expected: activate
  - id: positive-calculator
    prompt: Create a Domain Service that allocates a discount across several items
      while preserving totals.
    expected: activate
  negative:
  - id: negative-entity
    prompt: Add redeem behavior to the Promotion Entity.
    expected: do-not-activate
    expected_alternative: modeling-domain-entities
  - id: negative-use-case
    prompt: Load the promotion, authorize the user, call the provider, and save the
      result.
    expected: do-not-activate
    expected_alternative: designing-application-use-cases
  - id: negative-provider
    prompt: Implement the external promotion provider client.
    expected: do-not-activate
    expected_alternative: implementing-external-service-adapters
  - id: negative-value-object
    prompt: Add currency-safe arithmetic to Money.
    expected: do-not-activate
    expected_alternative: modeling-domain-value-objects
procedure:
- id: eligibility-policy
  fixture: fixtures/promotion-eligibility-policy.md
  required_steps:
  - confirm-service-suitability
  - define-focused-responsibility
  - identify-domain-inputs
  - identify-domain-output
  - catalog-cross-object-rules
  - ensure-purity
  - make-time-explicit
  - preserve-entity-invariants
  - design-errors-or-decisions
  - design-tests
  - check-boundaries
  - decide-readiness
  prohibited_actions:
  - inject-repository
  - inject-provider
  - call-date-now
  - authorize-user
  - save-entity
  - mutate-private-entity-state
  - return-http-response
  - invent-membership-rule
  expected_output: expected/promotion-eligibility-policy-report.md
edge_cases:
- id: entity-owned
  scenario: Only Promotion state is needed to decide whether it can expire.
  expected_behavior: route-to-entity
- id: io-required
  scenario: Eligibility requires loading prior redemptions.
  expected_behavior: use-case-loads-data-then-domain-policy-evaluates
- id: hidden-time
  scenario: Service calls Date.now internally.
  expected_behavior: pass-time-explicitly
- id: currency-allocation
  scenario: Allocation spans Money values with different currencies.
  expected_behavior: reject-or-require-accepted-conversion-context
- id: generic-helper
  scenario: Requested service only wraps array.sort.
  expected_behavior: not-a-domain-service
- id: mutable-input
  scenario: Allocation service sorts and modifies caller array in place.
  expected_behavior: preserve-inputs-return-new-result
context_efficiency:
- id: simple-policy
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/domain-service-suitability.md
  - references/purity-inputs-and-outputs.md
  - references/cross-object-invariants.md
  - references/domain-service-testing.md
  must_not_load:
  - references/time-rates-and-policy-context.md
  - references/refactoring-impure-services.md
  - evals/
quality_rubric:
  service_suitability: 5
  responsibility_focus: 5
  domain_input_output_quality: 5
  cross_object_rules: 5
  purity: 5
  explicit_context: 5
  entity_encapsulation: 5
  error_result_semantics: 5
  test_quality: 5
  boundary_purity: 5
  non_fabrication: 5
  context_efficiency: 4
