skill: designing-component-variants
version: 0.1.0
passing_policy:
  contradictory_boolean_variant_props_allowed: 0
  raw_color_style_knob_as_primary_shared_api_allowed: 0
  feature_specific_variant_in_shared_primitive_allowed: 0
  loading_as_unlabeled_spinner_allowed: 0
  disabled_visual_only_allowed: 0
  compound_variant_explosion_allowed: 0
  class_names_in_public_semantic_contract_allowed: 0
  new_variant_library_selection_allowed: 0
discovery:
  positive:
  - id: positive-button
    prompt: Design the semantic Button variant and size API, including loading and
      disabled behavior.
    expected: activate
  - id: positive-compound
    prompt: Decide whether this component needs compound variants or if independent
      axes are sufficient.
    expected: activate
  - id: positive-shared
    prompt: Review whether this feature-specific visual state belongs as a shared
      primitive variant.
    expected: activate
  negative:
  - id: negative-tailwind
    prompt: Implement these Button variants with Tailwind utilities.
    expected: do-not-activate
    expected_alternative: implementing-tailwind-ui
  - id: negative-cssmodules
    prompt: Implement the CSS Module classes for these variants.
    expected: do-not-activate
    expected_alternative: implementing-css-modules-ui
  - id: negative-tokens
    prompt: Define the global semantic color token taxonomy.
    expected: do-not-activate
    expected_alternative: managing-frontend-design-tokens
procedure:
- id: shared-button-variants
  fixture: fixtures/shared-button-variants.md
  required_steps:
  - confirm-component-purpose-shared-feature-ownership-token-source-and-accessibility
  - inventory-meaningful-variation-and-separate-semantic-axes
  - replace-mutually-exclusive-boolean-props-with-explicit-variant-and-size-axes
  - define-defaults-and-valid-values
  - define-loading-and-disabled-semantics-and-priority
  - evaluate-size-vs-density-and-hit-target-impact
  - define-compound-variants-only-where-independent-axes-are-insufficient
  - prevent-invalid-combinations-proportionately
  - classify-shared-vs-feature-specific-variant-ownership
  - identify-semantic-token-mapping-and-record-token-gaps
  - keep-contract-independent-from-tailwind-css-modules-or-variant-library
  - define-representative-component-and-visual-tests
  - audit-variant-explosion-raw-style-knobs-and-feature-leakage
  - produce-component-variant-design-record
  prohibited_actions:
  - keep-primary-secondary-danger-as-independent-booleans
  - add-subscription-renewal-to-shared-button
  - expose-background-color-prop-instead-of-semantic-variant
  - treat-loading-as-visual-variant-only
  - style-disabled-with-opacity-without-disabled-semantics
  - create-compound-rule-for-every-cartesian-combination
  - select-cva
  - include-tailwind-class-strings-in-public-contract
  expected_output: expected/shared-button-variants-record.md
edge_cases:
- id: button-variants
  scenario: Button currently has primary, secondary, and danger booleans.
  expected_behavior: replace-with-one-semantic-variant-axis
- id: size
  scenario: sm/md/lg change height, padding, type, and icon size.
  expected_behavior: define-coherent-size-scale-and-check-hit-target-accessibility
- id: compound
  scenario: outline + danger requires a specific semantic hover/border mapping.
  expected_behavior: compound-variant-only-if-independent-token-mapping-is-insufficient
- id: loading-disabled
  scenario: Loading button can still be clicked and spinner has no accessible label.
  expected_behavior: define-loading-interaction-policy-block-duplicates-and-preserve-accessible-name
- id: feature-leak
  scenario: Shared Button gets a `renewSubscription` variant used by one feature.
  expected_behavior: reject-feature-leak-use-feature-wrapper-or-existing-semantic-shared-variant
quality_rubric:
  component_ownership_and_semantics: 5
  variant_axis_design: 5
  boolean_prop_cleanup: 5
  size_density_and_defaults: 5
  loading_disabled_behavior: 5
  compound_variants_and_invalid_combinations: 5
  shared_vs_feature_ownership: 5
  token_mapping: 5
  accessibility: 5
  implementation_independence: 5
  testing_and_overmodeling: 5
  final_status: 5
