skill: modeling-use-cases
version: 0.1.0
passing_policy:
  invent_actor_allowed: 0
  internal_component_as_actor_allowed: 0
  ui_click_script_as_use_case_allowed: 0
  architecture_sequence_detail_allowed: 0
  include_extend_as_generic_reuse_allowed: 0
  unresolved_failure_invented_allowed: 0
  privilege_boundary_ignored_allowed: 0
  untraceable_use_case_allowed: 0
  diagram_required_for_every_model_allowed: 0
  compound_manage_everything_use_case_allowed: 0
discovery:
  positive:
  - id: positive-frs
    prompt: Model these functional requirements as structured use cases with actors,
      goals, preconditions, main flow, alternatives, failures and postconditions.
    expected: activate
  - id: positive-privileges
    prompt: Create use cases and an actor-capability model that makes agent versus
      manager privileges clear.
    expected: activate
  - id: positive-external
    prompt: Model the email provider and AI provider as external actors where relevant,
      without designing protocols.
    expected: activate
  negative:
  - id: negative-flowchart
    prompt: Create a flowchart for this approval decision tree.
    expected: do-not-activate
    expected_alternative: modeling-process-flows
  - id: negative-state
    prompt: Model the conversation lifecycle and valid transitions.
    expected: do-not-activate
    expected_alternative: modeling-state-machines
  - id: negative-sequence
    prompt: Create a frontend API service database sequence diagram for reply flow.
    expected: do-not-activate
    expected_alternative: modeling-system-sequences
procedure:
- id: support-platform-use-cases
  fixture: fixtures/support-platform-functional-requirements.md
  required_steps:
  - establish-system-boundary-and-authoritative-fr-scope
  - build-actor-catalog-with-human-and-external-actors
  - group-related-frs-by-meaningful-actor-goal
  - assign-stable-use-case-ids-status-primary-and-supporting-actors
  - define-goal-preconditions-trigger-main-success-flow-and-postconditions
  - capture-requirement-backed-alternative-and-failure-flows
  - expose-agent-manager-tenant-privilege-boundaries
  - model-email-and-ai-providers-as-external-actors-without-protocol-design
  - centralize-and-link-business-rules
  - avoid-ui-api-architecture-and-sequence-leakage
  - use-include-extend-only-when-semantically-justified
  - decide-whether-use-case-diagram-adds-value
  - produce-actor-usecase-capability-and-privilege-matrices
  - trace-use-cases-to-frs-goals-journeys-and-acs
  - audit-functional-coverage-and-missing-use-cases
  - identify-process-flow-state-machine-and-sequence-handoffs
  - produce-use-case-catalog-and-readiness
  prohibited_actions:
  - make-support-api-an-actor
  - make-database-an-actor
  - create-click-button-type-text-submit-usecase
  - create-manage-all-support-as-one-usecase
  - use-include-for-validation-api-call-or-save
  - use-extend-for-every-error-path
  - invent-retention-usecase
  - specify-webhook-or-kafka
  - create-frontend-api-db-sequence
  - choose-architecture
  expected_output: expected/support-platform-use-case-catalog.md
edge_cases:
- id: multiple-actors
  scenario: Agents can reply and managers can also reply plus reassign conversations.
  expected_behavior: model-shared-and-role-specific-capabilities-with-clear-primary-actor-per-use-case-and-privilege-matrix
- id: privilege
  scenario: Only organization managers may reassign conversations inside their organization.
  expected_behavior: model-manager-primary-actor-reassignment-use-case-and-tenant-scope-rule
- id: external-actor
  scenario: Email provider delivers an inbound customer message.
  expected_behavior: model-email-provider-as-external-actor-and-inbound-message-use-case-without-protocol-implementation
- id: alternative
  scenario: Agent may use AI suggestion, but manual reply must remain possible if
    AI is unavailable.
  expected_behavior: represent-ai-assisted-path-as-optional-extension-or-alternative-only-if-semantically-useful-and-keep-manual-reply-base-complete
- id: include-overuse
  scenario: Model contains include relationships for validate form, call API, save
    record, log action.
  expected_behavior: reject-internal-step-include-overuse-and-return-behavior-to-main-flow-or-business-rule
context_efficiency:
- id: standard-use-case-model
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/use-case-boundary-actors-goals-and-granularity.md
  - references/preconditions-triggers-main-alternative-failure-and-postconditions.md
  - references/privilege-boundaries-multiple-actors-and-external-actors.md
  - references/include-extend-generalization-and-diagram-discipline.md
  - references/traceability-coverage-business-rules-and-nfr-links.md
  must_not_load_unless_needed:
  - references/brownfield-and-modeling-handoffs.md
  - evals/
quality_rubric:
  boundary_and_actor_quality: 5
  goal_and_granularity: 5
  preconditions_trigger_main_flow: 5
  alternatives_failures_postconditions: 5
  multiple_actors_and_privileges: 5
  external_actors: 5
  include_extend_generalization: 5
  diagram_discipline: 5
  business_rules_and_nfr_links: 5
  traceability_and_coverage: 5
  no_implementation_leakage: 5
  handoffs_and_readiness: 5
