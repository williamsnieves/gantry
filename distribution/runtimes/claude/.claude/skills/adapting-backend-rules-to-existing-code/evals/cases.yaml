skill: adapting-backend-rules-to-existing-code
version: 0.1.0
passing_policy:
  false_negatives_allowed: 0
  false_positives_allowed: 0
  big_bang_rewrite_allowed: 0
  unrelated_debt_forced_into_scope_allowed: 0
  mandatory_security_or_integrity_debt_deferred_allowed: 0
  undocumented_temporary_deviation_allowed: 0
  new_or_worsened_unaccepted_drift_allowed: 0
  behavior_without_characterization_allowed: 0
  speculative_migration_allowed: 0
discovery:
  positive:
  - id: positive-legacy-controller
    prompt: Add this backend behavior to a legacy controller/service/Prisma flow without
      rewriting the whole module.
    expected: activate
  - id: positive-mixed-architecture
    prompt: Adapt the backend standard to this mixed legacy and hexagonal codebase
      for the current change.
    expected: activate
  - id: positive-temporary-seam
    prompt: Define a safe compatibility seam and debt record while migrating one legacy
      flow.
    expected: activate
  negative:
  - id: negative-greenfield
    prompt: Implement a ready greenfield backend slice inside-out.
    expected: do-not-activate
    expected_alternative: implementing-backend-inside-out
  - id: negative-full-refactor
    prompt: Refactor the complete backend to hexagonal architecture.
    expected: do-not-activate
    expected_alternative: refactoring-backend-toward-hexagonal-architecture
  - id: negative-review
    prompt: Review this PR for backend architecture issues.
    expected: do-not-activate
    expected_alternative: reviewing-backend-architecture
procedure:
- id: legacy-promotion-adaptation
  fixture: fixtures/legacy-promotion-adaptation.md
  required_steps:
  - confirm-one-brownfield-change
  - profile-current-runtime-architecture
  - define-change-local-target-state
  - classify-change-local-rules
  - characterize-current-public-and-data-behavior
  - identify-safe-migration-seams
  - select-incremental-adoption-strategy
  - preserve-contract-data-transaction-and-side-effect-semantics
  - route-target-work-to-focused-skills
  - record-temporary-deviations
  - create-change-adjacent-debt-ledger
  - validate-no-new-or-worsened-drift
  - define-rollback-observability-and-exit-criteria
  - make-brownfield-readiness-decision
  prohibited_actions:
  - rewrite-whole-module
  - rename-legacy-service-as-use-case-without-boundary-change
  - force-unrelated-debt-into-scope
  - defer-tenant-isolation
  - dual-write-without-reconciliation
  - silently-change-public-error-contract
  - accept-deviation-without-owner
  - accept-deviation-without-removal-condition
  - introduce-generic-legacy-bridge
  - claim-no-drift-without-before-after-validation
  expected_output: expected/legacy-promotion-adaptation-record.md
edge_cases:
- id: security-debt
  scenario: Legacy query lacks tenant scoping and the new change touches it.
  expected_behavior: blocking-risk-not-deferred-debt
- id: unrelated-legacy-module
  scenario: Another module has controller-to-ORM coupling but is untouched.
  expected_behavior: record-only-if-change-adjacent-not-forced-into-scope
- id: parallel-run-side-effect
  scenario: Old and new paths would both call the provider.
  expected_behavior: reject-duplicate-real-side-effect-and-use-shadow-safe-comparison
- id: temporary-facade
  scenario: Legacy callers need one compatibility facade during migration.
  expected_behavior: allow-with-explicit-contract-owner-and-removal-condition
- id: unknown-legacy-enum
  scenario: Stored rows contain an enum not supported by the target Domain.
  expected_behavior: explicit-repair-quarantine-compatibility-or-migration-decision
- id: characterization-bug
  scenario: Current behavior contains a known production bug.
  expected_behavior: characterize-reproduction-but-do-not-freeze-as-required-contract-without-decision
context_efficiency:
- id: single-legacy-flow
  always_loaded:
  - SKILL.md
  conditionally_loaded:
  - references/current-and-target-state-mapping.md
  - references/change-local-rule-selection.md
  - references/characterization-and-migration-seams.md
  - references/deviations-and-debt-ledger.md
  - references/brownfield-validation-and-completion.md
  must_not_load:
  - references/compatibility-data-and-transactions.md
  - evals/
quality_rubric:
  current_state_fidelity: 5
  target_state_scope: 5
  change_local_rule_selection: 5
  characterization_quality: 5
  migration_seam_quality: 5
  compatibility_and_data_safety: 5
  transaction_and_side_effect_safety: 5
  incremental_strategy: 5
  deviation_governance: 5
  debt_ledger_quality: 5
  drift_validation: 5
  scope_control_and_non_speculation: 5
  context_efficiency: 4
